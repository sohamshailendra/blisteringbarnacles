<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free bilingual career guidance for Class 10 and 12 students — assessment, career tree, courses, colleges, scholarships and official links.">
  <meta name="theme-color" content="#16233f">
  <title>Mera Bhavishya – Mera Nirnay • Career Guidance Portal</title>

  <!-- Fonts: Devanagari + Latin. For a NIC server without internet access, download these
       fonts and host them locally (see README → "Fonts"). The site still works without them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   STYLES — organised top to bottom:
   1 tokens  2 base  3 header/footer  4 buttons & chips  5 hero  6 cards & grids
   7 forms/filters  8 tree  9 assessment  10 results  11 tables  12 misc  13 responsive  14 print
   ===================================================================== */
/* 1 ── design tokens: change colours here and the whole site follows ── */
:root{
  --fs:1;
  --navy:#16233f; --navy2:#22345c; --ink:#1c2333; --mut:#5a6479; --line:#dfe3ec;
  --bg:#f7f5ef; --card:#fff; --amber:#e29a1f; --amber-d:#a96a05; --amber-l:#fff4dc;
  --blue:#2b6cd4; --teal:#16947f; --orange:#e0701b; --magenta:#b0357d; --green:#2e9b57; --red:#c0392b;
  --r:16px; --sh:0 1px 2px rgba(22,35,63,.06),0 8px 24px rgba(22,35,63,.07);
  --head:'Baloo 2','Noto Sans Devanagari','Noto Sans',system-ui,sans-serif;
  --body:'Noto Sans','Noto Sans Devanagari','Segoe UI',system-ui,-apple-system,sans-serif;
}
/* 2 ── base ── */
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs));scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--head);line-height:1.25;margin:0 0 .5rem;color:var(--navy)}
h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800} h2{font-size:1.6rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0 0 .8rem} img{max-width:100%}
a{color:var(--blue)} a:hover{text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.section{padding:2.2rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--amber);color:#000;padding:.6rem 1rem;z-index:100;font-weight:700}
.skip:focus{left:0}
.muted{color:var(--mut)} .center{text-align:center} .hint{font-size:.85rem;color:var(--mut)} .note{font-size:.88rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:.7rem;margin-top:.8rem}
main:focus{outline:none}
/* 3 ── header & footer ── */
.site-header{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 var(--line)}
.topbar{background:var(--navy);color:#dbe3f5;font-size:.78rem}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.3rem 0}
.tools{display:flex;gap:.25rem;flex:none}
.chip-btn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:6px;padding:.05rem .5rem;cursor:pointer;font:inherit;font-weight:700}
.chip-btn:hover{background:rgba(255,255,255,.15)}
.hbar{display:flex;align-items:center;gap:1rem;padding:.6rem 0}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--navy);flex:none}
.brand img{height:46px;width:auto}
.brand-t{display:flex;flex-direction:column;line-height:1.15}
.brand-t b{font-family:var(--head);font-size:1.15rem;font-weight:800}.brand-t small{color:var(--mut);font-size:.74rem}
.nav{display:flex;gap:0;margin-left:auto;justify-content:flex-end}
.nav a{padding:.4rem .55rem;border-radius:999px;text-decoration:none;color:var(--ink);font-size:.84rem;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--amber-l)} .nav a.on{background:var(--navy);color:#fff}
.lang{display:flex;background:#eef0f6;border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;border-radius:999px;padding:.4rem .9rem;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink);min-height:36px}
.lang button.on{background:var(--amber);color:#1b1200}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:40px;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.burger span{display:block;width:20px;height:2px;background:var(--navy)}
.site-footer{background:var(--navy);color:#c9d3ec;margin-top:2rem;padding-top:2.2rem}
.site-footer a{color:#ffd58a}.site-footer b{color:#fff;font-family:var(--head);font-size:1.05rem}
.foot{display:grid;grid-template-columns:1.2fr 1fr 1.6fr;gap:2rem;font-size:.9rem}
.foot-b{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid rgba(255,255,255,.12);margin-top:1.5rem;padding:1rem 0;font-size:.8rem;flex-wrap:wrap}
/* 4 ── buttons, chips, tags ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--amber);color:#1b1200;border:2px solid var(--amber);padding:.6rem 1.2rem;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(226,154,31,.35)}
.btn-lg{padding:.85rem 1.6rem;font-size:1.05rem;border-radius:14px}.btn.sm{padding:.3rem .8rem;font-size:.85rem}.btn.block{display:flex;width:100%;margin-bottom:.5rem}
.btn-ghost{background:transparent;color:var(--navy);border-color:var(--line)}.btn-ghost:hover{border-color:var(--navy);box-shadow:none}
.btn-light{background:#fff;border-color:#fff;color:var(--navy)}.btn-ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}.btn-ghost-light:hover{background:rgba(255,255,255,.12);box-shadow:none}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit;margin-top:.8rem}
.cta-row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin-top:1.4rem}.cta-row.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .95rem;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink);transition:.15s}
.chip:hover{border-color:var(--navy)}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tag,.eyebrow,.badge{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:.2rem .7rem}
.eyebrow{background:rgba(226,154,31,.18);color:var(--amber);margin-bottom:.8rem}
.tag{background:var(--navy);color:#fff}.badge{background:var(--green);color:#fff;font-size:.68rem;letter-spacing:.03em}
.mini{display:inline-block;background:#eef1f7;color:var(--navy);border-radius:999px;padding:.12rem .65rem;font-size:.76rem;font-weight:600}
.mini.ok{background:#e1f5e8;color:#17693a}.mini.new{background:var(--amber-l);color:var(--amber-d)}.mini.lv{background:#e4edff;color:#1e4fa0}
.minis{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}.minis.light .mini{background:rgba(255,255,255,.16);color:#fff}
.cdot{display:inline-grid;place-items:center;width:1.55rem;height:1.55rem;border-radius:50%;color:#fff;font-size:.78rem;font-weight:700;margin-right:.2rem}.codes{margin-top:.6rem}.codes.lg .cdot{width:2.4rem;height:2.4rem;font-size:1.1rem}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9rem}.pill:hover{border-color:var(--amber);background:var(--amber-l)}
.lnk{font-weight:600;word-break:break-word}
/* 5 ── hero & page headers ── */
.hero{background:radial-gradient(circle at 85% 20%,rgba(226,154,31,.28),transparent 42%),radial-gradient(circle at 5% 100%,rgba(43,108,212,.45),transparent 45%),linear-gradient(135deg,#101a33,#1f3260);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.04)}
.hero-in{display:grid;grid-template-columns:1.25fr .9fr;gap:2.5rem;padding:3.2rem 0 4.4rem;align-items:center;position:relative;z-index:1}
.hero h1{color:#fff}.hero .lead{color:#d6def3}.lead{font-size:1.12rem;max-width:62ch;color:var(--mut)}
.trust{list-style:none;padding:0;margin:1.6rem 0 0;display:flex;gap:1.2rem;flex-wrap:wrap;color:#c9d6f3;font-size:.9rem}
.hero-side{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:1.4rem;backdrop-filter:blur(6px)}
.side-h{font-family:var(--head);font-size:1.1rem;margin-bottom:.8rem;color:#ffd58a}
.gate{display:flex;align-items:center;gap:1rem;background:#fff;color:var(--navy);text-decoration:none;border-radius:16px;padding:.9rem 1.1rem;margin-bottom:.8rem;transition:.2s}
.gate:hover{transform:translateX(4px)}.gate small{display:block;color:var(--mut)}.gate i{margin-left:auto;font-style:normal;font-size:1.4rem;color:var(--amber-d)}
.gate-n{display:grid;place-items:center;width:3rem;height:3rem;border-radius:14px;font-family:var(--head);font-weight:800;font-size:1.4rem;color:#fff;background:var(--blue)}.g12 .gate-n{background:var(--magenta)}
.quote{font-size:.9rem;color:#d6def3;margin:1rem 0 0;font-style:italic}.quote small{font-style:normal;color:#ffd58a}
.page-hero{background:linear-gradient(135deg,#16233f,#23396b);color:#fff;padding:2.4rem 0 2.6rem}.page-hero h1{color:#fff;font-size:clamp(1.7rem,3.6vw,2.4rem)}.page-hero .lead{color:#d6def3;margin:0}.page-hero.slim{padding:1.6rem 0 1.8rem}
.results-hero{background:linear-gradient(135deg,#16233f,#4a2a63)}
.code-line{display:flex;align-items:center;gap:.5rem;margin-top:1rem;font-weight:600}.code-line b{display:grid;place-items:center;width:3rem;height:3rem;border-radius:14px;font-size:1.5rem;font-family:var(--head)}
.career-hero .ch{display:flex;gap:1.2rem;align-items:center;margin-top:.8rem}.back{color:#ffd58a;text-decoration:none;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-radius:18px;box-shadow:var(--sh);margin-top:-2.2rem;position:relative;z-index:2;padding:1rem}
.stats div{text-align:center;padding:.4rem;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats b{display:block;font-family:var(--head);font-size:1.9rem;color:var(--navy);line-height:1.1}.stats span{font-size:.82rem;color:var(--mut)}
.band{background:#efebe0}
/* 6 ── cards & grids ── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:1.3rem 1.4rem;border:1px solid rgba(22,35,63,.05)}
.grid{display:grid;gap:1.1rem}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.sec-t{margin:2.2rem 0 .6rem}.sec-s{margin:1.8rem 0 .8rem}.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.6rem}.sec-head .sec-t{margin:0}.more{font-weight:700;text-decoration:none}
.ico-tile{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:14px;background:var(--amber-l);font-size:1.5rem;flex:none}.ico-tile.xl{width:4.4rem;height:4.4rem;font-size:2.4rem;background:rgba(255,255,255,.14)}
.tile{text-decoration:none;color:var(--ink);position:relative;transition:.2s;display:block}.tile:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(22,35,63,.14)}
.tile p{color:var(--mut);font-size:.92rem;margin:0}.tile .go{position:absolute;right:1.1rem;top:1.1rem;font-size:1.3rem;color:var(--amber-d)}
.tile.t0 .ico-tile{background:#e4edff}.tile.t1 .ico-tile{background:#dff4ee}.tile.t2 .ico-tile{background:var(--amber-l)}.tile.t3 .ico-tile{background:#f8e3ef}
.how .ico-tile{margin-bottom:.6rem}.how p{color:var(--mut);font-size:.92rem;margin:0}
.hscroll{display:flex;gap:1rem;overflow-x:auto;padding:.3rem .2rem 1rem;scroll-snap-type:x mandatory}.mini-c{min-width:250px;max-width:250px;text-decoration:none;color:var(--ink);scroll-snap-align:start}.mini-c p{font-size:.88rem;color:var(--mut);margin:0}.mini-c:hover{box-shadow:0 12px 28px rgba(22,35,63,.14)}
.up{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px dashed var(--line);font-size:.92rem}.up:last-child{border:0}.up span{color:var(--mut);white-space:nowrap}
.goldcard{background:linear-gradient(135deg,#fff4dc,#ffe7b0);border-color:#f0cf8a}.goldcard .btn-light{border-color:var(--navy)}
.car{text-decoration:none;color:var(--ink);transition:.2s;display:block}.car:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(22,35,63,.14)}
.car-h{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem}.car h3{margin:0;font-size:1.05rem}.car small{color:var(--mut)}.car p{font-size:.9rem;color:var(--mut);margin:0}
.col h3{font-size:1.05rem;margin:.5rem 0 .2rem}.col .loc{color:var(--mut);font-size:.9rem}.col p{margin-bottom:.3rem;font-size:.9rem}.col small{color:var(--mut);display:inline-block;min-width:3.8rem;font-weight:700;text-transform:uppercase;font-size:.68rem}
.linkcard{display:flex;align-items:center;gap:.9rem;text-decoration:none;color:var(--ink)}.linkcard small{display:block;color:var(--blue);word-break:break-all}.linkcard:hover{box-shadow:0 12px 28px rgba(22,35,63,.14);transform:translateY(-2px)}
.empty{text-align:center;padding:2.5rem}
.notice{background:var(--amber-l);border-left:5px solid var(--amber);border-radius:10px;padding:.9rem 1.1rem;margin:1.6rem 0;font-size:.92rem}
.notice.warn{background:#fdecea;border-left-color:var(--red)}
.subrow{display:grid;grid-template-columns:7.5rem 1fr auto;align-items:center;gap:.6rem;margin:.45rem 0;font-size:.88rem}.sub-band{font-weight:700;font-size:.82rem}.sub-band.b3{color:var(--green)}.sub-band.b2{color:var(--blue)}.sub-band.b1{color:var(--amber-d)}.sub-band.b0{color:var(--mut)}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e8ecf4;margin-left:3px}.dots i.on{background:var(--amber)}
.valrow{display:grid;grid-template-columns:1.6rem 1fr;gap:.2rem .6rem;align-items:center;margin:.5rem 0}.valrow b{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;grid-row:span 2}.valrow span{font-weight:700}.valrow small{color:var(--mut);font-size:.8rem}
.bar .lvl{font-size:.78rem;white-space:nowrap;text-align:right}.bar .lvl.b3{color:var(--green)}.bar .lvl.b2{color:var(--blue)}.bar .lvl.b1{color:var(--amber-d)}.bar .lvl.b0{color:var(--mut)}
/* 7 ── filters ── */
.filters{display:grid;gap:.9rem;margin-bottom:1.3rem}.frow{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}.frow>span{font-size:.78rem;font-weight:700;text-transform:uppercase;color:var(--mut);min-width:5rem}
.search input{width:100%;font:inherit;padding:.75rem 1rem;border:2px solid var(--line);border-radius:12px;background:#fff}.search input:focus{border-color:var(--amber);outline:none}
.tog{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem;margin-bottom:1.1rem}
/* 8 ── career tree ── */
.tree-tools{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1.4rem}
.root-node{display:inline-flex;align-items:center;gap:.6rem;background:var(--navy);color:#fff;border-radius:999px;padding:.6rem 1.3rem;font-family:var(--head);font-size:1.15rem;box-shadow:var(--sh)}
.tree,.kids{list-style:none;margin:0;padding:0 0 0 1.9rem;position:relative}
.tree{margin-left:1.2rem}
.tree::before,.kids::before{content:"";position:absolute;left:.7rem;top:0;bottom:1.7rem;border-left:2px solid #c8cfdf}
.tree li,.kids li{position:relative;margin:.6rem 0}
.tree li::before,.kids li::before{content:"";position:absolute;left:-1.2rem;top:1.65rem;width:1.2rem;border-top:2px solid #c8cfdf}
.node{--acc:var(--navy)}
.c-blue{--acc:var(--blue)}.c-orange{--acc:var(--orange)}.c-teal{--acc:var(--teal)}.c-green{--acc:var(--green)}.c-amber{--acc:var(--amber)}.c-magenta{--acc:var(--magenta)}
.node-b{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:.75rem 1rem;cursor:pointer;box-shadow:0 1px 2px rgba(22,35,63,.05);transition:.15s}
.node-b:hover{box-shadow:var(--sh)}.node.open>.node-b{background:#fbfcff}
.node-b .ico{font-size:1.5rem}.nt{display:flex;flex-direction:column;flex:1}.nt b{font-family:var(--head);font-size:1.05rem;color:var(--navy)}.nt small{color:var(--mut);font-size:.8rem}
.cnt{background:var(--acc);color:#fff;border-radius:999px;min-width:1.8rem;height:1.8rem;display:grid;place-items:center;font-size:.8rem;font-weight:700}.chev{transition:.2s;color:var(--mut)}.node.open>.node-b .chev{transform:rotate(180deg)}
.leaf{display:flex;align-items:center;gap:.7rem;background:var(--amber-l);border:1px solid #f0d594;border-radius:12px;padding:.5rem .9rem;text-decoration:none;color:var(--ink);transition:.15s}
.leaf:hover{background:#ffe9b8;transform:translateX(3px)}.leaf .ico{font-size:1.3rem}.lt{display:flex;flex-direction:column;line-height:1.3}.lt b{font-size:.95rem}.lt small{color:var(--mut);font-size:.78rem}
.leaf-li::before{top:1.3rem!important}
/* 9 ── assessment ── */
.steps .step{position:relative}.step-n{position:absolute;right:1rem;top:.7rem;font-family:var(--head);font-size:2.4rem;font-weight:800;color:#eceff6}.step p{color:var(--mut);font-size:.92rem;margin:0}.step .ico-tile{margin-bottom:.6rem}
.research{margin-top:2rem;background:#fff}.research ul{padding-left:1.2rem;font-size:.92rem}.research li{margin-bottom:.4rem}
.form fieldset{border:0;padding:0;margin:0 0 1.4rem}.form legend{font-family:var(--head);font-size:1.1rem;color:var(--navy);padding:0;margin-bottom:.3rem;font-weight:700}.form .hint{margin:-.1rem 0 .5rem}
.err{color:var(--red);font-weight:700}
.qwrap{max-width:820px}.progress{height:10px;background:#e4e8f1;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),#f4b94a);border-radius:99px;transition:width .3s}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin:.9rem 0;color:var(--mut);font-size:.9rem}
.qcard{padding:2rem 1.8rem}.q-pre{color:var(--mut);margin:0 0 .3rem;font-weight:600}.q{font-size:clamp(1.3rem,3vw,1.8rem);margin-bottom:1.4rem}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.face{display:flex;flex-direction:column;align-items:center;gap:.3rem;border:2px solid var(--line);background:#fff;border-radius:16px;padding:.8rem .2rem;font:inherit;font-size:.82rem;cursor:pointer;transition:.15s;color:var(--ink)}
.face .em{font-size:2rem;line-height:1}.face:hover{border-color:var(--amber);transform:translateY(-2px)}.face.on{background:var(--amber-l);border-color:var(--amber);font-weight:700;box-shadow:0 0 0 3px rgba(226,154,31,.25)}
.opts{display:grid;gap:.7rem}.opt{display:flex;align-items:center;gap:.9rem;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:.85rem 1rem;font:inherit;font-size:1.02rem;cursor:pointer;transition:.15s;color:var(--ink)}
.opt b{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:#eef1f7;color:var(--navy);flex:none}.opt:hover{border-color:var(--amber)}.opt.on{background:var(--amber-l);border-color:var(--amber);font-weight:600}.opt.on b{background:var(--amber);color:#1b1200}
/* 10 ── results ── */
.res-top{margin-bottom:.5rem}.radar-wrap{display:grid;grid-template-columns:260px 1fr;gap:1rem;align-items:center}.radar{width:100%;height:auto}
.bar{display:grid;grid-template-columns:7.5rem 1fr auto;align-items:center;gap:.6rem;margin:.45rem 0;font-size:.88rem}.bar-t{height:10px;background:#e8ecf4;border-radius:99px;overflow:hidden}.bar-t i{display:block;height:100%;border-radius:99px;background:var(--amber)}.bar b{text-align:right}

@media print{

  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

       hi: 'चयनित सरकारी स्कूलों में व्यावसायिक विषय (जैसे IT, रिटेल, हेल्थकेयर, कृषि, ऑटोमोटिव, इलेक्ट्रॉनिक्स) NSQF के अंतर्गत स्कूली विषयों के साथ पढ़ाए जाते हैं। आप 12वीं भी पूरी करते हैं और कौशल प्रमाणपत्र भी पाते हैं।' },
  study: { en: ['English + language, one or two academic subjects', 'One vocational trade with practicals and internship'], hi: ['अंग्रेज़ी + भाषा, एक-दो शैक्षणिक विषय', 'एक व्यावसायिक ट्रेड — प्रैक्टिकल व इंटर्नशिप सहित'] },
  elig: { en: 'Class 10 pass; available only in schools that offer it — ask your school.', hi: '10वीं उत्तीर्ण; केवल उन स्कूलों में जहाँ उपलब्ध है — अपने स्कूल से पूछें।' },
  exams: { en: 'Class 12 board exam; later diploma, degree or direct job / apprenticeship.', hi: '12वीं बोर्ड परीक्षा; आगे डिप्लोमा, डिग्री या सीधे नौकरी / अप्रेंटिसशिप।' },
  tip: { en: 'A good middle path if you want to study and earn a skill together.', hi: 'पढ़ाई और कौशल साथ-साथ चाहें तो अच्छा मध्य मार्ग।' } },
'any': {
  d: { en: 'These routes do not depend on your stream — you can enter them from Science, Commerce or Arts alike: the forces, government jobs and skill-based self-employment.',
       hi: 'ये मार्ग आपकी स्ट्रीम पर निर्भर नहीं हैं — विज्ञान, वाणिज्य या कला, किसी भी स्ट्रीम से इनमें जा सकते हैं: सेना, सरकारी नौकरियाँ और कौशल-आधारित स्वरोज़गार।' },
  study: { en: ['Exam-specific preparation and physical fitness', 'Skill training'], hi: ['परीक्षा-विशेष तैयारी व शारीरिक फ़िटनेस', 'कौशल प्रशिक्षण'] },
  elig: { en: 'Class 12 pass (any stream), age limits apply.', hi: '12वीं उत्तीर्ण (कोई भी स्ट्रीम), आयु-सीमा लागू।' },
  exams: { en: 'Depends on the career — see each branch below.', hi: 'करियर के अनुसार — नीचे प्रत्येक शाखा देखें।' },
  tip: { en: 'Combine one of these with a degree through open / regular college so you always have a back-up.', hi: 'इनमें से किसी को ओपन / रेगुलर कॉलेज की डिग्री के साथ जोड़ें ताकि हमेशा विकल्प रहे।' } },

/* ------------------------- groups under the streams ------------------------- */
'g-eng': {
  d: { en: 'Engineering turns science into products — machines, roads, circuits, software, vehicles and satellites. B.Tech / B.E. is a 4-year degree with branches such as Computer Science, Electronics, Mechanical, Civil, Electrical, Chemical and AI & Data Science.',
       hi: 'इंजीनियरिंग विज्ञान को उत्पादों में बदलती है — मशीन, सड़क, सर्किट, सॉफ़्टवेयर, वाहन व उपग्रह। B.Tech / B.E. 4 वर्ष की डिग्री है जिसकी शाखाएँ हैं — कंप्यूटर साइंस, इलेक्ट्रॉनिक्स, मैकेनिकल, सिविल, इलेक्ट्रिकल, केमिकल, AI व डेटा साइंस।' },
  study: { en: ['Maths, Physics, programming and core branch subjects', 'Labs, projects and industrial internships'], hi: ['गणित, भौतिकी, प्रोग्रामिंग व मुख्य शाखा के विषय', 'प्रयोगशाला, प्रोजेक्ट व औद्योगिक इंटर्नशिप'] },
  elig: { en: 'Class 12 with Physics, Chemistry and Maths (PCM).', hi: '12वीं में भौतिकी, रसायन व गणित (PCM)।' },
  exams: { en: 'JEE Main (NITs, IIITs, many universities) → JoSAA counselling; JEE Advanced (IITs); HSTES / state tests; university exams.', hi: 'JEE Main (NIT, IIIT, अनेक विश्वविद्यालय) → JoSAA काउंसलिंग; JEE Advanced (IIT); HSTES / राज्य परीक्षाएँ; विश्वविद्यालय परीक्षाएँ।' },
  tip: { en: 'The college and the effort you put in matter more than the branch name. Learn programming and build projects from Class 11.', hi: 'शाखा के नाम से अधिक कॉलेज और आपकी मेहनत मायने रखती है। 11वीं से प्रोग्रामिंग सीखें और प्रोजेक्ट बनाएँ।' } },
'g-design': {
  d: { en: 'Designing buildings and spaces: Architecture (B.Arch, 5 years) combines drawing, maths and creativity; Planning (B.Plan) shapes cities and villages.',
       hi: 'भवनों व स्थानों की डिज़ाइन: आर्किटेक्चर (B.Arch, 5 वर्ष) में ड्रॉइंग, गणित व रचनात्मकता का मेल है; प्लानिंग (B.Plan) शहरों व गाँवों को आकार देती है।' },
  study: { en: ['Architectural design studio, drawing, building materials, structures, history of architecture'], hi: ['आर्किटेक्चरल डिज़ाइन स्टूडियो, ड्रॉइंग, भवन-सामग्री, संरचनाएँ, वास्तुकला का इतिहास'] },
  elig: { en: 'Class 12 with Maths; drawing aptitude.', hi: '12वीं में गणित; ड्रॉइंग की अभिरुचि।' },
  exams: { en: 'NATA or JEE Main Paper 2 → counselling (JoSAA / state).', hi: 'NATA या JEE Main पेपर 2 → काउंसलिंग (JoSAA / राज्य)।' },
  tip: { en: 'Start sketching and observing buildings now — the aptitude test checks drawing and observation.', hi: 'अभी से स्केचिंग व भवनों का अवलोकन शुरू करें — परीक्षा में ड्रॉइंग व अवलोकन परखा जाता है।' } },
'g-pure': {
  d: { en: 'Pure science is for the curious — Physics, Chemistry, Maths, Biology, Biotechnology, Earth and Space science. Careers are in research labs, ISRO / DRDO / CSIR, universities, data science and teaching.',
       hi: 'शुद्ध विज्ञान जिज्ञासुओं के लिए है — भौतिकी, रसायन, गणित, जीव विज्ञान, बायोटेक्नोलॉजी, पृथ्वी व अंतरिक्ष विज्ञान। करियर शोध-प्रयोगशालाओं, ISRO / DRDO / CSIR, विश्वविद्यालयों, डेटा साइंस और शिक्षण में है।' },
  study: { en: ['B.Sc (3 years) or Integrated BS-MS (5 years)', 'Strong theory plus lab research; M.Sc / PhD for research careers'], hi: ['B.Sc (3 वर्ष) या इंटीग्रेटेड BS-MS (5 वर्ष)', 'मज़बूत सिद्धांत व प्रयोगशाला शोध; शोध करियर के लिए M.Sc / PhD'] },
  elig: { en: 'Class 12 Science (PCM or PCB depending on the subject).', hi: '12वीं विज्ञान (विषय अनुसार PCM या PCB)।' },
  exams: { en: 'CUET-UG, IISER Aptitude Test (IAT), NEST, JEE; later JAM / CSIR-NET for M.Sc and PhD.', hi: 'CUET-UG, IISER एप्टीट्यूड टेस्ट (IAT), NEST, JEE; बाद में M.Sc व PhD हेतु JAM / CSIR-NET।' },
  tip: { en: 'Research pays late but gives deep satisfaction; keep patience, reading habit and English strong.', hi: 'शोध में कमाई देर से होती है पर संतोष गहरा मिलता है; धैर्य, पढ़ने की आदत व अंग्रेज़ी मज़बूत रखें।' } },
'g-def': {
  d: { en: 'Serve the nation in the Army, Navy or Air Force — as an officer (NDA, CDS) or as a soldier / sailor / airman (Agniveer). Training, discipline and fitness are central.',
       hi: 'सेना, नौसेना या वायुसेना में देश की सेवा — अधिकारी (NDA, CDS) या सैनिक / नाविक / वायुसैनिक (अग्निवीर) के रूप में। प्रशिक्षण, अनुशासन व फ़िटनेस केंद्रीय हैं।' },
  study: { en: ['Written exam subjects, SSB interview skills, physical training'], hi: ['लिखित परीक्षा के विषय, SSB साक्षात्कार कौशल, शारीरिक प्रशिक्षण'] },
  elig: { en: 'NDA: Class 12 (Maths + Physics for Air Force / Navy), unmarried, age 16.5–19.5. Agniveer: Class 10 / 12 depending on trade, age 17.5–21. Check the latest notice.', hi: 'NDA: 12वीं (वायुसेना / नौसेना हेतु गणित + भौतिकी), अविवाहित, आयु 16.5–19.5। अग्निवीर: ट्रेड अनुसार 10वीं / 12वीं, आयु 17.5–21। नवीनतम अधिसूचना देखें।' },
  exams: { en: 'NDA exam (UPSC) + SSB; CDS after graduation; Agniveer online CEE + physical + medical.', hi: 'NDA परीक्षा (UPSC) + SSB; स्नातक के बाद CDS; अग्निवीर ऑनलाइन CEE + शारीरिक + चिकित्सा।' },
  tip: { en: 'Begin running, push-ups and general-knowledge reading in Class 10–11 itself.', hi: '10वीं–11वीं से ही दौड़, पुश-अप्स व सामान्य-ज्ञान पढ़ना शुरू करें।' } },
'g-health': {
  d: { en: 'The health sector offers many roads, not only “doctor”: MBBS, BDS, AYUSH (BAMS / BHMS), Nursing, Pharmacy, Physiotherapy, Lab and Imaging technology, Optometry and more.',
       hi: 'स्वास्थ्य क्षेत्र में केवल "डॉक्टर" ही नहीं, कई रास्ते हैं: MBBS, BDS, आयुष (BAMS / BHMS), नर्सिंग, फ़ार्मेसी, फ़िज़ियोथेरेपी, लैब व इमेजिंग तकनीक, ऑप्टोमेट्री आदि।' },
  study: { en: ['Anatomy, physiology, biochemistry, clinical training in hospitals'], hi: ['शरीर-रचना, शरीर-क्रिया, जैव-रसायन, अस्पतालों में नैदानिक प्रशिक्षण'] },
  elig: { en: 'Class 12 with Physics, Chemistry, Biology (PCB).', hi: '12वीं में भौतिकी, रसायन, जीवविज्ञान (PCB)।' },
  exams: { en: 'NEET-UG for MBBS / BDS / AYUSH / many nursing and allied courses → MCC or state counselling (DMER Haryana); state tests for some nursing / pharmacy courses.', hi: 'MBBS / BDS / आयुष / अनेक नर्सिंग व संबद्ध कोर्सों हेतु NEET-UG → MCC या राज्य काउंसलिंग (DMER हरियाणा); कुछ नर्सिंग / फ़ार्मेसी कोर्सों हेतु राज्य परीक्षाएँ।' },
  tip: { en: 'Prepare a Plan B inside health itself (nursing, pharmacy, physiotherapy) — they are good careers, not “second choices”.', hi: 'स्वास्थ्य के भीतर ही प्लान B रखें (नर्सिंग, फ़ार्मेसी, फ़िज़ियोथेरेपी) — ये अच्छे करियर हैं, "दूसरी पसंद" नहीं।' } },
'g-agri': {
  d: { en: 'Agriculture, dairy, horticulture, food technology and biotechnology: modern farming, agri-business and research — important in Haryana, home of NDRI Karnal and CCS HAU Hisar.',
       hi: 'कृषि, डेयरी, बागवानी, खाद्य प्रौद्योगिकी व जैव-प्रौद्योगिकी: आधुनिक खेती, कृषि-व्यवसाय व शोध — हरियाणा में महत्त्वपूर्ण, जहाँ NDRI करनाल व CCS HAU हिसार हैं।' },
  study: { en: ['Crop science, soil, plant protection, animal science, farm technology, agri-economics'], hi: ['फ़सल विज्ञान, मृदा, पौध-संरक्षण, पशु विज्ञान, कृषि तकनीक, कृषि-अर्थशास्त्र'] },
  elig: { en: 'Class 12 PCB (or PCM for some courses).', hi: '12वीं PCB (कुछ कोर्सों में PCM)।' },
  exams: { en: 'CUET-UG (ICAR admissions), institute tests such as NDRI.', hi: 'CUET-UG (ICAR दाख़िले), NDRI जैसे संस्थानों की परीक्षाएँ।' },
  tip: { en: 'Combine science with business thinking — agri-startups, food processing and dairy plants need both.', hi: 'विज्ञान के साथ व्यावसायिक सोच जोड़ें — एग्री-स्टार्टअप, फ़ूड प्रोसेसिंग व डेयरी प्लांट को दोनों चाहिए।' } },
'g-fin': {
  d: { en: 'Money careers: Chartered Accountant (CA), Company Secretary (CS), Cost Accountant (CMA), banking, insurance, investment and fintech.',
       hi: 'धन से जुड़े करियर: चार्टर्ड अकाउंटेंट (CA), कंपनी सेक्रेटरी (CS), कॉस्ट अकाउंटेंट (CMA), बैंकिंग, बीमा, निवेश व फ़िनटेक।' },
  study: { en: ['Accounting, taxation, auditing, company law, economics, financial markets'], hi: ['लेखा, कराधान, अंकेक्षण, कंपनी विधि, अर्थशास्त्र, वित्तीय बाज़ार'] },
  elig: { en: 'Class 12 Commerce (any stream can enrol for CA / CS).', hi: '12वीं वाणिज्य (CA / CS में किसी भी स्ट्रीम से प्रवेश)।' },
  exams: { en: 'CA / CS / CMA Foundation (ICAI, ICSI, ICMAI); CUET-UG for B.Com; IBPS / SBI exams after graduation.', hi: 'CA / CS / CMA फ़ाउंडेशन (ICAI, ICSI, ICMAI); B.Com हेतु CUET-UG; स्नातक के बाद IBPS / SBI परीक्षाएँ।' },
  tip: { en: 'Professional courses need steady daily study for years — try the foundation syllabus before deciding.', hi: 'प्रोफ़ेशनल कोर्सों में वर्षों तक रोज़ नियमित पढ़ाई चाहिए — निर्णय से पहले फ़ाउंडेशन पाठ्यक्रम देखें।' } },
'g-biz': {
  d: { en: 'Business and management: lead teams, run companies, start your own venture, or work in hotels, tourism and events.',
       hi: 'व्यवसाय व प्रबंधन: टीमें चलाएँ, कंपनी संभालें, अपना उद्यम शुरू करें, या होटल, पर्यटन व इवेंट में काम करें।' },
  study: { en: ['BBA / BMS, Integrated Programme in Management (IPM), Hotel Management', 'Marketing, finance, HR, operations, entrepreneurship'], hi: ['BBA / BMS, इंटीग्रेटेड मैनेजमेंट प्रोग्राम (IPM), होटल मैनेजमेंट', 'मार्केटिंग, फ़ाइनेंस, HR, ऑपरेशन्स, उद्यमिता'] },
  elig: { en: 'Class 12 any stream (Commerce / Maths helps).', hi: '12वीं किसी भी स्ट्रीम से (वाणिज्य / गणित सहायक)।' },
  exams: { en: 'CUET-UG, IPMAT (IIM Rohtak / Indore), NCHM-JEE (hotel management), university tests; CAT / MAT after graduation for MBA.', hi: 'CUET-UG, IPMAT (IIM रोहतक / इंदौर), NCHM-JEE (होटल मैनेजमेंट), विश्वविद्यालय परीक्षाएँ; MBA हेतु स्नातक के बाद CAT / MAT।' },
  tip: { en: 'Communication, leadership and real small ventures (even a school fest stall) build the best profile.', hi: 'संवाद, नेतृत्व और छोटे वास्तविक उद्यम (स्कूल मेले का स्टॉल भी) सबसे अच्छी प्रोफ़ाइल बनाते हैं।' } },
'g-tech': {
  d: { en: 'Commerce students can enter technology too — BCA, B.Sc Computer Science, data analytics, cyber security — especially if they took Maths or Informatics Practices in Class 11–12.',
       hi: 'वाणिज्य के विद्यार्थी भी तकनीक में जा सकते हैं — BCA, B.Sc कंप्यूटर साइंस, डेटा एनालिटिक्स, साइबर सुरक्षा — विशेषकर यदि 11–12 में गणित या इन्फ़ॉर्मेटिक्स प्रैक्टिसेज़ लिया हो।' },
  study: { en: ['Programming, databases, networks, statistics, web / app development'], hi: ['प्रोग्रामिंग, डेटाबेस, नेटवर्क, सांख्यिकी, वेब / ऐप विकास'] },
  elig: { en: 'Class 12 Commerce (Maths preferred) for BCA / B.Sc; B.Tech needs PCM.', hi: '12वीं वाणिज्य (गणित बेहतर) — BCA / B.Sc हेतु; B.Tech हेतु PCM आवश्यक।' },
  exams: { en: 'CUET-UG, university entrance tests, NIELIT courses.', hi: 'CUET-UG, विश्वविद्यालय प्रवेश परीक्षाएँ, NIELIT कोर्स।' },
  tip: { en: 'Free online courses and small projects matter as much as the degree in this field.', hi: 'इस क्षेत्र में मुफ़्त ऑनलाइन कोर्स व छोटे प्रोजेक्ट डिग्री जितने ही महत्त्वपूर्ण हैं।' } },
'g-svc': {
  d: { en: 'Public service, justice and safety: IAS / IPS / HCS officers, lawyers and judges, police and paramilitary, and other government posts.',
       hi: 'जनसेवा, न्याय व सुरक्षा: IAS / IPS / HCS अधिकारी, वकील व न्यायाधीश, पुलिस व अर्धसैनिक बल तथा अन्य सरकारी पद।' },
  study: { en: ['BA / BA LLB; polity, history, geography, economics, current affairs, law subjects'], hi: ['BA / BA LLB; राजनीति, इतिहास, भूगोल, अर्थशास्त्र, समसामयिकी, विधि विषय'] },
  elig: { en: 'Class 12 any stream. UPSC / HCS need a graduate degree; Police constable needs Class 12; Sub-Inspector needs graduation.', hi: '12वीं किसी भी स्ट्रीम से। UPSC / HCS हेतु स्नातक; पुलिस कांस्टेबल हेतु 12वीं; सब-इंस्पेक्टर हेतु स्नातक।' },
  exams: { en: 'CLAT / CUET (law), UPSC Civil Services, HPSC (HCS), HSSC CET, SSC, Police recruitment exams.', hi: 'CLAT / CUET (विधि), UPSC सिविल सेवा, HPSC (HCS), HSSC CET, SSC, पुलिस भर्ती परीक्षाएँ।' },
  tip: { en: 'Read a newspaper daily and keep a graduation degree as your base while preparing.', hi: 'रोज़ अख़बार पढ़ें और तैयारी के साथ स्नातक की डिग्री आधार रखें।' } },
'g-media': {

  <script>
/* =====================================================================
   API  — talks to the Node backend (server/server.js).
   If there is NO backend (plain static hosting, file://, preview.html), App.API.online stays
   false and the site simply uses the data bundled in js/data/*.js — nothing breaks.
   ===================================================================== */
(function () {
  'use strict';
  var API = App.API = { online: false, checked: false, meta: null, ready: null };   // checked = we know whether a backend exists

  function timeout(ms) { return new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); }); }
  API.get = function (path) {
    return fetch(path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (!r.ok || ct.indexOf('json') < 0) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  };
  API.qs = function (o) {
    return Object.keys(o).filter(function (k) { return o[k] !== '' && o[k] != null && o[k] !== 'all'; })
      .map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&');
  };

  function fill(target, items) { target.length = 0; Array.prototype.push.apply(target, items); }
  function both(en, hi) { return { en: en, hi: hi || en }; }

  /* rows from the admin sheet (flat) → the nested shape the pages use */
  function toScholarship(r) {
    return { id: r.id, from: +r.from || 9, tags: String(r.tags || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean), url: r.url, site: r.site,
      name: both(r.name_en, r.name_hi), who: both(r.who_en, r.who_hi) };
  }
  function toLink(r) { return { g: r.group, ico: r.ico || '🔗', name: both(r.name_en, r.name_hi), url: r.url }; }

  API.init = function () {
    API.ready = Promise.race([API.get('api/meta'), timeout(3000)]).then(function (meta) {
      API.online = true; API.meta = meta;
      return Promise.all([API.get('api/public/scholarships'), API.get('api/public/links')]).then(function (res) {
        if (res[0].length) fill(window.SCHOLARSHIPS, res[0].map(toScholarship));
        if (res[1].length) fill(window.LINKS, res[1].map(toLink));
      }).catch(function () { /* keep bundled lists */ });
    }).then(function () {
      API.checked = true;
      var r = (location.hash || '#/').replace(/^#\/?/, '').split('/')[0] || 'home';
      if (['home', 'scholarships', 'links', 'colleges', 'school', 'certificate'].indexOf(r) > -1) App.rerender(true);
    }).catch(function () { API.online = false; API.checked = true; if (/^#\/(colleges|school)/.test(location.hash || '')) App.rerender(true); });
    return API.ready;
  };
  document.addEventListener('DOMContentLoaded', function () { API.init(); });
})();

</script>
  <script>
/* =====================================================================
   ASSESSMENT  — questionnaire flow, scoring, matching and the results page  (v2)
   Flow:  intro → situation → subjects (8) → interests (30) → values (8) → aptitude (16) → learning (4) → readiness (3) → results
   Scoring (all in the browser, nothing is sent anywhere):
     interest fit   = closeness of the student's RELATIVE RIASEC profile to the career's code      (0–100)
     aptitude fit   = share of correct answers in the areas the career needs                        (0–100)
     readiness      = marks + confidence in the school subjects behind those areas (self-efficacy)  (0–100)
     values fit     = how important the things this career offers are to the student               (0–100)
     feasibility    = cost vs. budget/loan, years-to-earn, moving away, internet                    (0–100)
     "Dream"     = 55% interest + 15% aptitude + 15% readiness + 15% values
     "Practical" = 40% interest + 10% aptitude + 10% readiness + 10% values + 30% feasibility
   Readiness-stage answers are never scored; they only choose the "next steps".
   ===================================================================== */
(function () {
  'use strict';
  /* Saved answers expire after 24 h: on a shared school computer the next student must not inherit
     the previous one's category / income / disability answers. */
  var TTL = 24 * 60 * 60 * 1000, VER = 2;
  function fresh() { return { v: VER, step: 'intro', i: 0, profile: {}, ans: {}, ts: Date.now() }; }
  var A = App.A = App.Store.get('assess', null) || fresh();
  if (A.v !== VER || !A.ts || Date.now() - A.ts > TTL) { App.Store.del('assess'); A = App.A = fresh(); }

  var FACES = [['😖', 'sc1'], ['🙁', 'sc2'], ['😐', 'sc3'], ['🙂', 'sc4'], ['😍', 'sc5']];

    var q = [];

    });
    INTEREST_ITEMS.forEach(function (it, i) { q.push({ sec: 'int', type: 'scale', key: 'int:' + i, item: it }); });
    VALUES_ITEMS.forEach(function (it) { q.push({ sec: 'val', type: 'imp', key: 'val:' + it[0], item: it }); });

      (A.step === 'done' ? '<a class="btn btn-ghost btn-lg" href="#/results">' + t('as_see_res') + '</a>' : '') +
      (started ? '<button class="btn btn-ghost btn-lg" data-act="a_clear">🗑 ' + t('clear_data') + '</button>' : '') +
      '<span class="muted">⏱ ' + t('as_time') + ' · 🔒 ' + t('as_priv') + '</span></div>' +
      '<div class="card research"><h3>🔬 ' + t('rs_t') + '</h3><p>' + t('rs_p') + '</p><ul>' +
      ['rs_1', 'rs_2', 'rs_3', 'rs_6', 'rs_4', 'rs_5', 'rs_7'].map(function (k) { return '<li>' + t(k) + '</li>'; }).join('') + '</ul>' +

  function profileView() {

      '<div class="q-meta"><span class="tag">' + t('as_step') + ' ' + stepNo + '/7 · ' + t(SEC[q.sec]) + ' ' + q.n + '/' + q.tot + '</span><span>' + t('question') + ' ' + (i + 1) + ' / ' + nq + '</span></div>' +

  }

  /* ----------------------------- actions ----------------------------- */
  var ac = App.actions;
  ac.a_start = function () { A.step = 'profile'; A.i = 0; A.ans = {}; save(); App.rerender(); window.scrollTo(0, 0); };
  ac.a_resume = function () { App.rerender(); window.scrollTo(0, 0); };
  ac.a_clear = function () { if (window.confirm(t('clear_confirm'))) { wipe(); App.go('assess'); App.render(); window.scrollTo(0, 0); } };
  ac.a_home = function () { A.step = 'intro'; save(); App.rerender(); };
  ac.a_prof = function (el) {
    A.profile[el.getAttribute('data-f')] = el.getAttribute('data-v');
    if (A.profile.cls === '10') delete A.profile.stream;
    save(); App.rerender(true);
  };
  ac.a_prof_next = function () {
    var p = A.profile;

    A.step = 'q'; A.i = Math.min(A.i, NQ() - 1); save(); App.rerender(); window.scrollTo(0, 0);
  };
  ac.a_ans = function (el) {

  ac.a_next = function () {

    A.i++; save(); App.rerender(); window.scrollTo(0, 0);
  };
  ac.a_back = function () { if (A.i === 0) { A.step = 'profile'; } else A.i--; save(); App.rerender(); window.scrollTo(0, 0); };

  /* ------------------------------ scoring ------------------------------ */
  var DEF = { income: '3', earn: 'mid', away: 'yes', loan: 'maybe', net: 'phone', gender: 'o', cat: 'gen', dis: 'n' };
  function P(k) { return A.profile[k] != null ? A.profile[k] : DEF[k]; }
  function centre(obj, keys) {                       // person-centred scores: 50 = this student's own average
    var mean = 0, n = 0, varc = 0, out = {};
    keys.forEach(function (k) { if (obj[k] != null) { mean += obj[k]; n++; } }); mean = n ? mean / n : 50;
    keys.forEach(function (k) { if (obj[k] != null) varc += (obj[k] - mean) * (obj[k] - mean); });
    keys.forEach(function (k) { out[k] = obj[k] == null ? 50 : Math.max(0, Math.min(100, Math.round(50 + (obj[k] - mean) * 1.5))); });
    return { rel: out, sd: n ? Math.sqrt(varc / n) : 0, mean: mean };
  }

  function compute() {
    var types = 'RIASEC'.split(''), sum = {}, cnt = {};
    types.forEach(function (x) { sum[x] = 0; cnt[x] = 0; });
    INTEREST_ITEMS.forEach(function (it, i) { var v = A.ans['int:' + i]; sum[it[0]] += (v || 3); cnt[it[0]]++; });
    var ri = {}; types.forEach(function (x) { ri[x] = Math.round((sum[x] / cnt[x] - 1) / 4 * 100); });
    var c = centre(ri, types);
    var order = types.slice().sort(function (a, b) { return ri[b] - ri[a] || types.indexOf(a) - types.indexOf(b); });
    var careless = CONSISTENCY_PAIRS.some(function (pr) { var a = A.ans['int:' + pr[0]], b = A.ans['int:' + pr[1]]; return a != null && b != null && Math.abs(a - b) >= 3; });

    var ap = { num: [0, 0], log: [0, 0], verb: [0, 0], spa: [0, 0] }, right = 0, attempted = 0;
    APTITUDE_ITEMS.forEach(function (it, i) {
      var v = A.ans['apt:' + i]; if (v == null || v < 0) return;          // skipped → not counted against the student
      attempted++; ap[it.k][1]++; if (v === it.a) { ap[it.k][0]++; right++; }
    });
    var apt = {}; for (var k in ap) apt[k] = ap[k][1] ? Math.round(ap[k][0] / ap[k][1] * 100) : null;   // null = not attempted

    /* subjects: marks band (60%) + confidence (40%) */
    var sub = {}, subList = subjects();
    subList.forEach(function (s) {
      var mi = A.ans['sub:' + s[0] + ':m'], ci = A.ans['sub:' + s[0] + ':c'];
      var m = mi != null && MARK_BANDS[mi] ? MARK_BANDS[mi][0] : null, cf = ci != null ? Math.round((ci - 1) / 4 * 100) : null;
      var score = m != null && cf != null ? Math.round(0.6 * m + 0.4 * cf) : m != null ? m : cf;
      sub[s[0]] = { name: s[1], band: mi, m: m, c: ci, score: score };
    });

    var vals = {}; VALUES_ITEMS.forEach(function (it) { var v = A.ans['val:' + it[0]]; vals[it[0]] = v != null ? Math.round((v - 1) / 4 * 100) : null; });
    var vc = centre(vals, VALUES_ITEMS.map(function (x) { return x[0]; }));
    var vorder = VALUES_ITEMS.map(function (x) { return x[0]; }).sort(function (a, b) { return (vals[b] || 0) - (vals[a] || 0) || vc.rel[b] - vc.rel[a]; });

    var lc = { V: 0, A: 0, R: 0, K: 0 };
    LEARN_ITEMS.forEach(function (it, i) { var v = A.ans['lrn:' + i]; if (v != null && it.o[v]) lc[it.o[v][0]]++; });
    var lorder = Object.keys(lc).sort(function (a, b) { return lc[b] - lc[a]; });

    var rdSum = 0, rdN = 0;
    READINESS_ITEMS.forEach(function (it, i) { var v = A.ans['rd:' + i]; if (v != null && it.o[v]) { rdSum += it.o[v][0]; rdN++; } });
    var rdLevel = !rdN ? 1 : rdSum <= 1 ? 0 : rdSum <= 4 ? 1 : 2;

    return { ri: ri, rel: c.rel, flat: c.sd < 8, careless: careless, order: order, code: order.slice(0, 3).join(''),
      apt: apt, aptRight: right, aptTried: attempted, sub: sub, subList: subList, vals: vals, vrel: vc.rel, vorder: vorder,
      lc: lc, lstyle: lorder[0], lstyle2: lc[lorder[1]] === lc[lorder[0]] ? lorder[1] : null, rd: rdLevel };
  }

  function interestFit(c, r) {
    var w = [3, 2, 1], s = 0, ws = 0;
    c.ri.split('').forEach(function (ch, i) { s += w[i] * r.rel[ch]; ws += w[i]; });
    return s / ws;
  }
  function aptFit(c, r) {
    if (!c.ap.length) return 60;
    var s = 0; c.ap.forEach(function (k) { s += (r.apt[k] == null ? 50 : r.apt[k]); }); return s / c.ap.length;
  }
  /* academic readiness: average score of the school subjects behind the aptitudes this career needs */
  function readiness(c, r) {
    var map = SUBJECT_MAP[track()], keys = {}, s = 0, n = 0, weak = [];
    (c.ap.length ? c.ap : ['verb']).forEach(function (a) { (map[a] || []).forEach(function (k) { keys[k] = 1; }); });
    Object.keys(keys).forEach(function (k) { var x = r.sub[k]; if (x && x.score != null) { s += x.score; n++; if (x.score < 45) weak.push(L(x.name)); } });
    return { v: n ? s / n : 60, weak: weak, known: n > 0 };
  }
  function valuesFit(c, r) {
    var ks = (CAREER_VALUES[c.id] || []).slice(); if (!c.reloc && ks.indexOf('near') < 0) ks.push('near');
    if (!ks.length) return { v: 50, hits: [] };
    var s = 0; ks.forEach(function (k) { s += r.vrel[k]; });
    var hits = ks.filter(function (k) { return r.vrel[k] >= 62 && (r.vals[k] || 0) >= 75; });
    return { v: s / ks.length, hits: hits };
  }
  function feasibility(c) {
    var f = 100, why = [];
    var a = { '1': 0, '2': 1, '3': 2, '4': 3 }[P('income')] + (P('loan') === 'yes' ? 1 : P('loan') === 'maybe' ? 0.5 : 0);
    var pen = Math.max(0, (c.cost - 1 - a)) * 25; f -= pen; if (pen) why.push('cost');
    var allowed = { soon: 2.5, mid: 4.5, long: 99 }[P('earn')];
    if (c.earn > allowed) { f -= Math.min(40, (c.earn - allowed) * 15); why.push('time'); }
    if (c.reloc && P('away') === 'no') { f -= 30; why.push('away'); } else if (c.reloc && P('away') === 'state') f -= 10;
    if (P('net') === 'none' && c.tag && c.tag.indexOf('emerging') > -1) { f -= 10; why.push('net'); }
    return { v: Math.max(0, f), why: why };
  }
  function scoreAll(list, r) {
    return list.map(function (c) {
      var i = interestFit(c, r), a = aptFit(c, r), rd = readiness(c, r), vf = valuesFit(c, r), fe = feasibility(c);
      var why = fe.why.slice(), weakK = rd.known && rd.v < 40; if (weakK) why.push('marks');
      /* weak marks in the subjects behind a career cap how "great" the fit can look, on top of the readiness term */
      return { c: c, i: i, a: a, rd: rd.v, weak: rd.weak, v: vf.v, hits: vf.hits, f: fe.v, why: why,
        dream: (0.55 * i + 0.15 * a + 0.15 * rd.v + 0.15 * vf.v) * (weakK ? 0.9 : 1),
        prac: (0.40 * i + 0.10 * a + 0.10 * rd.v + 0.10 * vf.v + 0.30 * fe.v) * (weakK ? 0.85 : 1) };
    });
  }
  function pool() {
    var cls = A.profile.cls, st = A.profile.stream;
    if (cls === '12') return CAREERS.filter(function (c) { return c.lv.indexOf('12') > -1 && (c.st.indexOf('any') > -1 || c.st.indexOf(st) > -1); });
    return CAREERS.filter(function (c) { return c.lv.indexOf('12') > -1; });
  }
  /* ranking: score first; on a tie prefer the career that is specific to the student's stream over an
     "any stream" route, then higher interest fit, then aptitude, then the name — never the order of the data file */
  function spec(c) { return c.st.indexOf('any') > -1 ? 0 : 1; }
  function top(arr, key, n, skip) {
    var out = arr.filter(function (s) { return !skip || skip.indexOf(s.c.id) < 0; });
    return out.sort(function (a, b) {
      return (b[key] - a[key]) || (spec(b.c) - spec(a.c)) || (b.i - a.i) || (b.a - a.a) || (L(a.c.name) < L(b.c.name) ? -1 : 1);
    }).slice(0, n);
  }
  /* aptitude shown as a band, never as a raw % — the screener is too short for a percentage to mean much */
  App.aptBand = function (pct) { return pct == null ? 'apt_b0' : pct >= 75 ? 'apt_b3' : pct >= 50 ? 'apt_b2' : 'apt_b1'; };

  /* ---- scholarships that match the profile (also used by the Scholarships page) ---- */
  App.matchSch = function (s) {
    var m = [], cls = +(A.profile.cls || 12), tg = s.tags;
    if (!A.profile.cls) return null;
    var cat = P('cat'), inc = +P('income');
    if (tg.indexOf('girls') > -1 && P('gender') === 'f') m.push('sm_girl');
    if (tg.indexOf('sc') > -1 && cat === 'sc') m.push('sm_sc');
    if (tg.indexOf('bc') > -1 && cat === 'bc') m.push('sm_bc');
    if (tg.indexOf('disabled') > -1 && P('dis') === 'y') m.push('sm_dis');
    if (tg.indexOf('income') > -1 && inc <= 3 && !(tg.indexOf('sc') > -1 || tg.indexOf('bc') > -1)) m.push('sm_inc');
    if (tg.indexOf('merit') > -1 && m.indexOf('sm_inc') < 0) m.push('sm_merit');
    if (tg.indexOf('loan') > -1 && (P('loan') !== 'no' || inc >= 3)) m.push('sm_loan');
    if (tg.indexOf('stem') > -1 && (A.profile.stream === 'pcm' || A.profile.stream === 'pcb' || cls === 10) && m.length === 0) m.push('sm_stem');
    if (tg.indexOf('all') > -1 && m.length === 0) m.push('sm_all');
    if (tg.indexOf('inst') > -1) m.push('sm_inst');
    var strong = m.some(function (x) { return x !== 'sm_merit' && x !== 'sm_stem'; });
    if (s.to && cls > s.to) return { reasons: [], score: 0, later: false };   // window already closed (e.g. NMMS exam is in Class 8)
    return { reasons: m, score: m.length ? (strong ? 2 : 1) : 0, later: s.from > cls };
  };

  /* ---- everything the results page and the certificate need, computed once ---- */
  App.report = function () {
    if (A.step !== 'done') return null;
    var r = compute(), cls = A.profile.cls, sc = scoreAll(pool(), r);
    var R = { r: r, cls: cls, sc: sc, ls: LEARN_STYLES[r.lstyle], dream: top(sc, 'dream', 3), prac: top(sc, 'prac', 3) };
    var shown = R.dream.concat(R.prac).map(function (s) { return s.c.id; });
    R.more = top(sc, 'prac', 6, shown);                                   // never repeats a card already shown
    if (cls === '10') {
      var long = top(sc, 'dream', 8), cnt = {};
      long.forEach(function (s, idx) { var k = s.c.rs || s.c.st[0]; if (k !== 'any') cnt[k] = (cnt[k] || 0) + (8 - idx); });
      /* gate by marks: a stream whose core subjects are weak is demoted, and the student is told why */
      var gate = {};
      Object.keys(cnt).forEach(function (k) {
        var need = STREAM_NEEDS[k] || [], s = 0, n = 0, weak = [];
        need.forEach(function (sk) { var x = r.sub[sk]; if (x && x.score != null) { s += x.score; n++; if (x.score < 45) weak.push(L(x.name)); } });
        var v = n ? s / n : 60; gate[k] = { f: v < 40 ? 0.5 : v < 55 ? 0.8 : 1, weak: weak };
        cnt[k] = cnt[k] * gate[k].f;
      });
      R.streams = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
      var topGate = gate[R.streams[0]];
      if (topGate && topGate.weak.length) R.streamWeak = topGate.weak;
      R.direct = top(scoreAll(CAREERS.filter(function (c) { return c.lv.indexOf('10') > -1; }), r), 'prac', 3);
    }
    R.sch = SCHOLARSHIPS.map(function (s) { return { s: s, m: App.matchSch(s) }; }).filter(function (x) { return x.m && x.m.score > 0; })
      .sort(function (a, b) { return b.m.score - a.m.score; }).slice(0, 4);
    R.topVals = r.vorder.slice(0, 3);
    R.subs = r.subList.map(function (s) { return r.sub[s[0]]; });
    var rs = READINESS_STEPS[r.rd];
    R.stage = rs.name;
    R.steps = (App.lang === 'hi' ? rs.hi : rs.en).concat([t(cls === '10' ? 'ns10_4' : 'ns12_3')]);
    return R;
  };

  /* ------------------------------ results ------------------------------ */
  function radar(r) {
    var types = 'RIASEC'.split(''), cx = 150, cy = 140, R = 95, pts = [], grid = '', axes = '', labels = '';
    for (var g = 1; g <= 4; g++) {
      var gp = types.map(function (_, i) { var an = -Math.PI / 2 + i * Math.PI / 3; return (cx + R * g / 4 * Math.cos(an)).toFixed(1) + ',' + (cy + R * g / 4 * Math.sin(an)).toFixed(1); }).join(' ');
      grid += '<polygon points="' + gp + '" fill="none" stroke="#d9dfeb" stroke-width="1"/>';
    }
    types.forEach(function (x, i) {
      var an = -Math.PI / 2 + i * Math.PI / 3, v = Math.max(8, r.ri[x]) / 100;
      pts.push((cx + R * v * Math.cos(an)).toFixed(1) + ',' + (cy + R * v * Math.sin(an)).toFixed(1));
      axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(an)).toFixed(1) + '" y2="' + (cy + R * Math.sin(an)).toFixed(1) + '" stroke="#d9dfeb"/>';
      var lx = cx + (R + 22) * Math.cos(an), ly = cy + (R + 22) * Math.sin(an);
      labels += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="14" fill="' + RIASEC[x].c + '"/><text x="' + lx.toFixed(1) + '" y="' + (ly + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">' + x + '</text>';
    });
    return '<svg viewBox="0 0 300 280" class="radar" role="img" aria-label="' + t('res_radar') + '">' + grid + axes + '<polygon points="' + pts.join(' ') + '" fill="rgba(226,154,31,.28)" stroke="#e29a1f" stroke-width="2.5" stroke-linejoin="round"/>' + labels + '</svg>';
  }
  function bar(label, pct, color) {
    return '<div class="bar"><span class="bar-l">' + label + '</span><span class="bar-t"><i style="width:' + Math.max(3, pct) + '%;background:' + color + '"></i></span><b>' + pct + '%</b></div>';
  }
  function aptRow(label, pct) {
    var b = App.aptBand(pct), lvl = b === 'apt_b3' ? 3 : b === 'apt_b2' ? 2 : b === 'apt_b1' ? 1 : 0;
    return '<div class="bar"><span class="bar-l">' + label + '</span><span class="bar-t"><i style="width:' + (lvl * 33) + '%;background:#2b6cd4"></i></span><b class="lvl b' + lvl + '">' + t(b) + '</b></div>';
  }
  function subRow(s) {
    var band = s.band != null ? L(MARK_BANDS[s.band][1]) : '—', dots = '';
    for (var k = 1; k <= 5; k++) dots += '<i class="' + (s.c != null && k <= s.c ? 'on' : '') + '"></i>';
    var lvl = s.score == null ? 'b0' : s.score >= 65 ? 'b3' : s.score >= 45 ? 'b2' : 'b1';
    return '<div class="subrow"><span class="bar-l">' + esc(L(s.name)) + '</span><span class="sub-band ' + lvl + '">' + esc(band) + '</span><span class="dots" title="' + esc(t('q_conf').replace('{s}', L(s.name))) + '">' + dots + '</span></div>';
  }
  function chips(s) {
    var out = ['<span class="mini">' + ['', '₹ ' + t('c_low'), '₹₹ ' + t('c_mid'), '₹₹₹ ' + t('c_high')][s.c.cost] + '</span>',
      '<span class="mini">⏳ ' + (s.c.earn <= 1 ? '≤1' : s.c.earn) + ' ' + t('yrs') + '</span>',
      '<span class="mini">' + (s.c.reloc ? '🚆 ' + t('may_move') : '🏠 ' + t('local_ok')) + '</span>'];
    return out.join('');
  }
  function recCard(s, r, kind) {
    var c = s.c, topLetters = r.code.split(''), match = c.ri.split('').filter(function (x) { return topLetters.indexOf(x) > -1; });
    var val = Math.round(kind === 'prac' ? s.prac : s.dream);
    var label = val >= 70 ? t('fit_great') : val >= 52 ? t('fit_good') : t('fit_poss');
    var notes = [];
    if (match.length) notes.push(t('why_int') + ' ' + match.map(function (x) { return L(RIASEC[x].name).split(' — ')[0]; }).join(' + '));
    if (s.hits.length) notes.push('💛 ' + t('why_val') + ' ' + s.hits.map(function (k) { return L(VALUE_NAMES[k]); }).join(', '));
    var wmap = { cost: 'why_cost', time: 'why_time', away: 'why_away', net: 'why_net', marks: 'why_marks' };
    var warn = s.why.filter(function (w) { return kind === 'prac' || w === 'marks'; });
    if (warn.length) notes.push('⚠ ' + warn.map(function (w) { return t(wmap[w]).replace('{s}', s.weak.join(', ')); }).join(' · '));
    return '<a class="card rec" href="#/career/' + c.id + '"><div class="rec-h"><span class="ico-tile">' + c.ico + '</span><div><h4>' + L(c.name) + '</h4><span class="fit f' + (val >= 70 ? 3 : val >= 52 ? 2 : 1) + '">' + label + ' · ' + val + '%</span></div></div>' +
      '<div class="meter"><i style="width:' + val + '%"></i></div><p class="why">' + notes.join('<br>') + '</p><div class="minis">' + chips(s) + '</div></a>';
  }

  App.radarSvg = function (r) { return radar(r); };
  App.fitFor = function (c) {
    if (A.step !== 'done') return null;
    var s = scoreAll([c], compute())[0];
    return { prac: Math.round(s.prac), i: Math.round(s.i) };
  };

  App.views.results = function () {
    if (A.step !== 'done') return '<div class="wrap section"><div class="card empty"><h2>' + t('res_none') + '</h2><p>' + t('res_none_p') + '</p><a class="btn" href="#/assess">' + t('as_begin') + ' →</a></div></div>';
    var R = App.report(), r = R.r, cls = R.cls, html = '';
    var ls = R.ls, NA = APTITUDE_ITEMS.length;
    var P1 = { income: ['', t('inc1'), t('inc2'), t('inc3'), t('inc4')][+P('income')] };

    html += '<section class="page-hero results-hero"><div class="wrap"><span class="eyebrow">' + t('res_eyebrow') + '</span><h1>' + t('res_title') + '</h1>' +
      '<div class="code-line"><span>' + t('res_code') + '</span>' + r.code.split('').map(function (x) { return '<b style="background:' + RIASEC[x].c + '">' + x + '</b>'; }).join('') + '</div>' +
      '<div class="cta-row no-print"><button class="btn btn-light" data-act="print">🖨 ' + t('print') + '</button><a class="btn btn-light" href="#/certificate">🎓 ' + t('cert_btn') + '</a><a class="btn btn-ghost-light" href="#/assess">↺ ' + t('retake') + '</a><button class="btn btn-ghost-light" data-act="a_clear">🗑 ' + t('clear_data') + '</button></div></div></section>';

    html += '<div class="wrap section">' +
      (r.flat ? '<div class="notice warn no-print">⚠️ ' + t('res_flat') + '</div>' : '') +
      (r.careless ? '<div class="notice warn no-print">⚠️ ' + t('res_careless') + '</div>' : '') +
      '<div class="grid g2 res-top">' +
      '<div class="card"><h3>' + t('res_int') + '</h3><div class="radar-wrap">' + radar(r) + '<div class="bars">' + r.order.map(function (x) { return bar(L(RIASEC[x].name).split(' — ')[0], r.ri[x], RIASEC[x].c); }).join('') + '</div></div></div>' +
      '<div class="card"><h3>' + t('res_top3') + '</h3>' + r.order.slice(0, 3).map(function (x) {
        return '<div class="type"><b class="tdot" style="background:' + RIASEC[x].c + '">' + x + '</b><div><h4>' + L(RIASEC[x].name) + '</h4><p>' + L(RIASEC[x].d) + '</p></div></div>';
      }).join('') + '</div>' +
      '<div class="card"><h3>📘 ' + t('res_sub') + '</h3><p class="hint">' + t('res_sub_h') + '</p>' + R.subs.map(subRow).join('') + '</div>' +
      '<div class="card"><h3>⚖️ ' + t('res_val') + '</h3><p class="hint">' + t('res_val_h') + '</p><div class="vals">' + R.topVals.map(function (k, i) {
        return '<div class="valrow"><b>' + (i + 1) + '</b><span>' + esc(L(VALUE_NAMES[k])) + '</span><small>' + esc(L(VALUES_ITEMS.filter(function (x) { return x[0] === k; })[0][1])) + '</small></div>';
      }).join('') + '</div></div>' +
      '<div class="card"><h3>' + t('res_apt') + '</h3><p class="hint">' + t('res_apt_h') + ' ' + r.aptRight + ' / ' + r.aptTried + (r.aptTried < NA ? ' (' + (NA - r.aptTried) + ' ' + t('skipped') + ')' : '') + '</p>' +
      Object.keys(r.apt).map(function (k) { return aptRow(L(APTITUDE_NAMES[k]), r.apt[k]); }).join('') + '<p class="hint">' + t('apt_note') + '</p></div>' +
      '<div class="card"><h3>' + ls.ico + ' ' + t('res_learn') + ': ' + L(ls.name) + (r.lstyle2 ? ' + ' + L(LEARN_STYLES[r.lstyle2].name) : '') + '</h3><p>' + L(ls.tip) + (r.lstyle2 ? ' ' + L(LEARN_STYLES[r.lstyle2].tip) : '') + '</p><p class="hint">' + t('res_learn_h') + '</p>' +
      '<p class="ctx"><b>' + t('res_ctx') + ':</b> ' + t('cls_' + cls) + (A.profile.stream ? ' · ' + t('st_' + A.profile.stream) : '') + ' · ' + P1.income + ' · ' + t('earn_' + P('earn')) + ' · ' + t('away_' + P('away')) + '</p></div></div>';

    if (cls === '10') {
      var sk = R.streams, direct = R.direct;
      html += '<h2 class="sec-t">🛤️ ' + t('res_stream') + '</h2><div class="card stream-card"><div class="stream-big">' + t('st_' + sk[0]) + '</div><p>' + t('res_stream_p') + (sk[1] ? ' ' + t('res_stream_2') + ' <b>' + t('st_' + sk[1]) + '</b>.' : '') + '</p>' +
        (R.streamWeak ? '<p class="note">⚠ ' + t('res_stream_marks').replace('{s}', R.streamWeak.join(', ')) + '</p>' : '') + '</div>' +
        '<h2 class="sec-t">🚦 ' + t('res_direct') + '</h2><p class="muted">' + t('res_direct_p') + '</p><div class="grid g3">' + direct.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>' +
        '<h2 class="sec-t">⭐ ' + t('res_dream') + '</h2><p class="muted">' + t('res_dream_p') + '</p><div class="grid g3">' + R.dream.map(function (s) { return recCard(s, r, 'dream'); }).join('') + '</div>' +
        '<h2 class="sec-t">🎯 ' + t('res_prac') + '</h2><p class="muted">' + t('res_prac_p') + '</p><div class="grid g3">' + R.prac.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>';
    } else {
      html += '<h2 class="sec-t">⭐ ' + t('res_dream') + '</h2><p class="muted">' + t('res_dream_p') + '</p><div class="grid g3">' + R.dream.map(function (s) { return recCard(s, r, 'dream'); }).join('') + '</div>' +
        '<h2 class="sec-t">🎯 ' + t('res_prac') + '</h2><p class="muted">' + t('res_prac_p') + '</p><div class="grid g3">' + R.prac.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>';
    }
    html += '<h3 class="sec-s">' + t('res_more') + '</h3><div class="pills">' + R.more.map(function (s) { return '<a class="pill" href="#/career/' + s.c.id + '">' + s.c.ico + ' ' + L(s.c.name) + '</a>'; }).join('') + '</div>';

    /* scholarships */
    var ms = R.sch;
    html += '<h2 class="sec-t">🎁 ' + t('res_sch') + '</h2><div class="grid g2">' + ms.map(function (x) {
      return '<div class="card sch-mini"><h4>' + L(x.s.name) + '</h4><p>' + L(x.s.who) + '</p><div class="minis">' + x.m.reasons.map(function (k) { return '<span class="mini ok">✓ ' + t(k) + '</span>'; }).join('') + (x.m.later ? '<span class="mini">' + t('sm_later') + '</span>' : '') + '</div>' + (x.s.url ? ext(x.s.url, x.s.site) : '') + '</div>';
    }).join('') + '</div><p><a class="btn btn-ghost" href="#/scholarships">' + t('res_sch_all') + ' →</a></p>';

    /* next steps — chosen by readiness stage */
    html += '<h2 class="sec-t">✅ ' + t('res_next') + '</h2><p class="muted">' + t('res_stage') + ' <b>' + esc(L(R.stage)) + '</b> — ' + t('res_stage_' + r.rd) + '</p><ol class="next card">' + R.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<div class="notice">' + t('res_disc') + '</div></div>';
    return html;
  };
})();

</script>
  <script>
/* =====================================================================
   VIEWS  — one function per page. Each returns an HTML string.
   Pages: home, tree, streams, careers, career/<id>, colleges, scholarships,
          calendar, links, about.   (Assessment pages live in assessment.js)
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, AC = App.actions, F = App.f;
  var MONTHS = {
    en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
    hi: ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर']
  };
  function hero(eyebrow, title, lead, cls) {
    return '<section class="page-hero ' + (cls || '') + '"><div class="wrap"><span class="eyebrow">' + eyebrow + '</span><h1>' + title + '</h1>' + (lead ? '<p class="lead">' + lead + '</p>' : '') + '</div></section>';
  }
  function chipRow(items, current, act, extra) {
    return '<div class="chips" role="group">' + items.map(function (i) {
      return '<button type="button" class="chip' + (current === i[0] ? ' on' : '') + '" aria-pressed="' + (current === i[0]) + '" data-act="' + act + '" data-v="' + i[0] + '" ' + (extra || '') + '>' + i[1] + '</button>';
    }).join('') + '</div>';
  }
  function costTxt(n) { return ['', '₹ ' + t('c_low'), '₹₹ ' + t('c_mid'), '₹₹₹ ' + t('c_high')][n]; }
  function code(ri) { return ri.split('').map(function (x) { return '<b class="cdot" style="background:' + RIASEC[x].c + '" title="' + esc(L(RIASEC[x].name)) + '">' + x + '</b>'; }).join(''); }
  function leaves(n, set) { if (typeof n === 'string') set[n] = 1; else n.kids.forEach(function (k) { leaves(k, set); }); return set; }
  function leafCount(n) { return Object.keys(leaves(n, {})).length; }

  /* ------------------------------ HOME ------------------------------ */
  V.home = function () {
    var m = new Date().getMonth() + 1, n1 = (m % 12) + 1, n2 = (n1 % 12) + 1;
    var upcoming = CALENDAR.filter(function (r) { return r.m.length && (r.m.indexOf(m) > -1 || r.m.indexOf(n1) > -1 || r.m.indexOf(n2) > -1); }).slice(0, 3);
    var tiles = [['assess', '🧭', 'nav_assess', 'hm_t1'], ['tree', '🌳', 'nav_tree', 'hm_t2'], ['streams', '🔀', 'nav_streams', 'hm_t3'], ['careers', '💼', 'nav_careers', 'hm_t4'],
      ['colleges', '🏫', 'nav_colleges', 'hm_t5'], ['scholarships', '🎁', 'nav_sch', 'hm_t6'], ['calendar', '🗓️', 'nav_cal', 'hm_t7'], ['links', '🔗', 'nav_links', 'hm_t8']];
    var emerg = CAREERS.filter(function (c) { return c.tag && c.tag.indexOf('emerging') > -1; });
    var ask = App.A && App.A.step === 'done';
    return '<section class="hero"><div class="wrap hero-in"><div class="hero-copy"><span class="eyebrow">' + t('hm_eyebrow') + '</span>' +
      '<h1>' + t('hm_h1') + '</h1><p class="lead">' + t('hm_lead') + '</p>' +
      '<div class="cta-row"><a class="btn btn-lg" href="#/assess">' + t('hm_cta1') + ' →</a>' + (ask ? '<a class="btn btn-ghost-light btn-lg" href="#/results">' + t('as_see_res') + '</a>' : '<a class="btn btn-ghost-light btn-lg" href="#/careers">' + t('hm_cta2') + '</a>') + '</div>' +
      '<ul class="trust"><li>✔ ' + t('hm_tr1') + '</li><li>✔ ' + t('hm_tr2') + '</li><li>✔ ' + t('hm_tr3') + '</li></ul></div>' +
      '<div class="hero-side"><p class="side-h">' + t('hm_where') + '</p>' +
      '<a class="gate g10" href="#/tree" data-act="tree_go" data-v="10"><span class="gate-n">10</span><span><b>' + t('hm_c10') + '</b><small>' + t('hm_c10d') + '</small></span><i>→</i></a>' +
      '<a class="gate g12" href="#/tree" data-act="tree_go" data-v="12"><span class="gate-n">12</span><span><b>' + t('hm_c12') + '</b><small>' + t('hm_c12d') + '</small></span><i>→</i></a>' +
      '<p class="quote">“' + t('quote') + '” <small>— ' + t('quote_by') + '</small></p></div></div></section>' +

      '<div class="wrap"><div class="stats">' +
      [[CAREERS.length, 'st_careers'], [(App.API.meta ? App.API.meta.counts.colleges : COLLEGES.length), 'st_colleges'], [SCHOLARSHIPS.length, 'st_sch'], [LINKS.length, 'st_links']].concat(App.API.meta ? [[App.API.meta.counts.schools, 'st_schools']] : [[2, 'st_langs']]).map(function (s) {
        return '<div><b>' + s[0] + (s[1] !== 'st_langs' ? '+' : '') + '</b><span>' + t(s[1]) + '</span></div>'; }).join('') + '</div></div>' +

      '<section class="wrap section"><h2 class="sec-t">' + t('hm_find') + '</h2><div class="grid g4 tiles">' + tiles.map(function (x, i) {
        return '<a class="card tile t' + (i % 4) + '" href="#/' + x[0] + '"><span class="ico-tile">' + x[1] + '</span><h3>' + t(x[2]) + '</h3><p>' + t(x[3]) + '</p><span class="go">→</span></a>'; }).join('') + '</div></section>' +

      '<section class="wrap section"><div class="grid g2 school-band"><a class="card goldcard sb" href="#/certificate"><span class="ico-tile">🎓</span><div><h3>' + t('hm_cert') + '</h3><p>' + t('hm_cert_p') + '</p></div></a>' +
      '<a class="card sb" href="#/school"><span class="ico-tile">🏫</span><div><h3>' + t('hm_school') + '</h3><p>' + t('hm_school_p') + '</p></div></a></div></section>' +

      '<section class="band"><div class="wrap section"><h2 class="sec-t">' + t('hm_how') + '</h2><p class="muted">' + t('hm_how_p') + '</p><div class="grid g4">' +
      [['❤️', 'hw1', 'hw1d'], ['🧮', 'hw2', 'hw2d'], ['💰', 'hw3', 'hw3d'], ['🎯', 'hw4', 'hw4d']].map(function (x) {
        return '<div class="card how"><span class="ico-tile">' + x[0] + '</span><h3>' + t(x[1]) + '</h3><p>' + t(x[2]) + '</p></div>'; }).join('') + '</div>' +
      '<p class="cta-row"><a class="btn" href="#/assess">' + t('hm_cta1') + ' →</a></p></div></section>' +

      '<section class="wrap section"><div class="sec-head"><h2 class="sec-t">🚀 ' + t('hm_new') + '</h2><a class="more" href="#/careers" data-act="car_tag">' + t('see_all') + ' →</a></div><div class="hscroll">' +
      emerg.map(function (c) { return '<a class="card mini-c" href="#/career/' + c.id + '"><span class="ico-tile">' + c.ico + '</span><h4>' + L(c.name) + '</h4><p>' + esc(L(c.about).split('. ')[0]) + '.</p></a>'; }).join('') + '</div></section>' +

      '<section class="wrap section"><div class="grid g2"><div class="card"><div class="sec-head"><h3>🗓️ ' + t('hm_up') + '</h3><a class="more" href="#/calendar">' + t('see_all') + ' →</a></div>' +
      upcoming.map(function (r) { return '<div class="up"><b>' + L(r.exam) + '</b><span>' + t('apply_by') + ': ' + L(r.apply) + '</span></div>'; }).join('') + '</div>' +
      '<div class="card goldcard"><h3>🎁 ' + t('hm_money') + '</h3><p>' + t('hm_money_p') + '</p><a class="btn btn-light" href="#/scholarships">' + t('nav_sch') + ' →</a></div></div></section>';
  };
  AC.tree_go = function (el) { F.tree = el.getAttribute('data-v'); };
  AC.car_tag = function () { F.careers = { lv: 'all', st: 'all', q: '', tag: 'emerging' }; };

  /* ------------------------------ TREE ------------------------------ */
  function treeNode(n, depth, col, tk) {

  <script>
/* =====================================================================
   DIRECTORY — the "Schools & Colleges" page.
   • With the backend running: searches 1,100+ colleges and 8,000+ schools of Haryana (server-side, paged).
   • Without a backend: shows the short bundled college list (js/data/colleges.js).
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, AC = App.actions, F = App.f, API = App.API;
  F.colleges = { region: 'all', type: 'all', q: '', district: '', page: 1 };
  F.dir = 'colleges';
  F.schools = { q: '', district: '', mgmt: '', board: '', cls: 'all', location: '', page: 1 };
  var token = 0, timer = null;

  function chipRow(items, current, act, extra) {
    return '<div class="chips" role="group">' + items.map(function (i) {
      return '<button type="button" class="chip' + (current === i[0] ? ' on' : '') + '" aria-pressed="' + (current === i[0]) + '" data-act="' + act + '" data-v="' + i[0] + '" ' + (extra || '') + '>' + i[1] + '</button>';
    }).join('') + '</div>';
  }
  function select(k, cur, all, opts) {
