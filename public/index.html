  <script>
/* =====================================================================
   API  — talks to the Node backend (server/server.js).
   If there is NO backend (plain static hosting, file://, preview.html), App.API.online stays
   false and the site simply uses the data bundled in js/data/*.js — nothing breaks.
   ===================================================================== */
(function () {
  'use strict';
  var API = App.API = { online: false, checked: false, meta: null, ready: null };   // checked = we know whether a backend exists

  function timeout(ms) { return new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); }); }
  API.get = function (path) {
    return fetch(path, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (!r.ok || ct.indexOf('json') < 0) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  };
  API.qs = function (o) {
    return Object.keys(o).filter(function (k) { return o[k] !== '' && o[k] != null && o[k] !== 'all'; })
      .map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&');
  };

  function fill(target, items) { target.length = 0; Array.prototype.push.apply(target, items); }
  function both(en, hi) { return { en: en, hi: hi || en }; }

  /* rows from the admin sheet (flat) → the nested shape the pages use */
  function toScholarship(r) {
    return { id: r.id, from: +r.from || 9, tags: String(r.tags || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean), url: r.url, site: r.site,
      name: both(r.name_en, r.name_hi), who: both(r.who_en, r.who_hi) };
  }
  function toLink(r) { return { g: r.group, ico: r.ico || '', name: both(r.name_en, r.name_hi), url: r.url }; }

  API.init = function () {
    API.ready = Promise.race([API.get('api/meta'), timeout(3000)]).then(function (meta) {
      API.online = true; API.meta = meta;
      return Promise.all([API.get('api/public/scholarships'), API.get('api/public/links')]).then(function (res) {
        if (res[0].length) fill(window.SCHOLARSHIPS, res[0].map(toScholarship));
        if (res[1].length) fill(window.LINKS, res[1].map(toLink));
      }).catch(function () { /* keep bundled lists */ });
    }).then(function () {
      API.checked = true;
      var r = (location.hash || '#/').replace(/^#\/?/, '').split('/')[0] || 'home';
      if (['home', 'scholarships', 'links', 'colleges', 'school', 'certificate'].indexOf(r) > -1) App.rerender(true);
    }).catch(function () { API.online = false; API.checked = true; if (/^#\/(colleges|school)/.test(location.hash || '')) App.rerender(true); });
    return API.ready;
  };
  document.addEventListener('DOMContentLoaded', function () { API.init(); });
})();

</script>
  <script>
/* =====================================================================
   ASSESSMENT  — questionnaire flow, scoring, matching and the results page  (v2)
   Flow:  intro → situation → subjects (8) → interests (30) → values (8) → aptitude (16) → learning (4) → readiness (3) → results
   Scoring (all in the browser, nothing is sent anywhere):
     interest fit   = closeness of the student's RELATIVE RIASEC profile to the career's code      (0–100)
     aptitude fit   = share of correct answers in the areas the career needs                        (0–100)
     readiness      = marks + confidence in the school subjects behind those areas (self-efficacy)  (0–100)
     values fit     = how important the things this career offers are to the student               (0–100)
     feasibility    = cost vs. budget/loan, years-to-earn, moving away, internet                    (0–100)
     "Dream"     = 55% interest + 15% aptitude + 15% readiness + 15% values
     "Practical" = 40% interest + 10% aptitude + 10% readiness + 10% values + 30% feasibility
   Readiness-stage answers are never scored; they only choose the "next steps".
   ===================================================================== */
(function () {
  'use strict';
  /* Saved answers expire after 24 h: on a shared school computer the next student must not inherit
     the previous one's category / income / disability answers. */
  var TTL = 30 * 24 * 60 * 60 * 1000, VER = 4;   // results stay 30 days on this device; a new version restarts half-done runs
  function fresh() { return { v: VER, step: 'intro', i: 0, profile: {}, ans: {}, ts: Date.now() }; }
  var A = App.A = App.Store.get('assess', null) || fresh();
  if (A.v !== VER || !A.ts || Date.now() - A.ts > TTL) { App.Store.del('assess'); A = App.A = fresh(); }
  function save() { A.ts = Date.now(); App.Store.set('assess', A); }
  function wipe() { var f = fresh(); for (var k in f) A[k] = f[k]; App.Store.del('assess'); if (App.f && App.f.cert) App.f.cert = { name: '', cls: '', school: '', date: '' }; }
  /* class sessions (#/class): copy this student's answers out, or load another student's answers in place */
  App.snapA = function () { return JSON.parse(JSON.stringify(A)); };
  App.loadA = function (snap) {
    var f = snap ? JSON.parse(JSON.stringify(snap)) : fresh();
    Object.keys(A).forEach(function (k) { delete A[k]; });
    for (var k in f) A[k] = f[k];
    if (snap) save(); else App.Store.del('assess');
  };

  var FACES = [['', 'sc1'], ['', 'sc2'], ['', 'sc3'], ['', 'sc4'], ['', 'sc5']];
  var CONF = [['', 'cf1'], ['', 'cf2'], ['', 'cf3'], ['', 'cf4'], ['', 'cf5']];
  var IMP = [['1', 'im1'], ['2', 'im2'], ['3', 'im3'], ['4', 'im4'], ['5', 'im5']];
  var SEC = { sub: 'as_sub', int: 'as_s2', val: 'as_val', per: 'as_per', ctx: 'as_ctx', apt: 'as_s3', lrn: 'as_s4', rd: 'as_rd' };
  var SEC_ORDER = ['sub', 'int', 'val', 'per', 'ctx', 'apt', 'lrn', 'rd'];
  var AGR = [['', 'ag1'], ['', 'ag2'], ['', 'ag3'], ['', 'ag4'], ['', 'ag5']];

  /* ------------------------------ question queue ------------------------------ */
  function track() { var p = A.profile; return p.cls === '12' ? (p.stream || 'pcm') : '10'; }
  function subjects() { return SUBJECT_SETS[track()]; }
  /* the assessment asks a chosen subset of each item bank, plus work style and work conditions (54 questions in all):
     3 interest statements per Holland type, 2 aptitude items per area, values as one “pick 3” screen */
  var INT_ASK = [0, 1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 18, 21, 24, 27];   // 24 & 27 repeat 0 & 3 in other words → careless check
  var APT_ASK = [1, 2, 4, 6, 9, 10, 13, 14], LRN_ASK = [0, 3], RD_ASK = [0, 2];
  function queue() {
    var q = [];
    subjects().forEach(function (s) { q.push({ sec: 'sub', type: 'marks', key: 'sub:' + s[0] + ':m', subj: s }); });
    INT_ASK.forEach(function (i) { q.push({ sec: 'int', type: 'scale', key: 'int:' + i, item: INTEREST_ITEMS[i] }); });
    q.push({ sec: 'val', type: 'pick3', key: 'valpick' });
    ORIENT_ITEMS.forEach(function (it) { q.push({ sec: 'val', type: 'mc', key: 'ori:' + it.k, item: it }); });
    PERSONALITY_ITEMS.forEach(function (it, i) { q.push({ sec: 'per', type: 'agree', key: 'per:' + i, item: it }); });
    WORK_CONTEXT_ITEMS.forEach(function (it) { q.push({ sec: 'ctx', type: 'ctx', key: 'ctx:' + it.k, item: it }); });
    APT_ASK.forEach(function (i) { q.push({ sec: 'apt', type: 'mc', key: 'apt:' + i, item: APTITUDE_ITEMS[i], skip: true }); });
    LRN_ASK.forEach(function (i) { q.push({ sec: 'lrn', type: 'mc', key: 'lrn:' + i, item: LEARN_ITEMS[i] }); });
    RD_ASK.forEach(function (i) { q.push({ sec: 'rd', type: 'mc', key: 'rd:' + i, item: READINESS_ITEMS[i] }); });
    var cnt = {}, seen = {};
    q.forEach(function (x) { cnt[x.sec] = (cnt[x.sec] || 0) + 1; });
    q.forEach(function (x) { seen[x.sec] = (seen[x.sec] || 0) + 1; x.n = seen[x.sec]; x.tot = cnt[x.sec]; });
    return q;
  }
  function NQ() { return queue().length; }
  App.assessCounts = function () { return { sub: subjects().length * 2, int: INTEREST_ITEMS.length, val: VALUES_ITEMS.length, apt: APTITUDE_ITEMS.length, lrn: LEARN_ITEMS.length, rd: READINESS_ITEMS.length }; };

  /* ------------------------------ views ------------------------------ */
  App.views.assess = function () {
    if (A.step === 'profile') return profileView();
    if (A.step === 'q') return questionView();
    return introView();
  };

  function introView() {
    var started = A.step !== 'intro' || Object.keys(A.ans).length;
    var steps = [['', 'as_s1', 'as_s1d'], ['', 'as_sub', 'as_subd'], ['', 'as_s2', 'as_s2d'], ['', 'as_val', 'as_vald'], ['', 'as_per', 'as_perd'], ['', 'as_ctx', 'as_ctxd'], ['', 'as_s3', 'as_s3d'], ['', 'as_s4', 'as_s4d'], ['', 'as_rd', 'as_rdd']];
    return '<section class="page-hero"><div class="wrap">' + crumb(t('nav_assess')) + '<h1>' + t('as_title') + '</h1><p class="lead">' + t('as_lead') + '</p></div></section>' +
      '<div class="wrap section"><div class="grid g4 steps">' + steps.map(function (s, i) {
        return '<div class="card step"><span class="step-n">' + (i + 1) + '</span><div class="ico-tile">' + s[0] + '</div><h3>' + t(s[1]) + '</h3><p>' + t(s[2]) + '</p></div>';
      }).join('') + '</div>' +
      '<div class="cta-row"><button class="btn btn-lg" data-act="a_start">' + (started ? t('as_restart') : t('as_begin')) + ' →</button>' +
      (started && A.step !== 'done' && A.step !== 'intro' ? '<button class="btn btn-ghost btn-lg" data-act="a_resume">' + t('as_resume') + '</button>' : '') +
      (A.step === 'done' ? '<a class="btn btn-ghost btn-lg" href="#/results">' + t('as_see_res') + '</a>' : '') +
      (started ? '<button class="btn btn-ghost btn-lg" data-act="a_clear">' + t('clear_data') + '</button>' : '') +
      '<span class="muted">' + t('as_time') + ' · ' + t('as_priv') + '</span></div>' + restoreCard() +
      '<div class="card research"><h3>' + t('rs_t') + '</h3><p>' + t('rs_p') + '</p><ul>' +
      ['rs_1', 'rs_2', 'rs_3', 'rs_6', 'rs_4', 'rs_5', 'rs_7', 'rs_8', 'rs_9', 'rs_10', 'rs_11'].map(function (k) { return '<li>' + t(k) + '</li>'; }).join('') + '</ul>' +
      '<p class="note">' + t('rs_note') + '</p></div></div>';
  }

  function profileView() {
    var p = A.profile;
    var html = '<section class="page-hero slim"><div class="wrap">' + crumb(t('nav_assess')) + '<h1>' + t('pf_title') + '</h1><p class="step-of">' + t('as_step') + ' 1 / ' + (SEC_ORDER.length + 1) + '</p><p class="lead">' + t('pf_lead') + '</p></div></section><div class="wrap section"><div class="card form">';
    PROFILE_FIELDS.forEach(function (f) {
      if (f.only) { for (var k in f.only) if (p[k] !== f.only[k]) return; }
      html += '<fieldset><legend>' + L(f.q) + '</legend>' + (f.hint ? '<p class="hint">' + L(f.hint) + '</p>' : '') + '<div class="chips" role="radiogroup">' +
        f.o.map(function (o) {
          var on = p[f.id] === o[0];
          return '<button type="button" role="radio" aria-checked="' + on + '" class="chip' + (on ? ' on' : '') + '" data-act="a_prof" data-f="' + f.id + '" data-v="' + o[0] + '">' + L(o[1]) + '</button>';
        }).join('') + '</div></fieldset>';
    });
    html += '<p id="pf_err" class="err" role="alert" hidden>' + t('pf_err') + '</p><div class="cta-row"><button class="btn btn-ghost" data-act="a_home">← ' + t('back') + '</button><button class="btn btn-lg" data-act="a_prof_next">' + t('next') + ' →</button></div></div></div>';
    return html;
  }

  function scaleRow(cur, set, label) {
    return '<div class="scale" role="radiogroup" aria-label="' + esc(label) + '">' + set.map(function (f, k) {
      return '<button role="radio" aria-checked="' + (cur === k + 1) + '" class="face' + (cur === k + 1 ? ' on' : '') + '" data-act="a_ans" data-v="' + (k + 1) + '"><span class="em">' + f[0] + '</span><span>' + t(f[1]) + '</span></button>';
    }).join('') + '</div>';
  }
  function optRows(cur, opts) {
    return '<div class="opts" role="radiogroup">' + opts.map(function (o, k) {
      return '<button role="radio" aria-checked="' + (cur === k) + '" class="opt' + (cur === k ? ' on' : '') + '" data-act="a_ans" data-v="' + k + '"><b>' + 'ABCDE'[k] + '</b>' + o + '</button>';
    }).join('') + '</div>';
  }

  /* rough seconds per question type → “about N min left” */
  function timeLeft(Q, i) {
    var sec = { sub: 8, int: 10, val: 12, per: 8, ctx: 9, apt: 45, lrn: 12, rd: 12 }, s = 0;
    for (var k = i; k < Q.length; k++) s += Q[k].type === 'pick3' ? 30 : (sec[Q[k].sec] || 10);
    var m = Math.round(s / 60);
    return m < 1 ? t('min_less') : t('min_left').replace('{n}', m);
  }
  function questionView() {
    var Q = queue(), i = A.i, q = Q[i], cur = A.ans[q.key], nq = Q.length, pct = Math.round(i / nq * 100);
    A.shownAt = Date.now();
    var stepNo = SEC_ORDER.indexOf(q.sec) + 2, body = '';
    if (q.type === 'marks') {
      body = '<p class="q-pre">' + t('as_sub') + '</p><h2 class="q">' + t('q_marks').replace('{s}', L(q.subj[1])) + '</h2>' + optRows(cur, MARK_BANDS.map(function (b) { return L(b[1]); }));
    } else if (q.type === 'conf') {
      body = '<p class="q-pre">' + t('as_sub') + '</p><h2 class="q">' + t('q_conf').replace('{s}', L(q.subj[1])) + '</h2>' + scaleRow(cur, CONF, t('q_conf'));
    } else if (q.type === 'scale') {
      body = '<p class="q-pre">' + t('q_int') + '</p><h2 class="q">' + L(q.item[1]) + '</h2>' + scaleRow(cur, FACES, t('q_int'));
    } else if (q.type === 'agree') {
      body = '<p class="q-pre">' + t('q_per') + '</p><h2 class="q">' + L(q.item.q) + '</h2>' + scaleRow(cur, AGR, t('q_per'));
    } else if (q.type === 'ctx') {
      body = '<p class="q-pre">' + t('q_ctx') + '</p><h2 class="q">' + L(q.item.q) + '</h2>' + optRows(cur, [t('cx_y'), t('cx_m'), t('cx_n')]);
    } else if (q.type === 'pick3') {
      var pk = cur || [];
      body = '<p class="q-pre">' + t('as_val') + '</p><h2 class="q">' + t('q_pick3') + '</h2><div class="opts pick3" role="group">' + VALUES_ITEMS.map(function (it) {
        var on = pk.indexOf(it[0]) > -1;
        return '<button type="button" class="opt' + (on ? ' on' : '') + '" data-act="a_pick" data-v="' + it[0] + '" aria-pressed="' + on + '"><b>' + (on ? '✓' : '') + '</b>' + esc(L(it[1])) + '</button>';
      }).join('') + '</div><p class="hint pick-n">' + t('pick_n').replace('{n}', pk.length) + '</p>';
    } else if (q.type === 'imp') {
      body = '<p class="q-pre">' + t('q_val') + '</p><h2 class="q">' + L(q.item[1]) + '</h2>' + scaleRow(cur, IMP, t('q_val'));
    } else if (q.sec === 'apt') {
      body = '<h2 class="q">' + L(q.item.q) + '</h2>' + optRows(cur, q.item.o.map(function (o) { return L(o); })) + '<button class="linkbtn" data-act="a_ans" data-v="-1">' + t('skip') + '</button>';
    } else if (q.sec === 'rd') {
      body = '<h2 class="q">' + L(q.item.q) + '</h2>' + optRows(cur, q.item.o.map(function (o) { return L(o[1]); }));
    } else {
      body = '<h2 class="q">' + L(q.item.q) + '</h2>' + optRows(cur, q.item.o.map(function (o) { return L(o[1]); }));
    }
    return '<div class="wrap section qwrap"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="q-meta"><span class="tag">' + t('as_step') + ' ' + stepNo + '/' + (SEC_ORDER.length + 1) + ' · ' + t(SEC[q.sec]) + ' ' + q.n + '/' + q.tot + '</span><span>' + t('question') + ' ' + (i + 1) + ' / ' + nq + ' · ' + timeLeft(Q, i) + '</span></div>' +

  /* ---- everything the results page and the certificate need, computed once ---- */
  App.report = function () {
    if (A.step !== 'done') return null;
    var r = compute(), cls = A.profile.cls, sc = scoreAll(pool(), r);
    var R = { r: r, cls: cls, sc: sc, ls: LEARN_STYLES[r.lstyle], dream: top(sc, 'dream', 3), prac: top(sc, 'prac', 3) };
    var shown = R.dream.concat(R.prac).map(function (s) { return s.c.id; });
    R.more = top(sc, 'prac', 6, shown);                                   // never repeats a card already shown
    if (cls === '10') {
      var long = top(sc, 'dream', 8), cnt = {};
      long.forEach(function (s, idx) { var k = s.c.rs || s.c.st[0]; if (k !== 'any') cnt[k] = (cnt[k] || 0) + (8 - idx); });
      /* gate by marks: a stream whose core subjects are weak is demoted, and the student is told why */
      var gate = {};
      Object.keys(cnt).forEach(function (k) {
        var need = STREAM_NEEDS[k] || [], s = 0, n = 0, weak = [];
        need.forEach(function (sk) { var x = r.sub[sk]; if (x && x.score != null) { s += x.score; n++; if (x.score < 45) weak.push(L(x.name)); } });
        var v = n ? s / n : 60; gate[k] = { f: v < 40 ? 0.5 : v < 55 ? 0.8 : 1, weak: weak };
        cnt[k] = cnt[k] * gate[k].f;
      });
      R.streams = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
      var topGate = gate[R.streams[0]];
      if (topGate && topGate.weak.length) R.streamWeak = topGate.weak;
      R.direct = top(scoreAll(CAREERS.filter(function (c) { return c.lv.indexOf('10') > -1; }), r), 'prac', 3);
    }
    R.sch = SCHOLARSHIPS.map(function (s) { return { s: s, m: App.matchSch(s) }; }).filter(function (x) { return x.m && x.m.score > 0; })
      .sort(function (a, b) { return b.m.score - a.m.score; }).slice(0, 4);
    R.topVals = r.vorder.slice(0, 3);
    R.subs = r.subList.map(function (s) { return r.sub[s[0]]; });
    var rs = READINESS_STEPS[r.rd];
    R.stage = rs.name;
    R.steps = (App.lang === 'hi' ? rs.hi : rs.en).concat([t(cls === '10' ? 'ns10_4' : 'ns12_3')]);
    return R;
  };

  /* ------------------------------ results ------------------------------ */
  function radar(r) {
    var types = 'RIASEC'.split(''), cx = 150, cy = 140, R = 95, pts = [], grid = '', axes = '', labels = '';
    for (var g = 1; g <= 4; g++) {
      var gp = types.map(function (_, i) { var an = -Math.PI / 2 + i * Math.PI / 3; return (cx + R * g / 4 * Math.cos(an)).toFixed(1) + ',' + (cy + R * g / 4 * Math.sin(an)).toFixed(1); }).join(' ');
      grid += '<polygon points="' + gp + '" fill="none" stroke="#d9dfeb" stroke-width="1"/>';
    }
    types.forEach(function (x, i) {
      var an = -Math.PI / 2 + i * Math.PI / 3, v = Math.max(8, r.ri[x]) / 100;
      pts.push((cx + R * v * Math.cos(an)).toFixed(1) + ',' + (cy + R * v * Math.sin(an)).toFixed(1));
      axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + R * Math.cos(an)).toFixed(1) + '" y2="' + (cy + R * Math.sin(an)).toFixed(1) + '" stroke="#d9dfeb"/>';
      var lx = cx + (R + 22) * Math.cos(an), ly = cy + (R + 22) * Math.sin(an);
      labels += '<circle cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" r="14" fill="' + RIASEC[x].c + '"/><text x="' + lx.toFixed(1) + '" y="' + (ly + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">' + x + '</text>';
    });
    return '<svg viewBox="0 0 300 280" class="radar" role="img" aria-label="' + t('res_radar') + '">' + grid + axes + '<polygon points="' + pts.join(' ') + '" fill="rgba(26,75,224,.16)" stroke="#1a4be0" stroke-width="2.5" stroke-linejoin="round"/>' + labels + '</svg>';
  }
  function bar(label, pct, color) {
    return '<div class="bar"><span class="bar-l">' + label + '</span><span class="bar-t"><i style="width:' + Math.max(3, pct) + '%;background:' + color + '"></i></span><b>' + pct + '%</b></div>';
  }
  function aptRow(label, pct) {
    var b = App.aptBand(pct), lvl = b === 'apt_b3' ? 3 : b === 'apt_b2' ? 2 : b === 'apt_b1' ? 1 : 0;
    return '<div class="bar"><span class="bar-l">' + label + '</span><span class="bar-t"><i style="width:' + (lvl * 33) + '%;background:#2b6cd4"></i></span><b class="lvl b' + lvl + '">' + t(b) + '</b></div>';
  }
  function subRow(s) {
    var band = s.band != null ? L(MARK_BANDS[s.band][1]) : '—', dots = '';
    if (s.c != null) for (var k = 1; k <= 5; k++) dots += '<i class="' + (k <= s.c ? 'on' : '') + '"></i>';
    var lvl = s.score == null ? 'b0' : s.score >= 65 ? 'b3' : s.score >= 45 ? 'b2' : 'b1';
    return '<div class="subrow"><span class="bar-l">' + esc(L(s.name)) + '</span><span class="sub-band ' + lvl + '">' + esc(band) + '</span><span class="dots" title="' + esc(t('q_conf').replace('{s}', L(s.name))) + '">' + dots + '</span></div>';
  }
  function chips(s) {
    var out = ['<span class="mini">' + ['', '₹ ' + t('c_low'), '₹₹ ' + t('c_mid'), '₹₹₹ ' + t('c_high')][s.c.cost] + '</span>',
      '<span class="mini">' + (s.c.earn <= 1 ? '≤1' : s.c.earn) + ' ' + t('yrs') + '</span>',
      '<span class="mini">' + (s.c.reloc ? '' + t('may_move') : '' + t('local_ok')) + '</span>'];
    return out.join('');
  }
  function recCard(s, r, kind) {
    var c = s.c, topLetters = r.code.split(''), match = c.ri.split('').filter(function (x) { return topLetters.indexOf(x) > -1; });
    var val = Math.round(kind === 'prac' ? s.prac : s.dream);
    var label = val >= 70 ? t('fit_great') : val >= 52 ? t('fit_good') : t('fit_poss');
    var notes = [];
    if (match.length) notes.push(t('why_int') + ' ' + match.map(function (x) { return L(RIASEC[x].name).split(' — ')[0]; }).join(' + '));
    if (s.hits.length) notes.push('' + t('why_val') + ' ' + s.hits.map(function (k) { return L(VALUE_NAMES[k]); }).join(', '));
    var wmap = { cost: 'why_cost', time: 'why_time', away: 'why_away', net: 'why_net', marks: 'why_marks', ctx: 'why_ctx', long: 'why_long' };
    var cxn = function () { return (s.no || []).map(function (k) { var it = WORK_CONTEXT_ITEMS.filter(function (x) { return x.k === k; })[0]; return it ? L(it.n) : k; }).join(', '); };
    var warn = s.why.filter(function (w) { return kind === 'prac' || w === 'marks' || w === 'ctx' || w === 'long'; });
    if (s.p >= 70) { var tk = ((CAREER_TRAITS[c.id] || [''])[0] || '').split('').filter(function (k) { return compute().trait[k] >= 70; }); if (tk.length) notes.push('' + t('why_sty') + ' ' + tk.map(function (k) { return L(TRAIT_NAMES[k]); }).join(', ')); }
    if (warn.length) notes.push('' + warn.map(function (w) { return w === 'ctx' ? t('why_ctx').replace('{s}', cxn()) : t(wmap[w]).replace('{s}', s.weak.join(', ')); }).join(' · '));
    return '<a class="card rec" href="#/career/' + c.id + '"><div class="rec-h"><span class="ico-tile">' + c.ico + '</span><div><h4>' + L(c.name) + '</h4><span class="fit f' + (val >= 70 ? 3 : val >= 52 ? 2 : 1) + '">' + label + ' · ' + val + '%</span></div></div>' +
      '<div class="meter"><i style="width:' + val + '%"></i></div><p class="why">' + notes.join('<br>') + '</p><div class="minis">' + chips(s) + '</div></a>';
  }

  function oriLine(r) {
    var o = r.ori || {}, out = [];
    if (o.risk != null) out.push('<b>' + t('ori_risk') + ':</b> ' + t(['ori_r0', 'ori_r1', 'ori_r2'][o.risk]));
    if (o.stay != null) out.push('<b>' + t('ori_stay') + ':</b> ' + t(['ori_s0', 'ori_s1', 'ori_s2'][o.stay]));
    return out.length ? '<p class="sm ori">' + out.join('<br>') + '</p>' : '';
  }
  /* how the field the family hopes for fits this student — shown, never scored */
  function famCard(R) {
    var f = FAM_FIELDS[P('fam')]; if (!f || !R.sc) return '';
    var mine = R.sc.filter(function (s) { return f.ids.indexOf(s.c.id) > -1; }).sort(function (a, b) { return b.prac - a.prac; });
    if (!mine.length) return '';
    var best = mine[0], v = Math.round(best.prac), top = R.prac[0] && R.prac[0].c, same = top && f.ids.indexOf(top.id) > -1;
    var lbl = v >= 70 ? t('fit_great') : v >= 52 ? t('fit_good') : t('fit_poss');
    return '<div class="card fam"><h3>' + t('fam_t') + '</h3><p>' + t('fam_p').replace('{f}', '<b>' + esc(L(f.n)) + '</b>') + '</p>' +
      '<a class="rec slim" href="#/career/' + best.c.id + '"><span class="ico-tile">' + best.c.ico + '</span><div><h4>' + esc(L(best.c.name)) + '</h4><span class="fit f' + (v >= 70 ? 3 : v >= 52 ? 2 : 1) + '">' + lbl + ' · ' + v + '%</span></div></a>' +
      '<p class="hint">' + (same ? '' + t('fam_same') : t('fam_diff').replace('{c}', top ? '<b>' + esc(L(top.name)) + '</b>' : '')) + '</p></div>';
  }
  App.radarSvg = function (r) { return radar(r); };
  App.fitFor = function (c) {
    if (A.step !== 'done') return null;
    var s = scoreAll([c], compute())[0];
    return { prac: Math.round(s.prac), i: Math.round(s.i) };
  };

  App.views.results = function () {
    if (A.step !== 'done') return '<div class="wrap section"><div class="card empty"><h2>' + t('res_none') + '</h2><p>' + t('res_none_p') + '</p><a class="btn" href="#/assess">' + t('as_begin') + ' →</a></div></div>';
    var R = App.report(), r = R.r, cls = R.cls, html = '';
    var ls = R.ls, NA = APT_ASK.length;           // aptitude items actually asked
    var P1 = { income: ['', t('inc1'), t('inc2'), t('inc3'), t('inc4')][+P('income')] };

    html += '<section class="page-hero results-hero"><div class="wrap">' + crumb(t('res_eyebrow'), ['#/assess', t('nav_assess')]) + '<h1>' + t('res_title') + '</h1>' +
      '<div class="code-line"><span>' + t('res_code') + '</span>' + r.code.split('').map(function (x) { return '<b style="background:' + RIASEC[x].c + '">' + x + '</b>'; }).join('') + '</div>' +
      '<div class="cta-row no-print"><button class="btn" data-act="print">' + t('print') + '</button><a class="btn btn-light" href="#/certificate">' + t('cert_btn') + '</a><button class="btn btn-light" data-act="save_code">' + t('save_btn') + '</button>' + (App.shareButtons ? App.shareButtons('res', true) : '') + '<a class="btn btn-ghost-light" href="#/assess">↺ ' + t('retake') + '</a><button class="btn btn-ghost-light" data-act="a_clear">' + t('clear_data') + '</button></div></div></section>';

    html += toastOnce() + '<div class="wrap"><div id="savebox" class="card savebox no-print" hidden><h3>' + t('save_t') + '</h3><p class="hint">' + t('save_p') + '</p>' +
      '<textarea readonly rows="3" aria-label="' + t('save_t') + '"></textarea><div class="cta-row"><button class="btn sm" data-act="copy_code">' + t('copy') + '</button><button class="btn btn-ghost sm" data-act="share_code">' + t('share_wa') + '</button></div></div></div>';
    html += '<div class="wrap section">' +
      (r.flat ? '<div class="notice warn no-print">' + t('res_flat') + '</div>' : '') +
      (r.careless ? '<div class="notice warn no-print">' + t('res_careless') + '</div>' : '') +
      '<div class="grid g2 res-top">' +
      '<div class="card"><h3>' + t('res_int') + '</h3><div class="radar-wrap">' + radar(r) + '<div class="bars">' + r.order.map(function (x) { return bar(L(RIASEC[x].name).split(' — ')[0], r.ri[x], RIASEC[x].c); }).join('') + '</div></div></div>' +
      '<div class="card"><h3>' + t('res_top3') + '</h3>' + r.order.slice(0, 3).map(function (x) {
        return '<div class="type"><b class="tdot" style="background:' + RIASEC[x].c + '">' + x + '</b><div><h4>' + L(RIASEC[x].name) + '</h4><p>' + L(RIASEC[x].d) + '</p></div></div>';
      }).join('') + '</div>' +
      '<div class="card"><h3>' + t('res_sub') + '</h3><p class="hint">' + t('res_sub_h') + '</p>' + R.subs.map(subRow).join('') + '</div>' +
      '<div class="card"><h3>' + t('res_val') + '</h3><p class="hint">' + t('res_val_h') + '</p>' + oriLine(r) + '<div class="vals">' + R.topVals.map(function (k, i) {
        return '<div class="valrow"><b>' + (i + 1) + '</b><span>' + esc(L(VALUE_NAMES[k])) + '</span><small>' + esc(L(VALUES_ITEMS.filter(function (x) { return x[0] === k; })[0][1])) + '</small></div>';
      }).join('') + '</div></div>' +
      '<div class="card"><h3>' + t('res_apt') + '</h3><p class="hint">' + t('res_apt_h') + ' ' + r.aptRight + ' / ' + r.aptTried + (r.aptTried < NA ? ' (' + (NA - r.aptTried) + ' ' + t('skipped') + ')' : '') + '</p>' +
      Object.keys(r.apt).map(function (k) { return aptRow(L(APTITUDE_NAMES[k]), r.apt[k]); }).join('') + '<p class="hint">' + t('apt_note') + '</p></div>' +
      famCard(R) + '<div class="card sty"><h3>' + t('res_sty') + '</h3><p class="hint">' + t('res_sty_h') + '</p>' + 'OCEAS'.split('').map(function (k) {
        var v = r.trait[k]; if (v == null) return '';
        var lvl = v >= 70 ? 3 : v >= 45 ? 2 : 1;
        return '<div class="bar"><span class="bar-l">' + esc(L(TRAIT_NAMES[k])) + '</span><span class="bar-t"><i style="width:' + Math.max(8, v) + '%;background:#16947f"></i></span><b class="lvl b' + lvl + '">' + t('sty_b' + lvl) + '</b></div>';
      }).join('') + (function () {
        var tops = 'OCEAS'.split('').filter(function (k) { return r.trait[k] != null && r.trait[k] >= 70; });
        var nos = WORK_CONTEXT_ITEMS.filter(function (it) { return r.ctx[it.k] === 2; });
        return (tops.length ? '<p class="sm">' + tops.map(function (k) { return '<b>' + esc(L(TRAIT_NAMES[k])) + ':</b> ' + esc(L(TRAIT_NAMES[k].d)); }).join('<br>') + '</p>' : '') +
          (nos.length ? '<p class="hint">' + t('res_ctx_no') + ' ' + nos.map(function (it) { return esc(L(it.n)); }).join(', ') + '</p>' : '');
      })() + '</div>' +
      '<div class="card"><h3>' + t('res_learn') + ': ' + L(ls.name) + (r.lstyle2 ? ' + ' + L(LEARN_STYLES[r.lstyle2].name) : '') + '</h3><p>' + L(ls.tip) + (r.lstyle2 ? ' ' + L(LEARN_STYLES[r.lstyle2].tip) : '') + '</p><p class="hint">' + t('res_learn_h') + '</p>' +
      '<p class="ctx"><b>' + t('res_ctx') + ':</b> ' + t('cls_' + cls) + (A.profile.stream ? ' · ' + t('st_' + A.profile.stream) : '') + ' · ' + t('earn_' + P('earn')) + ' · ' + t('away_' + P('away')) + '</p></div></div>';

    if (cls === '10') {
      var sk = R.streams, direct = R.direct;
      html += '<h2 class="sec-t">' + t('res_stream') + '</h2><div class="card stream-card"><div class="stream-big">' + t('st_' + sk[0]) + '</div><p>' + t('res_stream_p') + (sk[1] ? ' ' + t('res_stream_2') + ' <b>' + t('st_' + sk[1]) + '</b>.' : '') + '</p>' +
        (R.streamWeak ? '<p class="note">' + t('res_stream_marks').replace('{s}', R.streamWeak.join(', ')) + '</p>' : '') + '</div>' +
        '<h2 class="sec-t">' + t('res_direct') + '</h2><p class="muted">' + t('res_direct_p') + '</p><div class="grid g3">' + direct.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>' +
        '<h2 class="sec-t">' + t('res_dream') + '</h2><p class="muted">' + t('res_dream_p') + '</p><div class="grid g3">' + R.dream.map(function (s) { return recCard(s, r, 'dream'); }).join('') + '</div>' +
        '<h2 class="sec-t">' + t('res_prac') + '</h2><p class="muted">' + t('res_prac_p') + '</p><div class="grid g3">' + R.prac.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>';
    } else {
      html += '<h2 class="sec-t">' + t('res_dream') + '</h2><p class="muted">' + t('res_dream_p') + '</p><div class="grid g3">' + R.dream.map(function (s) { return recCard(s, r, 'dream'); }).join('') + '</div>' +
        '<h2 class="sec-t">' + t('res_prac') + '</h2><p class="muted">' + t('res_prac_p') + '</p><div class="grid g3">' + R.prac.map(function (s) { return recCard(s, r, 'prac'); }).join('') + '</div>';
    }
    html += '<h3 class="sec-s">' + t('res_more') + '</h3><div class="pills">' + R.more.map(function (s) { return '<a class="pill" href="#/career/' + s.c.id + '">' + L(s.c.name) + '</a>'; }).join('') + '</div>';

    /* scholarships */
    var ms = R.sch;
    html += '<h2 class="sec-t">' + t('res_sch') + '</h2><div class="grid g2">' + ms.map(function (x) {
      return '<div class="card sch-mini"><h4>' + L(x.s.name) + '</h4><p>' + L(x.s.who) + '</p><div class="minis">' + x.m.reasons.map(function (k) { return '<span class="mini ok">✓ ' + t(k) + '</span>'; }).join('') + (x.m.later ? '<span class="mini">' + t('sm_later') + '</span>' : '') + '</div>' + (x.s.url ? ext(x.s.url, x.s.site) : '') + '</div>';
    }).join('') + '</div><p><a class="btn btn-ghost" href="#/scholarships">' + t('res_sch_all') + ' →</a></p>';

    /* next steps — chosen by readiness stage */
    html += '<h2 class="sec-t">' + t('res_next') + '</h2><p class="muted">' + t('res_stage') + ' <b>' + esc(L(R.stage)) + '</b> — ' + t('res_stage_' + r.rd) + '</p><ol class="next card">' + R.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' +
      '<div class="notice">' + t('res_disc') + '</div></div>';
    return html;
  };
})();

  <script>

(function () {

  function leafCount(n) { return Object.keys(leaves(n, {})).length; }

  /* ------------------------------ HOME ------------------------------ */
  Object.assign(window.UI.en, {
    hm_sub: 'Free career guidance from the Government of Haryana for students of Class 10 and 12, and their parents.',

    rows_t: 'Every road, in one place.', go_open: 'Open', also: 'Also here:',

    ask1: 'Class 10', ask2: 'or 12?', ask_or: 'or', ask_p: 'Either way you see every road open to you, then take the assessment.',

      '<div class="card goldcard q4"><h3>' + t('stm_4q') + '</h3><div class="grid g2">' + qs.map(function (k, i) { return '<p><b>' + (i + 1) + '.</b> ' + t(k) + '</p>'; }).join('') + '</div></div>' +
      '<div class="notice">' + t('stm_warn') + '</div><p class="cta-row"><a class="btn" href="#/assess">' + t('hm_cta1') + ' →</a><a class="btn btn-ghost" href="#/tree">' + t('nav_tree') + '</a></p></div>';
  };

  /* ------------------------------ CAREERS ------------------------------ */
  function careerList() {
    var f = F.careers, q = f.q.trim().toLowerCase();
    var list = CAREERS.filter(function (c) {
      if (f.lv !== 'all' && c.lv.indexOf(f.lv) < 0) return false;
      if (f.st !== 'all' && c.st.indexOf(f.st) < 0 && c.st.indexOf('any') < 0) return false;
      if (f.tag && !(c.tag && c.tag.indexOf(f.tag) > -1)) return false;
      if (q && (c.name.en + ' ' + c.name.hi + ' ' + c.about.en + ' ' + c.about.hi + ' ' + c.exams.en).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    if (!list.length) return '<div class="card empty"><h3>' + t('none') + '</h3></div>';
    var card = function (c) {
      return '<a class="card car" href="#/career/' + c.id + '"><div class="car-h"><span class="ico-tile">' + c.ico + '</span><div><h3>' + L(c.name) + '</h3><small>' + L(c.dur) + '</small></div></div><p>' + L(c.about).split('. ')[0] + '.</p>' +
        '<div class="minis">' + c.lv.map(function (l) { return '<span class="mini lv">' + t('after') + ' ' + l + '</span>'; }).join('') + '<span class="mini">' + costTxt(c.cost) + '</span>' + (c.tag ? '<span class="mini new">' + t('new26') + '</span>' : '') + '</div><div class="codes">' + code(c.ri) + '</div></a>';
    };
    return '<p class="muted dir-count">' + list.length + ' ' + t('n_careers') + '</p>' + CGROUPS.map(function (g) {
      var mine = list.filter(function (c) { return (CGROUP_OF[c.id] || 'skill') === g[0]; });
      return mine.length ? '<section class="cgroup"><h2 class="cgroup-h">' + g[1] + ' ' + t('cg_' + g[0]) + ' <span class="cnt-badge">' + mine.length + '</span></h2><div class="grid g3">' + mine.map(card).join('') + '</div></section>' : '';
    }).join('');
  }
  /* headings on the careers page — every career belongs to one group (unlisted ids fall into “skills”) */
  var CGROUPS = [['health', ''], ['eng', ''], ['sci', ''], ['biz', ''], ['soc', ''], ['cre', ''], ['uni', ''], ['skill', '']];
  var CGROUP_OF = {};
  [['health', 'medicine nursing pharma paramedical veterinary physio-allied'],
   ['eng', 'engineering cs-ai cyber space architecture ev-green drone aviation merchant-navy polytechnic'],
   ['sci', 'science-research biotech-forensic agri-dairy'],
   ['biz', 'ca-cs commerce-fin management banking-insurance economics-stats entrepreneur logistics-retail'],
   ['soc', 'law civil-services media psych-social teaching humanities-lang'],
   ['cre', 'design-arts avgc fashion-textile music-performing hotel sports'],
   ['uni', 'nda agniveer police govjobs'],
   ['skill', 'iti shortterm ites-bpo']].forEach(function (g) { g[1].split(' ').forEach(function (id) { CGROUP_OF[id] = g[0]; }); });

  V.careers = function () {
    var f = F.careers;
    return hero(t('nav_careers'), t('car_title'), t('car_lead')) + '<div class="wrap section"><div class="filters card">' +
      '<label class="search"><span class="sr">' + t('search') + '</span><input type="search" id="cq" value="' + esc(f.q) + '" placeholder="' + t('car_search') + '" data-input="car_q"></label>' +
      ftoggle(f) + '<div class="frows' + (f.open ? ' open' : '') + '"><div class="frow"><span>' + t('level') + '</span>' + chipRow([['all', t('all')], ['10', t('after') + ' 10'], ['12', t('after') + ' 12']], f.lv, 'car_lv') + '</div>' +
      '<div class="frow"><span>' + t('stream') + '</span>' + chipRow([['all', t('all')], ['pcm', t('st_pcm')], ['pcb', t('st_pcb')], ['commerce', t('st_commerce')], ['arts', t('st_arts')]], f.st, 'car_st') + '</div>' +
      '<div class="frow"><span>' + t('filter') + '</span>' + chipRow([['', t('all')], ['emerging', '' + t('new26')]], f.tag, 'car_tg') + '</div></div></div>' +
      '<div id="clist" aria-live="polite">' + careerList() + '</div></div>';
  };
  AC.car_q = function (el) { F.careers.q = el.value; document.getElementById('clist').innerHTML = careerList(); };
  AC.car_lv = function (el) { F.careers.lv = el.getAttribute('data-v'); App.rerender(true); };
  AC.car_st = function (el) { F.careers.st = el.getAttribute('data-v'); App.rerender(true); };
  AC.car_tg = function (el) { F.careers.tag = el.getAttribute('data-v'); App.rerender(true); };
  /* phones: filters fold behind one button that shows how many are active */
  function ftoggle(f) {
    var n = (f.lv !== 'all' ? 1 : 0) + (f.st !== 'all' ? 1 : 0) + (f.tag ? 1 : 0);
    return '<button type="button" class="btn btn-ghost sm ftoggle" data-act="car_ft" aria-expanded="' + !!f.open + '">' + t('filters') + (n ? ' <span class="cnt-badge">' + n + '</span>' : '') + ' ' + (f.open ? '▴' : '▾') + '</button>';
  }
  AC.car_ft = function () { F.careers.open = !F.careers.open; App.rerender(true); };

  var CTYPE = { eng: ['engineering', 'cs-ai', 'cyber', 'space', 'architecture', 'ev-green', 'drone', 'polytechnic', 'aviation', 'merchant-navy'], med: ['medicine', 'nursing', 'pharma', 'paramedical', 'veterinary', 'physio-allied'], edu: ['teaching'], agri: ['agri-dairy'],
    mgmt: ['management', 'ca-cs', 'commerce-fin', 'entrepreneur', 'logistics-retail', 'banking-insurance'], law: ['law'], design: ['design-arts', 'avgc', 'media', 'hotel', 'fashion-textile', 'music-performing'], sci: ['science-research', 'biotech-forensic'], uni: ['civil-services', 'teaching', 'psych-social', 'commerce-fin', 'media', 'economics-stats', 'humanities-lang'], other: ['iti', 'shortterm', 'sports', 'polytechnic', 'ites-bpo'] };
  function collegeTypeFor(id) { for (var k in CTYPE) if (CTYPE[k].indexOf(id) > -1) return k; return 'all'; }

  function has(o) { return !!(o && L(o) && L(o).length); }      // optional bilingual list field present?
  function tickCard(ico, key, o) { return has(o) ? '<div class="card"><h2>' + ico + ' ' + t(key) + '</h2><ul class="ticks">' + L(o).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : ''; }
  V.career = function (a) {
    var c = byId(CAREERS, a[0]);
    if (!c) return '<div class="wrap section"><div class="card empty"><h2>' + t('not_found') + '</h2><p>' + t('not_found_p') + '</p><a class="btn" href="#/careers">' + t('nav_careers') + '</a></div></div>';

    var fit = App.fitFor ? App.fitFor(c) : null;
    var facts = [['', 'f_elig', L(c.elig)], ['', 'f_dur', L(c.dur)], ['', 'f_exam', L(c.exams)], ['', 'f_cost', costTxt(c.cost)], ['', 'f_earn', c.earn + ' ' + t('yrs')], ['', 'f_loc', c.reloc ? t('may_move') : t('local_ok')]];
    return '<section class="page-hero career-hero"><div class="wrap"><a class="back" href="#/careers">← ' + t('nav_careers') + '</a><div class="ch"><span class="ico-tile xl">' + c.ico + '</span><div><h1>' + L(c.name) + '</h1><div class="minis light">' +
      c.lv.map(function (l) { return '<span class="mini">' + t('after') + ' ' + l + '</span>'; }).join('') + c.st.map(function (s) { return '<span class="mini">' + t('st_' + s) + '</span>'; }).join('') + (c.tag ? '<span class="mini">' + t('new26') + '</span>' : '') + '</div></div></div></div></section>' +

      (has(c.detail) ? '<div class="card"><h2>' + t('c_detail') + '</h2>' + L(c.detail).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' : '') +
      (has(c.courses) ? '<div class="card tbl-card"><h2 class="tbl-h">' + t('c_courses') + '</h2><table class="tbl"><thead><tr><th>' + t('c_course') + '</th><th>' + t('c_note') + '</th></tr></thead><tbody>' +
        L(c.courses).map(function (r) { return '<tr><td data-l="' + esc(t('c_course')) + '"><b>' + esc(r[0]) + '</b></td><td data-l="' + esc(t('c_note')) + '">' + esc(r[1] || '—') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
      '<div class="card"><h2>' + t('roadmap') + '</h2><ol class="road">' + L(c.path).map(function (s, i) { return '<li><span>' + (i + 1) + '</span>' + esc(s) + '</li>'; }).join('') + '</ol></div>' +
      (has(c.work) || has(c.after) ? '<div class="grid g2">' + tickCard('', 'c_work', c.work) + tickCard('', 'c_after', c.after) + '</div>' : '') +
      (has(c.skills) ? '<div class="card"><h2>' + t('c_skills') + '</h2><div class="minis skills">' + L(c.skills).map(function (x) { return '<span class="mini">' + esc(x) + '</span>'; }).join('') + '</div></div>' : '') +
      '<div class="card"><h2>' + t('facts') + '</h2><div class="facts">' + facts.map(function (f) { return '<div><span class="fi">' + f[0] + '</span><small>' + t(f[1]) + '</small><b>' + esc(f[2]) + '</b></div>'; }).join('') + '</div></div>' +
      '</div>' +
      '<aside class="side-col">' + (fit ? '<div class="card goldcard"><h3>' + t('your_fit') + '</h3><div class="bigfit">' + fit.prac + '%</div><p class="hint">' + t('fit_note') + '</p><div class="bar"><span class="bar-l">' + t('fit_int') + '</span><span class="bar-t"><i style="width:' + fit.i + '%"></i></span><b>' + fit.i + '%</b></div></div>' : '<div class="card"><h3>' + t('your_fit') + '</h3><p>' + t('fit_none') + '</p><a class="btn sm" href="#/assess">' + t('hm_cta1') + '</a></div>') +
      '<div class="card"><h3>' + t('holland') + '</h3><div class="codes lg">' + code(c.ri) + '</div><p class="hint">' + c.ri.split('').map(function (x) { return L(RIASEC[x].name).split(' — ')[0]; }).join(' · ') + '</p></div>' +
      '<div class="card"><h3>' + t('official') + '</h3><ul class="linklist">' + c.links.map(function (l) { return '<li>' + ext(l[1], l[0]) + '</li>'; }).join('') + '</ul></div>' +
      (has(c.near) ? '<div class="card"><h3>' + t('c_near') + '</h3><ul class="ticks">' + L(c.near).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (has(c.national) ? '<div class="card"><h3>🇮🇳 ' + t('c_nat') + '</h3><ul class="ticks">' + L(c.national).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (has(c.tips) ? '<div class="card goldcard"><h3>' + t('c_tips') + '</h3><ul class="ticks">' + L(c.tips).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      (App.branchesFor ? App.branchesFor(c.id) : '') + '<div class="card"><h3>' + t('explore') + '</h3><a class="btn btn-ghost block" href="#/colleges" data-act="col_for" data-v="' + collegeTypeFor(c.id) + '">' + t('nav_colleges') + '</a>' + (App.compareButton ? App.compareButton(c.id) : '') + '<a class="btn btn-ghost block" href="#/scholarships">' + t('nav_sch') + '</a><a class="btn btn-ghost block" href="#/calendar">' + t('nav_cal') + '</a></div></aside></div>' +
      (rel.length ? '<div class="wrap section"><h3 class="sec-s">' + t('related') + '</h3><div class="pills">' + rel.map(function (r) { return '<a class="pill" href="#/career/' + r.id + '">' + L(r.name) + '</a>'; }).join('') + '</div></div>' : '');
  };

  /* COLLEGES & SCHOOLS directory → see directory.js */

  /* ------------------------------ SCHOLARSHIPS ------------------------------ */
  V.scholarships = function () {
    var has = App.A && App.A.profile && App.A.profile.cls;
    var list = SCHOLARSHIPS.map(function (s) { return { s: s, m: App.matchSch(s) }; });
    if (F.sch.mine && has) list = list.filter(function (x) { return x.m.score > 0; });
    list.sort(function (a, b) { return (b.m ? b.m.score : 0) - (a.m ? a.m.score : 0); });
    return hero(t('nav_sch'), t('sch_title'), t('sch_lead')) + '<div class="wrap section">' +
      (has ? '<div class="card tog"><span>' + t('sch_mine_t') + '</span>' + chipRow([[false, t('all')], [true, t('sch_mine')]].map(function (x) { return [String(x[0]), x[1]]; }), String(F.sch.mine), 'sch_tog') + '</div>' :
        '<div class="notice">' + t('sch_hint') + ' <a href="#/assess">' + t('hm_cta1') + ' →</a></div>') +
      '<div class="grid g2">' + list.map(function (x) {
        var s = x.s, m = x.m;
        return '<article class="card sch' + (m && m.score > 1 ? ' hi' : '') + '"><div class="sch-h"><h3>' + L(s.name) + '</h3>' + (m && m.score > 0 ? '<span class="badge">' + t('likely') + '</span>' : '') + '</div><p>' + L(s.who) + '</p>' +
          (m && m.reasons.length ? '<div class="minis">' + m.reasons.map(function (k) { return '<span class="mini ok">✓ ' + t(k) + '</span>'; }).join('') + (m.later ? '<span class="mini">' + t('sm_later') + '</span>' : '') + '</div>' : '') +
          (s.url ? '<p>' + ext(s.url, s.site) + '</p>' : '<p><small>' + t('ask_inst') + '</small></p>') + '</article>';
      }).join('') + '</div>' +
      '<div class="grid g2 sch-b"><div class="card"><h3>' + t('sch_rules') + '</h3><ul class="ticks">' + SCH_RULES[App.lang].map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h3>' + t('loan_t') + '</h3><p>' + t('loan_p') + '</p>' + ext('https://www.vidyalakshmi.co.in', 'vidyalakshmi.co.in') + '</div></div>' +
      '<div class="notice">' + t('sch_note') + ' ' + ext('https://scholarships.gov.in', 'scholarships.gov.in') + '</div></div>';
  };
  AC.sch_tog = function (el) { F.sch.mine = el.getAttribute('data-v') === 'true'; App.rerender(true); };

  /* ------------------------------ CALENDAR ------------------------------ */
  V.calendar = function () {
    var m = new Date().getMonth() + 1;
    return hero(t('nav_cal'), t('cal_title'), t('cal_lead')) + '<div class="wrap section"><div class="card tbl-card"><table class="tbl"><thead><tr><th>' + t('cal_month') + '</th><th>' + t('cal_exam') + '</th><th>' + t('cal_apply') + '</th><th>' + t('cal_site') + '</th></tr></thead><tbody>' +
      CALENDAR.map(function (r) {
        var now = r.m.indexOf(m) > -1;
        var mon = r.m.length ? (r.m.length === 1 ? MONTHS[App.lang][r.m[0] - 1] : MONTHS[App.lang][r.m[0] - 1] + ' – ' + MONTHS[App.lang][r.m[r.m.length - 1] - 1]) : t('cal_year');
        return '<tr' + (now ? ' class="now"' : '') + '><td data-l="' + t('cal_month') + '"><b>' + mon + '</b>' + (now ? ' <span class="badge">' + t('cal_now') + '</span>' : '') + '</td><td data-l="' + t('cal_exam') + '">' + L(r.exam) + '</td><td data-l="' + t('cal_apply') + '">' + L(r.apply) + '</td><td data-l="' + t('cal_site') + '">' + r.site.map(function (s) { return ext(s[1], s[0]); }).join('<br>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<h2 class="sec-t">' + t('tl_title') + '</h2><div class="timeline">' + TIMELINE.map(function (x, i) { return '<div class="tl"><span>' + (i + 1) + '</span><h4>' + L(x.t) + '</h4><p>' + L(x.d) + '</p></div>'; }).join('') + '</div>' +
      '<div class="notice">' + t('cal_note') + '</div></div>';
  };

  /* ------------------------------ LINKS ------------------------------ */
  V.links = function () {
    var groups = [['all', t('all')], ['exam', t('lg_exam')], ['job', t('lg_job')], ['learn', t('lg_learn')], ['money', t('lg_money')]];
    var list = LINKS.filter(function (l) { return F.links === 'all' || l.g === F.links; });
    return hero(t('nav_links'), t('lnk_title'), t('lnk_lead')) + '<div class="wrap section"><div class="filters card"><div class="frow">' + chipRow(groups, F.links, 'lnk_g') + '</div></div><div class="grid g3">' +
      list.map(function (l) {
        var host = l.url.replace(/^https?:\/\/(www\.)?/, '');
        return '<a class="card linkcard" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer"><span class="ico-tile">' + l.ico + '</span><div><b>' + L(l.name) + '</b><small>' + esc(host) + ' ↗</small></div><span class="sr">(' + t('newtab') + ')</span></a>';
      }).join('') + '</div><div class="card rules"><h3>' + t('rules_t') + '</h3><ol>' + ['r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'r9', 'r10'].map(function (k) { return '<li>' + t(k) + '</li>'; }).join('') + '</ol></div></div>';
  };
  AC.lnk_g = function (el) { F.links = el.getAttribute('data-v'); App.rerender(true); };

  /* ------------------------------ ABOUT ------------------------------ */
  V.about = function () {
    return hero(t('nav_about'), t('ab_title'), t('ab_lead')) + '<div class="wrap section"><div class="grid g2"><div class="card"><h3>' + t('ab_init') + '</h3><p>' + t('ab_init_p') + '</p></div>' +
      '<div class="card"><h3>' + t('ab_priv') + '</h3><p>' + t('ab_priv_p') + '</p></div>' +
      '<div class="card"><h3>' + t('ab_a11y') + '</h3><p>' + t('ab_a11y_p') + '</p></div>' +
      '<div class="card"><h3>' + t('rs_t') + '</h3><ul>' + ['rs_1', 'rs_2', 'rs_3', 'rs_4', 'rs_5'].map(function (k) { return '<li>' + t(k) + '</li>'; }).join('') + '</ul><p class="note">' + t('rs_note') + '</p></div></div>' +
      '<div class="notice">' + t('disc') + '</div></div>';

})();

</script>
  <script>
/* =====================================================================
   DIRECTORY — the "Schools & Colleges" page.
   • With the backend running: searches 1,100+ colleges and 8,000+ schools of Haryana (server-side, paged).
   • Without a backend: shows the short bundled college list (js/data/colleges.js).
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, AC = App.actions, F = App.f, API = App.API;
  F.colleges = { region: 'all', type: 'all', q: '', district: '', page: 1 };
  F.dir = 'colleges';
  F.schools = { q: '', district: '', mgmt: '', board: '', cls: 'all', location: '', page: 1 };
  var token = 0, timer = null;

  function chipRow(items, current, act, extra) {
    return '<div class="chips" role="group">' + items.map(function (i) {
      return '<button type="button" class="chip' + (current === i[0] ? ' on' : '') + '" aria-pressed="' + (current === i[0]) + '" data-act="' + act + '" data-v="' + i[0] + '" ' + (extra || '') + '>' + i[1] + '</button>';
    }).join('') + '</div>';
  }
  function select(k, cur, all, opts) {
    return '<select data-input="dir_sel" data-k="' + k + '" aria-label="' + esc(all) + '"><option value="">' + esc(all) + '</option>' +
      (opts || []).map(function (o) { return '<option value="' + esc(o) + '"' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  }
  function row(label, val) { return val === '' || val == null ? '' : '<p><small>' + label + '</small> ' + val + '</p>'; }
  function fmtDate(d) { return d ? esc(d) : '—'; }

  /* ---------------- page shell ---------------- */
  V.colleges = function () {
    var onS = F.dir === 'schools', f = onS ? F.schools : F.colleges, M = API.meta;
    var html = '<section class="page-hero"><div class="wrap">' + crumb(t('nav_colleges')) + '<h1>' + t('dir_title') + '</h1><p class="lead">' + t('dir_lead') + '</p></div></section><div class="wrap section">' +
      chipRow([['colleges', '' + t('tab_col')], ['schools', '' + t('tab_sch')]], F.dir, 'dir_tab');
    if (onS && !API.online) {
      return html + '<div class="card empty">' + (API.checked ? '<h3>' + t('dir_offline_t') + '</h3><p>' + t('dir_offline_p') + '</p>' : '<h3>' + t('loading') + '</h3>') + '</div></div>';
    }
    html += '<div class="filters card"><label class="search"><span class="sr">' + t('search') + '</span><input type="search" value="' + esc(f.q) + '" placeholder="' + t(onS ? 'dir_q_sch' : 'col_search') + '" data-input="dir_q"></label>';
    if (onS) {
      html += '<div class="frow sel-row">' + select('district', f.district, t('all_districts'), M && M.districts) + select('mgmt', f.mgmt, t('all_mgmt'), M && M.mgmts) + select('board', f.board, t('all_boards'), M && M.boards) +
        '<select data-input="dir_sel" data-k="location" aria-label="' + t('sch_loc') + '"><option value="">' + t('sch_loc') + '</option><option value="Rural"' + (f.location === 'Rural' ? ' selected' : '') + '>' + t('rural') + '</option><option value="Urban"' + (f.location === 'Urban' ? ' selected' : '') + '>' + t('urban') + '</option></select></div>' +
        '<div class="frow"><span>' + t('dir_cls') + '</span>' + chipRow([['all', t('all')], ['12', t('dir_cls12')]], f.cls, 'dir_cls') + '</div>';
    } else {
      var types = [['all', t('all')]].concat(Object.keys(COLLEGE_TYPES).map(function (k) { return [k, L(COLLEGE_TYPES[k])]; }));
      html += '<div class="frow"><span>' + t('region') + '</span>' + chipRow([['all', t('all')], ['hry', t('hry')], ['ind', t('india')]], f.region, 'col_r') + '</div>' +
        (API.online ? '<div class="frow sel-row">' + select('district', f.district, t('all_districts'), M && M.collegeDistricts) + '</div>' : '') +
        '<div class="frow"><span>' + t('col_type') + '</span>' + chipRow(types, f.type, 'col_t') + '</div>';
    }
    html += '</div><p class="muted dir-count" id="dircount" aria-live="polite"></p><div id="dirlist" aria-live="polite"></div><div id="dirpg"></div>';
    var asof = M ? (onS ? M.schoolsAsOf : M.collegesAsOf) : '';
    html += '<div class="notice">' + (onS ? t('src_sch') : (API.online ? t('src_col') : t('col_note'))) + (API.online && asof ? ' <b>' + t('asof') + ': ' + fmtDate(asof) + '</b>.' : '') + ' ' + t('verify_note') + ' ' +
      (onS ? ext('https://schooleducationharyana.gov.in', 'schooleducationharyana.gov.in') : ext('https://admissions.highereduhry.ac.in', 'admissions.highereduhry.ac.in')) + '</div></div>';
    return html;
  };
  App.after = App.after || {};
  App.after.colleges = function () { loadList(); };

  /* ---------------- fetch + draw the list ---------------- */
  function loadList() {
    var box = document.getElementById('dirlist'); if (!box) return;
    var onS = F.dir === 'schools', f = onS ? F.schools : F.colleges, my = ++token;
    if (!API.online) { if (!onS) { box.innerHTML = staticColleges(); } return; }
    var url = onS ? 'api/schools?' + API.qs({ q: f.q, district: f.district, mgmt: f.mgmt, board: f.board, location: f.location, cls: f.cls, page: f.page })
      : 'api/colleges?' + API.qs({ q: f.q, district: f.district, type: f.type, region: f.region, page: f.page });
    box.setAttribute('aria-busy', 'true');
    API.get(url).then(function (d) {
      if (my !== token) return;
      box.removeAttribute('aria-busy');
      var cnt = document.getElementById('dircount'); if (cnt) cnt.textContent = d.total.toLocaleString() + ' ' + t('results');
      box.innerHTML = d.items.length ? '<div class="grid g3">' + d.items.map(onS ? schoolCard : collegeCard).join('') + '</div>' : '<div class="card empty"><h3>' + t('none') + '</h3></div>';
      var pg = document.getElementById('dirpg');
      if (pg) pg.innerHTML = d.pages > 1 ? '<div class="pager"><button class="btn btn-ghost sm" data-act="dir_pg" data-v="' + (d.page - 1) + '"' + (d.page <= 1 ? ' disabled' : '') + '>← ' + t('prev') + '</button><span>' + t('page') + ' ' + d.page + ' / ' + d.pages + '</span><button class="btn btn-ghost sm" data-act="dir_pg" data-v="' + (d.page + 1) + '"' + (d.page >= d.pages ? ' disabled' : '') + '>' + t('next') + ' →</button></div>' : '';
    }).catch(function () { if (my === token) { box.removeAttribute('aria-busy'); box.innerHTML = '<div class="card empty"><h3>' + t('dir_err') + '</h3></div>'; } });
  }

  function staticColleges() {
    var f = F.colleges, q = f.q.trim().toLowerCase();
    var list = COLLEGES.filter(function (c) {
      if (f.region !== 'all' && c.region !== f.region) return false;
      if (f.type !== 'all' && c.type !== f.type) return false;
      return !q || (c.n.en + c.n.hi + c.city.en + c.city.hi + c.exam).toLowerCase().indexOf(q) > -1;
    });
    var cnt = document.getElementById('dircount'); if (cnt) cnt.textContent = list.length + ' ' + t('results');
    if (!list.length) return '<div class="card empty"><h3>' + t('none') + '</h3></div>';
    return '<div class="grid g3">' + list.map(function (c) {
      return '<div class="card col"><span class="mini ' + (c.region === 'hry' ? 'ok' : '') + '">' + (c.region === 'hry' ? t('hry') : t('india')) + '</span><h3>' + esc(L(c.n)) + '</h3><p class="loc">' + esc(L(c.city)) + '</p>' +
        '<p><small>' + t('col_type') + '</small> ' + esc(L(COLLEGE_TYPES[c.type])) + '</p><p><small>' + t('f_exam') + '</small> ' + esc(c.exam) + '</p>' + ext(c.url, t('visit')) + '</div>';
    }).join('') + '</div>';
  }

  function collegeCard(c) {
    var hi = App.lang === 'hi', name = (hi && c.name_hi) || c.name_en, city = (hi && c.city_hi) || c.city_en;
    var loc = [city, c.district && c.district !== c.city_en ? c.district : '', c.state].filter(Boolean).join(', ');
    var tp = COLLEGE_TYPES[c.type] ? L(COLLEGE_TYPES[c.type]) : esc(c.type);
    return '<article class="card col"><div class="minis"><span class="mini ' + (c.state === 'Haryana' ? 'ok' : '') + '">' + (c.state === 'Haryana' ? t('hry') : t('india')) + '</span>' + (c.featured ? '<span class="mini new">' + t('featured') + '</span>' : '') + '</div>' +
      '<h3>' + esc(name) + '</h3>' + (loc ? '<p class="loc">' + esc(loc) + '</p>' : '') +
      row(t('col_type'), tp) + row(t('university'), esc(c.university)) + row(t('kind'), esc(c.kind)) + row(t('f_exam'), esc(c.exam)) + row(t('aishe'), esc(c.aishe_code)) +
      row(t('phone'), c.phone ? '<a href="tel:' + esc(String(c.phone).replace(/[^\d+]/g, '')) + '">' + esc(c.phone) + '</a>' : '') + row(t('address'), esc(c.address)) +
      (c.url ? ext(c.url, t('visit')) : '<p class="hint">' + t('no_site') + '</p>') + '<p class="hint src">' + t('source') + ': ' + esc(c.source) + ' · ' + fmtDate(c.updated) + '</p></article>';
  }

  function schoolCard(s) {
    var place = [s.village, s.block, s.district].filter(Boolean).join(', ') + (s.pincode ? ' – ' + s.pincode : '');
    var govt = !/private|unrecog/i.test(s.mgmt);
    var map = s.lat && s.lon ? '<a class="lnk" href="https://www.openstreetmap.org/?mlat=' + esc(s.lat) + '&mlon=' + esc(s.lon) + '#map=16/' + esc(s.lat) + '/' + esc(s.lon) + '" target="_blank" rel="noopener noreferrer">' + t('map') + ' ↗</a>' : '';
    return '<article class="card col sch-card"><div class="minis"><span class="mini ' + (govt ? 'ok' : '') + '">' + esc(s.mgmt) + '</span>' + (s.board ? '<span class="mini">' + esc(s.board) + '</span>' : '') + (s.location ? '<span class="mini">' + esc(s.location) + '</span>' : '') + '</div>' +
      '<h3>' + esc(s.name) + '</h3><p class="loc">' + esc(place) + '</p>' +
      row(t('udise'), '<b>' + esc(s.udise) + '</b>') + row(t('classes'), s.class_from ? esc(s.class_from + ' – ' + s.class_to) : '') + row(t('sch_cat'), esc(s.school_type)) +
      row(t('est'), esc(s.est)) + row(t('teachers'), s.teachers === '' ? '' : esc(s.teachers)) +
      row(t('stud10'), s.students_x === '' ? '' : esc(s.students_x)) + (s.class_to >= 12 ? row(t('stud12'), s.students_xii === '' ? '' : esc(s.students_xii)) : '') +
      '<div class="card-actions">' + map + '<button type="button" class="btn btn-ghost sm" data-act="dir_pick" data-u="' + esc(s.udise) + '">' + t('use_sch') + '</button></div>' +
      '<p class="hint src">' + t('source') + ': ' + esc(s.source) + ' · ' + fmtDate(s.updated) + '</p></article>';
  }

  /* ---------------- actions ---------------- */
  AC.dir_tab = function (el) { F.dir = el.getAttribute('data-v'); App.rerender(true); };
  AC.dir_q = function (el) {
    var f = F.dir === 'schools' ? F.schools : F.colleges; f.q = el.value; f.page = 1;
    clearTimeout(timer); timer = setTimeout(loadList, 250);
  };
  AC.dir_sel = function (el) { var f = F.dir === 'schools' ? F.schools : F.colleges; f[el.getAttribute('data-k')] = el.value; f.page = 1; loadList(); };
  AC.col_r = function (el) { F.colleges.region = el.getAttribute('data-v'); F.colleges.page = 1; App.rerender(true); };
  AC.col_t = function (el) { F.colleges.type = el.getAttribute('data-v'); F.colleges.page = 1; App.rerender(true); };
  AC.col_for = function (el) { F.dir = 'colleges'; F.colleges = { region: 'all', type: el.getAttribute('data-v'), q: '', district: '', page: 1 }; };
  AC.dir_cls = function (el) { F.schools.cls = el.getAttribute('data-v'); F.schools.page = 1; App.rerender(true); };
  AC.dir_pg = function (el) {
    var f = F.dir === 'schools' ? F.schools : F.colleges; f.page = +el.getAttribute('data-v'); loadList();
    var b = document.getElementById('dircount'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  AC.dir_pick = function (el) {
    API.get('api/schools/' + encodeURIComponent(el.getAttribute('data-u'))).then(function (s) {
      F.school = Object.assign(F.school || {}, { udise: s.udise, school_name: s.name, district: s.district, block: s.block, found: s.name });
      App.go('school');
    });
  };
})();
