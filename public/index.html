  <script>
/* =====================================================================
   BRANCH PAGE  —  #/branch/<id>/<10|12>
   Every box of the Career Tree opens here: what the branch is, what you study, who can enter,
   exams, advice, the sub-branches inside it and a table of ALL careers under it.
   Text comes from data/branches.js; structure from data/tree.js; careers from data/careers.js.
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, F = App.f;

  function findPath(list, id, acc) {
    for (var i = 0; i < list.length; i++) {
      var n = list[i]; if (typeof n === 'string') continue;
      var p = acc.concat([n]);
      if (n.id === id) return p;
      var r = findPath(n.kids, id, p); if (r) return r;
    }
    return null;
  }
  function careersOf(n, seen, out) {                     // every career under a node, in order, no repeats
    (typeof n === 'string' ? [n] : n.kids).forEach(function (k) {
      if (typeof k === 'string') { if (!seen[k]) { seen[k] = 1; var c = byId(CAREERS, k); if (c) out.push(c); } } else careersOf(k, seen, out);
    });
    return out;
  }
  function subBranches(n) { return n.kids.filter(function (k) { return typeof k !== 'string'; }); }
  function costTxt(n) { return ['', '₹ ' + t('c_low'), '₹₹ ' + t('c_mid'), '₹₹₹ ' + t('c_high')][n]; }
  function list(a) { return '<ul class="ticks">' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }

  /* where does this career sit in the trees?  (used on the career page) */
  App.branchesFor = function (cid) {
    var out = '';
    ['10', '12'].forEach(function (tk) {
      var rows = [];
      (function walk(list, trail) {
        list.forEach(function (n) {
          if (typeof n === 'string') { if (n === cid) rows.push(trail); return; }
          walk(n.kids, trail.concat([n]));
        });
      })(TREE[tk].kids, []);
      var seen = {};
      rows.forEach(function (trail) {
        var key = trail.map(function (n) { return n.id; }).join('>'); if (seen[key]) return; seen[key] = 1;
        out += '<li><b class="cls-tag">' + t('after') + ' ' + tk + '</b> ' + trail.map(function (n, i) {
          return '<a href="#/branch/' + n.id + '/' + tk + '">' + esc(L(n.name)) + '</a>';
        }).join(' <span aria-hidden="true">›</span> ') + '</li>';
      });
    });
    return out ? '<div class="card"><h3>' + t('br_where') + '</h3><ul class="trails">' + out + '</ul></div>' : '';
  };

  V.branch = function (args) {
    var id = args[0], tk = args[1], path = null;
    if (TREE[tk]) path = findPath(TREE[tk].kids, id, []);
    if (!path) { tk = F.tree; path = findPath(TREE[tk].kids, id, []); }
    if (!path) { tk = tk === '10' ? '12' : '10'; path = findPath(TREE[tk].kids, id, []); }
    if (!path) return '<div class="wrap section"><div class="card empty"><h2>' + t('not_found') + '</h2><p>' + t('not_found_p') + '</p><a class="btn" href="#/tree">' + t('nav_tree') + '</a></div></div>';
    F.tree = tk;
    var n = path[path.length - 1], B = window.BRANCHES[id] || {}, parent = path.length > 1 ? path[path.length - 2] : null;
    var careers = careersOf(n, {}, []), subs = subBranches(n), done = App.A && App.A.step === 'done';
    var siblings = (parent ? parent.kids : TREE[tk].kids).filter(function (k) { return typeof k !== 'string' && k.id !== id; });

    var crumbs = '<nav class="crumbs" aria-label="' + t('br_crumb') + '"><a href="#/tree" data-act="tree_go" data-v="' + tk + '">' + t('nav_tree') + '</a><span>›</span><a href="#/tree" data-act="tree_go" data-v="' + tk + '">' + esc(L(TREE[tk].name)) + '</a>' +
      path.map(function (p, i) { return '<span>›</span>' + (i < path.length - 1 ? '<a href="#/branch/' + p.id + '/' + tk + '">' + esc(L(p.name)) + '</a>' : '<b aria-current="page">' + esc(L(p.name)) + '</b>'); }).join('') + '</nav>';

    var html = '<section class="page-hero branch-hero ' + (path[0].c || '') + '"><div class="wrap">' + crumbs + '<h1><span class="ico-tile big-ico">' + n.ico + '</span> ' + esc(L(n.name)) + '</h1>' +
      (n.note ? '<p class="lead">' + esc(L(n.note)) + '</p>' : '') + '</div></section><div class="wrap section"><div class="detail"><div class="main-col">';

    if (B.d) html += '<div class="card"><h2>' + t('br_about') + '</h2><p class="big">' + esc(L(B.d)) + '</p></div>';
    html += '<div class="grid g2">' +
      (B.study ? '<div class="card"><h3>' + t('br_study') + '</h3>' + list(B.study[App.lang] || B.study.en) + '</div>' : '') +
      (B.elig ? '<div class="card"><h3>' + t('br_elig') + '</h3><p>' + esc(L(B.elig)) + '</p></div>' : '') +
      (B.exams ? '<div class="card"><h3>' + t('br_exams') + '</h3><p>' + esc(L(B.exams)) + '</p></div>' : '') +
      (B.tip ? '<div class="card goldcard"><h3>' + t('br_tip') + '</h3><p>' + esc(L(B.tip)) + '</p></div>' : '') + '</div>';

    if (subs.length) {
      html += '<h2 class="sec-t">' + t('br_inside') + ' (' + subs.length + ')</h2><div class="grid g2 branch-grid">' + subs.map(function (k) {
        var kb = window.BRANCHES[k.id] || {}, cs = careersOf(k, {}, []);
        return '<a class="card branch-card ' + (k.c || path[0].c || '') + '" href="#/branch/' + k.id + '/' + tk + '"><div class="car-h"><span class="ico-tile">' + k.ico + '</span><div><h3>' + esc(L(k.name)) + '</h3><small>' + cs.length + ' ' + t('tr_careers') + '</small></div></div>' +
          '<p>' + esc(L(k.note || (kb.d ? { en: kb.d.en.split('. ')[0] + '.', hi: kb.d.hi.split('। ')[0] + '।' } : ''))) + '</p>' +
          '<div class="pills">' + cs.slice(0, 4).map(function (c) { return '<span class="pill">' + esc(L(c.name)) + '</span>'; }).join('') + (cs.length > 4 ? '<span class="pill">+' + (cs.length - 4) + '</span>' : '') + '</div><span class="go">' + t('tr_details') + ' →</span></a>';
      }).join('') + '</div>';
    }

    html += '<h2 class="sec-t">' + t('br_all') + ' (' + careers.length + ')</h2><p class="muted">' + t('br_all_p') + '</p><div class="grid g2 br-careers">' + careers.map(function (c) {
      var fit = done ? App.fitFor(c) : null;
      return '<a class="card car" href="#/career/' + c.id + '"><div class="car-h"><span class="ico-tile">' + c.ico + '</span><div><h3>' + esc(L(c.name)) + '</h3><small>' + esc(L(c.dur)) + '</small></div></div><p>' + esc(L(c.about).split('. ')[0]) + '.</p>' +
        '<p class="mini-row"><small>' + t('f_elig') + '</small> ' + esc(L(c.elig)) + '</p><p class="mini-row"><small>' + t('f_exam') + '</small> ' + esc(L(c.exams)) + '</p>' +
        '<div class="minis"><span class="mini">' + costTxt(c.cost) + '</span><span class="mini">' + (c.earn <= 1 ? '≤1' : c.earn) + ' ' + t('yrs') + '</span>' + (fit ? '<span class="mini ok">' + t('your_fit') + ' ' + fit.prac + '%</span>' : '') + '</div><span class="go">' + t('br_read') + ' →</span></a>';
    }).join('') + '</div>';

    if (careers.length > 1) {
      html += '<div class="card tbl-card"><h3>' + t('br_compare') + '</h3><table class="tbl"><thead><tr><th>' + t('br_career') + '</th><th>' + t('f_dur') + '</th><th>' + t('f_elig') + '</th><th>' + t('f_exam') + '</th><th>' + t('f_cost') + '</th></tr></thead><tbody>' +
        careers.map(function (c) {
          return '<tr><td data-l="' + t('br_career') + '"><a href="#/career/' + c.id + '"><b>' + esc(L(c.name)) + '</b></a></td><td data-l="' + t('f_dur') + '">' + esc(L(c.dur)) + '</td><td data-l="' + t('f_elig') + '">' + esc(L(c.elig)) + '</td><td data-l="' + t('f_exam') + '">' + esc(L(c.exams)) + '</td><td data-l="' + t('f_cost') + '">' + costTxt(c.cost) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '</div><aside class="side-col">' +
      '<div class="card"><h3>' + t('br_here') + '</h3><div class="facts one"><div><small>' + t('br_n_sub') + '</small><b>' + subs.length + '</b></div><div><small>' + t('br_n_car') + '</small><b>' + careers.length + '</b></div></div>' +
      (parent ? '<a class="btn btn-ghost block" href="#/branch/' + parent.id + '/' + tk + '">↑ ' + esc(L(parent.name)) + '</a>' : '') +
      '<a class="btn btn-ghost block" href="#/tree" data-act="tree_go" data-v="' + tk + '">' + t('br_back') + '</a></div>' +
      (siblings.length ? '<div class="card"><h3>' + t('br_sib') + '</h3><div class="pills">' + siblings.map(function (k) { return '<a class="pill" href="#/branch/' + k.id + '/' + tk + '">' + esc(L(k.name)) + '</a>'; }).join('') + '</div></div>' : '') +
      '<div class="card"><h3>' + t('explore') + '</h3><a class="btn btn-ghost block" href="#/colleges">' + t('nav_colleges') + '</a><a class="btn btn-ghost block" href="#/scholarships">' + t('nav_sch') + '</a><a class="btn btn-ghost block" href="#/calendar">' + t('nav_cal') + '</a>' +
      (done ? '' : '<a class="btn block" href="#/assess">' + t('hm_cta1') + '</a>') + '</div></aside></div></div>';
    return html;
  };
})();

</script>
  <script>
/* =====================================================================
   SCHOOL CORNER  —  #/school
   For the school coordinator (teacher) after a class has taken the assessment:
   fill the school details, add 1–5 group photos, press Submit.
   • NO student name, answer or result is sent. Only the school details + photos.
   • Photos are shrunk to about 1600 px in the browser first (also removes hidden GPS data).
   • Needs the backend (App.API.online). Without it the page explains what to do.
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, AC = App.actions, F = App.f, API = App.API;
  F.school = F.school || {};
  var photos = [], sending = false, done = null, msg = '', findTimer = null, lookupTimer = null;

  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function val(k, d) { return F.school[k] != null && F.school[k] !== '' ? F.school[k] : (d || ''); }
  function field(k, label, attrs, extra) {
    return '<label class="fld"><span>' + label + '</span><input data-input="sc_f" data-k="' + k + '" value="' + esc(val(k, extra && extra.def)) + '" ' + (attrs || '') + '></label>';
  }

  V.school = function () {
    var steps = ['sc_s1', 'sc_s2', 'sc_s3', 'sc_s4'];
    var html = '<section class="page-hero"><div class="wrap">' + crumb(t('sc_eyebrow')) + '<h1>' + t('sc_title') + '</h1><p class="lead">' + t('sc_lead') + '</p></div></section><div class="wrap section">' +
      '<ol class="steps">' + steps.map(function (k, i) { return '<li><span>' + (i + 1) + '</span><div><b>' + t(k) + '</b><p>' + t(k + 'd') + '</p></div></li>'; }).join('') + '</ol>' +
      '<div class="notice priv">' + t('sc_priv') + '</div>';
    if (!API.online) {
      return html + '<div class="card empty"><h3>' + (API.checked ? '' + t('sc_off_t') : '' + t('loading')) + '</h3>' + (API.checked ? '<p>' + t('sc_off_p') + '</p>' : '') + '</div></div>';
    }
    if (done) {
      return html + '<div class="card success"><div class="ok-ico">✔</div><h2>' + t('sc_done') + '</h2><p>' + t('sc_ref') + '</p><div class="refid">' + esc(done) + '</div><p class="hint">' + t('sc_done_p') + '</p>' +
        '<p class="cta-row"><button class="btn" data-act="sc_again">' + t('sc_again') + '</button><a class="btn btn-ghost" href="#/assess">' + t('hm_cta1') + '</a></p></div></div>';
    }
    var M = API.meta, max = M.maxPhotos || 5;
    html += '<form class="card school-form" id="schform" novalidate autocomplete="off">' +
      '<h2>1 · ' + t('sc_find') + '</h2><p class="hint">' + t('sc_find_h') + '</p>' +
      '<div class="find"><input type="search" id="scfind" placeholder="' + t('sc_find_ph') + '" data-input="sc_find" aria-label="' + t('sc_find') + '"><div id="scfound" class="found" aria-live="polite"></div></div>' +
      '<h2>2 · ' + t('sc_details') + '</h2><div class="grid g2 ff">' +
      field('udise', t('udise') + ' *', 'inputmode="numeric" maxlength="11" pattern="[0-9]{11}" placeholder="11 digits" id="f_udise"') +
      field('school_name', t('sc_name') + ' *', 'maxlength="150" id="f_school_name"') +
      '<label class="fld"><span>' + t('district') + ' *</span><select data-input="sc_f" data-k="district" id="f_district"><option value="">—</option>' + (M.districts || []).map(function (d) { return '<option' + (val('district') === d ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') + '</select></label>' +
      field('block', t('block'), 'maxlength="60" id="f_block"') +
      '<label class="fld"><span>' + t('sc_cls') + ' *</span><select data-input="sc_f" data-k="cls"><option value="">—</option><option value="10"' + (val('cls') === '10' ? ' selected' : '') + '>' + t('cls_10') + '</option><option value="12"' + (val('cls') === '12' ? ' selected' : '') + '>' + t('cls_12') + '</option><option value="10,12"' + (val('cls') === '10,12' ? ' selected' : '') + '>' + t('sc_both') + '</option></select></label>' +
      field('students', t('sc_n') + ' *', 'type="number" min="1" max="3000" inputmode="numeric"') +
      field('session_date', t('sc_date') + ' *', 'type="date" max="' + today() + '"', { def: today() }) +
      field('coordinator', t('sc_coord') + ' *', 'maxlength="80"') +
      field('mobile', t('sc_mobile'), 'type="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}"') +
      (M.uploadPin ? field('pin', t('sc_pin') + ' *', 'type="password" autocomplete="off"') : '') +
      '<label class="fld wide"><span>' + t('sc_remarks') + '</span><input data-input="sc_f" data-k="remarks" maxlength="300" value="' + esc(val('remarks')) + '"></label></div>' +
      '<input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp" data-input="sc_f" data-k="website">' +
      '<h2>3 · ' + t('sc_photos') + ' <span class="cnt-badge" id="phcount"></span></h2><p class="hint">' + t('sc_photos_h').replace('{n}', max) + '</p>' +
      '<div class="photo-btns"><button type="button" class="btn" data-act="sc_cam">' + t('sc_cam') + '</button><button type="button" class="btn btn-ghost" data-act="sc_gal">' + t('sc_gal') + '</button></div>' +
      '<input type="file" id="ph_cam" accept="image/*" capture="environment" hidden><input type="file" id="ph_gal" accept="image/*" multiple hidden>' +
      '<div class="thumbs" id="thumbs"></div>' +
      '<label class="consent"><input type="checkbox" id="f_consent"' + (F.school.consent ? ' checked' : '') + ' data-input="sc_consent"> <span>' + t('sc_consent') + '</span></label>' +
      '<div id="scmsg" class="form-msg" role="alert" aria-live="assertive">' + (msg ? esc(msg) : '') + '</div>' +
      '<p class="cta-row"><button type="submit" class="btn btn-lg" id="scsubmit" >' + (sending ? t('sc_sending') : '' + t('sc_submit')) + '</button></p></form></div>';
    return html;
  };

  App.after = App.after || {};
  App.after.school = function () { drawThumbs(); var f = document.getElementById('schform'); if (f) f.addEventListener('submit', function (e) { e.preventDefault(); AC.sc_submit(); }); };

  /* ---- form state: remember what was typed, even if the language is switched ---- */
  AC.sc_f = function (el) {
    var k = el.getAttribute('data-k'), v = el.value;
    if (k === 'udise') { v = v.replace(/\D/g, '').slice(0, 11); if (el.value !== v) el.value = v; clearTimeout(lookupTimer); if (v.length === 11) lookupTimer = setTimeout(function () { lookup(v); }, 200); else { F.school.found = ''; } }
    if (k === 'mobile') { v = v.replace(/\D/g, '').slice(0, 10); if (el.value !== v) el.value = v; }
    F.school[k] = v;
  };
  AC.sc_consent = function (el) { F.school.consent = el.checked; };

  function lookup(u) {
    API.get('api/schools/' + u).then(function (s) { fillFrom(s); }).catch(function () { setFound(t('sc_nf'), false); });
  }
  function fillFrom(s) {
    F.school.udise = s.udise; F.school.school_name = s.name; F.school.district = s.district; F.school.block = s.block || ''; F.school.found = s.name;
    ['udise', 'school_name', 'district', 'block'].forEach(function (k) { var e = document.getElementById('f_' + k); if (e) e.value = F.school[k]; });
    setFound('✔ ' + s.name + ' — ' + s.district, true);
  }
  function setFound(txt, ok) { var b = document.getElementById('scfound'); if (b) { b.textContent = txt; b.className = 'found ' + (ok ? 'ok' : 'bad'); } }

  /* ---- find school by name ---- */
  AC.sc_find = function (el) {
    clearTimeout(findTimer);
    var q = el.value.trim(), box = document.getElementById('scfound');
    if (q.length < 3) { if (box) { box.className = 'found'; box.textContent = ''; } return; }
    findTimer = setTimeout(function () {
      API.get('api/schools?' + API.qs({ q: q, district: F.school.district, limit: 6 })).then(function (d) {
        if (!box) return; box.className = 'found';
        box.innerHTML = d.items.length ? d.items.map(function (s) { return '<button type="button" class="found-item" data-act="sc_pick" data-u="' + esc(s.udise) + '"><b>' + esc(s.name) + '</b><small>' + esc([s.village, s.block, s.district].filter(Boolean).join(', ')) + ' · ' + esc(s.udise) + '</small></button>'; }).join('') : esc(t('none'));
      });
    }, 300);
  };
  AC.sc_pick = function (el) {
    API.get('api/schools/' + el.getAttribute('data-u')).then(function (s) { fillFrom(s); var f = document.getElementById('scfind'); if (f) f.value = ''; });
  };

  /* ---- photos ---- */
  AC.sc_cam = function () { document.getElementById('ph_cam').click(); };
  AC.sc_gal = function () { document.getElementById('ph_gal').click(); };
  document.addEventListener('change', function (e) {
    if (e.target && (e.target.id === 'ph_cam' || e.target.id === 'ph_gal')) { addFiles(Array.prototype.slice.call(e.target.files)); e.target.value = ''; }
  });
  function addFiles(files) {
    var max = (API.meta && API.meta.maxPhotos) || 5, chain = Promise.resolve();
    files.forEach(function (f) {
      chain = chain.then(function () {
        if (photos.length >= max) { msg = t('sc_max').replace('{n}', max); return; }
        if (!/^image\//.test(f.type)) return;
        return shrink(f).then(function (b) { photos.push({ blob: b, url: URL.createObjectURL(b) }); }).catch(function () { msg = t('sc_badimg'); });
      });
    });
    chain.then(function () { drawThumbs(); var m = document.getElementById('scmsg'); if (m) m.textContent = msg; });
  }
  function shrink(file) {                                   // → JPEG blob, longest side ≤ 1600 px
    return new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('blob')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }
  function drawThumbs() {
    var box = document.getElementById('thumbs'), cnt = document.getElementById('phcount'); if (!box) return;
    var max = (API.meta && API.meta.maxPhotos) || 5;
    if (cnt) cnt.textContent = photos.length + ' / ' + max;
    box.innerHTML = photos.map(function (p, i) {
      return '<figure class="thumb"><img src="' + p.url + '" alt="' + t('sc_photo') + ' ' + (i + 1) + '"><button type="button" data-act="sc_rm" data-i="' + i + '" aria-label="' + t('sc_remove') + '">✕</button><figcaption>' + Math.round(p.blob.size / 1024) + ' KB</figcaption></figure>';
    }).join('');
  }
  AC.sc_rm = function (el) { var p = photos.splice(+el.getAttribute('data-i'), 1)[0]; if (p) URL.revokeObjectURL(p.url); drawThumbs(); };

  /* ---- send ---- */
  function fail(m) { msg = m; var b = document.getElementById('scmsg'); if (b) { b.textContent = m; b.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
  AC.sc_submit = function () {
    if (sending) return;
    var s = F.school;
    if (!/^\d{11}$/.test(s.udise || '')) return fail(t('sc_e_udise'));
    if (!s.school_name || !s.district) return fail(t('sc_e_name'));
    if (!s.cls) return fail(t('sc_e_cls'));
    if (!(+s.students >= 1)) return fail(t('sc_e_n'));
    if (!(s.coordinator || '').trim()) return fail(t('sc_e_coord'));
    if (s.mobile && !/^\d{10}$/.test(s.mobile)) return fail(t('sc_e_mobile'));
    if (!photos.length) return fail(t('sc_e_photo'));
    if (!s.consent) return fail(t('sc_e_consent'));
    var fd = new FormData();
    ['udise', 'school_name', 'district', 'block', 'cls', 'students', 'coordinator', 'mobile', 'remarks', 'pin', 'website'].forEach(function (k) { fd.append(k, s[k] || ''); });
    fd.append('session_date', s.session_date || today()); fd.append('consent', 'yes');
    photos.forEach(function (p, i) { fd.append('photos', p.blob, 'photo' + (i + 1) + '.jpg'); });
    sending = true; msg = ''; var btn = document.getElementById('scsubmit'); if (btn) { btn.disabled = true; btn.textContent = t('sc_sending'); }
    fetch('api/submissions', { method: 'POST', body: fd, credentials: 'same-origin' }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        sending = false;
        if (x.ok && x.j.ok) {
          done = x.j.id; photos.forEach(function (p) { URL.revokeObjectURL(p.url); }); photos = [];
          F.school = { udise: s.udise, school_name: s.school_name, district: s.district, block: s.block, coordinator: s.coordinator, mobile: s.mobile, pin: s.pin };
          App.rerender(); window.scrollTo(0, 0);
        } else { App.rerender(true); fail(x.j.error || t('sc_e_net')); }
      }).catch(function () { sending = false; App.rerender(true); fail(t('sc_e_net')); });
  };
  AC.sc_again = function () { done = null; msg = ''; App.rerender(); window.scrollTo(0, 0); };
})();

</script>
  <script>
/* =====================================================================
   CERTIFICATE  —  #/certificate
   The student types name, class and school; the page builds a 2-page A4 certificate
   (page 1 = front: certificate of participation, page 2 = back: personal career profile)
   for DOUBLE-SIDED printing on ONE sheet.
   The name / school typed here are used ONLY to draw the page. They are never saved or sent anywhere.
   ===================================================================== */
(function () {
  'use strict';
  var V = App.views, AC = App.actions, F = App.f, API = App.API;
  F.cert = F.cert || { name: '', cls: '', school: '', date: '' };
  var timer = null, EMBLEM = window.EMBLEM;

  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function fmtDate(iso) {
    var p = (iso || today()).split('-'), M = { en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], hi: ['जन॰', 'फ़र॰', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुल॰', 'अग॰', 'सित॰', 'अक्टू॰', 'नव॰', 'दिस॰'] };
    return +p[2] + ' ' + M.en[+p[1] - 1] + ' ' + p[0];
  }
  var BI = function (en, hi) { return '<span class="bi"><span class="en">' + en + '</span><span class="hi" lang="hi">' + hi + '</span></span>'; };

  /* ---------------------------- page 1: front ---------------------------- */
  function front(c, R) {
    var name = esc(c.name.trim()) || '<span class="ph">' + esc(t('cert_ph_name')) + '</span>', school = esc(c.school.trim()) || '<span class="ph">' + esc(t('cert_ph_school')) + '</span>';
    var cl = c.cls === '12' ? { en: 'Class 12', hi: 'कक्षा 12' } : { en: 'Class 10', hi: 'कक्षा 10' };
    var code = R.r.code.split('').map(function (x) { return '<span class="rc" style="background:' + RIASEC[x].c + '"><b>' + x + '</b>' + esc(L(RIASEC[x].name).split(' — ')[0]) + '</span>'; }).join('');
    return '<div class="sheet front"><div class="frame"><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i></div>' +
      '<img class="wm" src="' + EMBLEM + '" alt="">' +
      '<div class="inner">' +
      '<header class="ch"><img src="' + EMBLEM + '" alt="" class="em"><div class="gov"><b lang="hi">हरियाणा सरकार</b><b>Government of Haryana</b></div></header>' +
      '<p class="prog"><span lang="hi">मेरा भविष्य – मेरा निर्णय</span> · Career Guidance Programme</p>' +
      '<div class="rule"><span>✦</span></div>' +
      '<h1 class="ct"><span lang="hi">सहभागिता प्रमाण-पत्र</span><small>CERTIFICATE OF PARTICIPATION</small></h1>' +
      '<p class="cert-that">' + BI('This is to certify that', 'प्रमाणित किया जाता है कि') + '</p>' +
      '<div class="cname">' + name + '</div>' +
      '<p class="cmeta"><b>' + cl.en + ' / <span lang="hi">' + cl.hi + '</span></b></p><p class="cschool">' + school + '</p>' +
      '<p class="cbody en">has successfully completed the <b>Career Assessment</b> — Interests, Aptitude, Learning Style and Personal Situation — and has received a personalised career profile to help in choosing the right stream, course and career.</p>' +
      '<p class="cbody hi" lang="hi">ने <b>करियर आकलन</b> — रुचि, अभिरुचि, सीखने की शैली व व्यक्तिगत परिस्थिति — सफलतापूर्वक पूरा किया है तथा सही स्ट्रीम, कोर्स व करियर चुनने हेतु अपनी व्यक्तिगत करियर प्रोफ़ाइल प्राप्त की है।</p>' +
      '<div class="rcode"><span class="lbl">' + BI('My interest code', 'मेरा रुचि-कोड') + '</span>' + code + '</div>' +
      '<div class="sigs"><div><i></i>' + BI('Career Guidance Teacher', 'करियर मार्गदर्शन शिक्षक') + '</div><div class="seal"><span>' + BI('School seal', 'विद्यालय मुहर') + '</span></div><div><i></i>' + BI('Principal', 'प्रधानाचार्य') + '</div></div>' +
      '<p class="cdate">' + BI('Date', 'दिनांक') + ': <b>' + fmtDate(c.date) + '</b></p>' +
      '<p class="cfoot">' + BI('This certificate recognises participation. It is guidance, not an examination result or a qualification.', 'यह प्रमाण-पत्र सहभागिता का है। यह मार्गदर्शन है, परीक्षा-परिणाम या शैक्षिक योग्यता नहीं।') + '</p>' +
      '<p class="cfoot cself">' + BI(UI.en.cert_self, UI.hi.cert_self) + '</p>' +
      '</div></div>';
  }

  /* ---------------------------- page 2: back ---------------------------- */
  /* bands, not raw percentages: a 2-item-per-area screener printed as "100%" invites comparisons it cannot support */
  function bar(label, pct, col) {
    var b = App.aptBand(pct), lvl = b === 'apt_b3' ? 3 : b === 'apt_b2' ? 2 : b === 'apt_b1' ? 1 : 0;
    return '<div class="pb"><span>' + esc(label) + '</span><i><u style="width:' + (lvl * 33) + '%;background:' + col + '"></u></i><b>' + esc(t(b)) + '</b></div>';
  }
  function fitWord(v) { return esc(t(v >= 70 ? 'fit_great' : v >= 52 ? 'fit_good' : 'fit_poss')); }
  /* one list, no dream / practical split: every suggested career with what it is, how long, cost and how to get in */
  function careerList(R) {
    var seen = {}, all = R.dream.concat(R.prac, R.more || []).filter(function (s) { return seen[s.c.id] ? false : (seen[s.c.id] = 1); });
    all.sort(function (a, b) { return (b.dream + b.prac) - (a.dream + a.prac); });
    return all.slice(0, 8);
  }
  function careerRow(s) {
    var c = s.c, v = Math.round((s.dream + s.prac) / 2);
    return '<li><span class="ci">' + c.ico + '</span><div><b>' + esc(L(c.name)) + ' <em>' + fitWord(v) + '</em></b><p>' + esc(L(c.about)) + '</p>' +
      '<small>' + esc(L(c.dur)) + ' · ' + ['', '₹ ' + t('c_low'), '₹₹ ' + t('c_mid'), '₹₹₹ ' + t('c_high')][c.cost] + (c.exams ? ' · ' + esc(L(c.exams)) : '') + '</small></div></li>';
  }
  function back(c, R) {
    var r = R.r, ls = R.ls, cls = c.cls || R.cls;
    var name = esc(c.name.trim()) || '—', school = esc(c.school.trim());
    var top3 = r.order.slice(0, 3).map(function (x) {
      return '<div class="t3"><b style="background:' + RIASEC[x].c + '">' + x + '</b><div><strong>' + esc(L(RIASEC[x].name)) + '</strong><span>' + esc(L(RIASEC[x].d)) + '</span></div></div>';
    }).join('');
    var apt = Object.keys(r.apt).map(function (k) { return bar(L(APTITUDE_NAMES[k]), r.apt[k], '#1a4be0'); }).join('');
    var vals = R.topVals.map(function (k) { return esc(L(VALUE_NAMES[k])); }).join(' · ');
    var subs = R.subs.map(function (x) { return esc(L(x.name)) + ' ' + (x.band != null ? esc(L(MARK_BANDS[x.band][1])) : '—'); }).join(' · ');
    var sch = R.sch.slice(0, 3).map(function (x) { return esc(L(x.s.name)) + (x.s.site ? ' <small>(' + esc(x.s.site) + ')</small>' : ''); }).join(' · ');
    var streamLine = R.cls === '10' && R.streams && R.streams.length ? '<div class="strm"><b>' + esc(t('res_stream')) + ':</b> ' + esc(t('st_' + R.streams[0])) + (R.streams[1] ? ' / ' + esc(t('st_' + R.streams[1])) : '') + '</div>' : '';
    var sites = ['scholarships.gov.in', 'nta.ac.in', 'ncs.gov.in', 'swayam.gov.in', 'digilocker.gov.in', 'vidyalakshmi.co.in'];
    return '<div class="sheet back"><div class="inner">' +
      '<header class="bh"><img src="' + EMBLEM + '" alt="" class="em"><div class="bt"><h2>' + BI('My Career Profile', 'मेरी करियर प्रोफ़ाइल') + '</h2><p>' + t('site_title') + '</p></div>' +
      '<div class="who"><b>' + name + '</b><span>' + esc(L(cls === '12' ? { en: 'Class 12', hi: 'कक्षा 12' } : { en: 'Class 10', hi: 'कक्षा 10' })) + (school ? ' · ' + school : '') + '</span></div></header>' +
      '<div class="b-grid">' +
      '<section class="bx"><h3>' + esc(t('res_int')) + '</h3><div class="rw"><div class="rdr">' + App.radarSvg(r) + '</div><div class="t3s">' + top3 + '</div></div></section>' +
      '<section class="bx"><h3>' + esc(t('res_apt')) + '</h3>' + apt + '<p class="sm"><b>' + esc(t('res_sub')) + ':</b> ' + subs + '</p><p class="sm"><b>' + esc(t('res_val')) + ':</b> ' + vals + '</p><h3 class="mt">' + esc(t('res_learn')) + ': ' + esc(L(ls.name)) + '</h3><p class="sm">' + esc(L(ls.tip)) + '</p></section>' +
      '</div>' + streamLine +
      '<section class="bx careers"><h3>' + esc(L({ en: 'Careers that suit you', hi: 'आपके लिए उपयुक्त करियर' })) + ' <small>' + esc(L({ en: '— best match first', hi: '— सबसे उपयुक्त पहले' })) + '</small></h3><ul class="cl2">' + careerList(R).map(careerRow).join('') + '</ul></section>' +
      '<section class="bx extra"><p class="sm"><b>' + esc(t('res_sch')) + ':</b> ' + (sch || esc(t('sch_hint'))) + '</p><p class="sites"><b>' + esc(t('nav_links')) + ':</b> ' + sites.join(' · ') + '</p></section>' +
      '<p class="bfoot">' + esc(t('res_disc')) + '</p></div></div>';
  }

  /* ---------------------------- page ---------------------------- */
  V.certificate = function () {
    var R = App.report(), c = F.cert;
    /* class follows the assessment profile until the student changes it by hand */
    if (!c.clsSet) c.cls = (App.A && App.A.profile && App.A.profile.cls) || c.cls || '10';
    if (!c.date) c.date = today();
    var html = '<section class="page-hero no-print"><div class="wrap">' + crumb(t('cert_eyebrow')) + '<h1>' + t('cert_title') + '</h1><p class="lead">' + t('cert_lead') + '</p></div></section>';
    if (!R) return html + '<div class="wrap section no-print"><div class="card empty"><h2>' + t('res_none') + '</h2><p>' + t('cert_need') + '</p><a class="btn" href="#/assess">' + t('as_begin') + ' →</a></div></div>';
    html += '<div class="wrap section cert-ui no-print"><div class="grid g2 cert-top"><form class="card" id="certform" autocomplete="off" onsubmit="return false">' +
      '<h2>' + t('cert_details') + '</h2>' +
      '<label class="fld"><span>' + t('cert_name') + ' *</span><input data-input="ct_f" data-k="name" maxlength="60" value="' + esc(c.name) + '" placeholder="' + esc(t('cert_ph_name')) + '" id="ct_name"></label>' +
      '<label class="fld"><span>' + t('cert_class') + ' *</span><select data-input="ct_f" data-k="cls"><option value="10"' + (c.cls === '10' ? ' selected' : '') + '>' + t('cls_10') + '</option><option value="12"' + (c.cls === '12' ? ' selected' : '') + '>' + t('cls_12') + '</option></select></label>' +
      '<label class="fld"><span>' + t('cert_school') + ' *</span><input data-input="ct_f" data-k="school" maxlength="120" value="' + esc(c.school) + '" placeholder="' + esc(t('cert_ph_school')) + '" list="ct_schools" id="ct_school"><datalist id="ct_schools"></datalist></label>' +
      '<label class="fld"><span>' + t('cert_date') + '</span><input type="date" data-input="ct_f" data-k="date" value="' + esc(c.date) + '" max="' + today() + '"></label>' +
      '<p class="hint">' + t('cert_priv') + '</p></form>' +
      '<div class="card print-help"><h2>' + t('cert_print_t') + '</h2><ol class="ticks num"><li>' + t('cert_p1') + '</li><li>' + t('cert_p2') + '</li><li>' + t('cert_p3') + '</li><li>' + t('cert_p4') + '</li></ol>' +
      '<p class="cta-row"><button class="btn btn-lg" data-act="ct_print" data-v="both">' + t('cert_print') + '</button>' + (App.shareButtons ? App.shareButtons('cert') : '') + '</p>' +
      '<p class="hint">' + t('cert_single') + '</p><p class="cta-row"><button class="btn btn-ghost sm" data-act="ct_print" data-v="front">' + t('cert_only_f') + '</button><button class="btn btn-ghost sm" data-act="ct_print" data-v="back">' + t('cert_only_b') + '</button></p></div></div>' +
      '<h2 class="sec-t">' + t('cert_preview') + '</h2></div>' +
      '<div class="sheets-wrap"><div class="sheet-box"><div class="sheet-lbl no-print">' + t('cert_front') + '</div><div id="ct_front">' + front(c, R) + '</div></div>' +
      '<div class="sheet-box"><div class="sheet-lbl no-print">' + t('cert_back') + '</div><div id="ct_back">' + back(c, R) + '</div></div></div>';
    return html;
  };

  function scale() {
    var w = document.documentElement.clientWidth - 32, s = Math.min(1, w / 793.7);
    document.documentElement.style.setProperty('--sc', s.toFixed(4));
  }
  App.after = App.after || {};
  App.after.certificate = function () { scale(); fitBack(); };
  App.certSheets = function (c, R) { return [front(c, R), back(c, R)]; };   // used by the class session to print every report card
  /* long career texts: shrink the career list just enough that the back page stays on one A4 sheet */
  function fitBack() {
    var inner = document.querySelector('#ct_back .inner'), ul = inner && inner.querySelector('.cl2'), z = 1;
    if (!ul) return;
    ul.style.zoom = '';
    while (inner.scrollHeight > inner.clientHeight + 1 && z > 0.8) { z -= 0.02; ul.style.zoom = z.toFixed(2); }
  }
  window.addEventListener('resize', scale);

  function redraw() {
    var R = App.report(), c = F.cert, f = document.getElementById('ct_front'), b = document.getElementById('ct_back');
    if (R && f && b) { f.innerHTML = front(c, R); b.innerHTML = back(c, R); fitBack(); }
  }
  AC.ct_f = function (el) {
    var k = el.getAttribute('data-k'); F.cert[k] = el.value; if (k === 'cls') F.cert.clsSet = true;
    if (k === 'school' && API.online && el.value.trim().length >= 3) {
      clearTimeout(timer);
      timer = setTimeout(function () {
        API.get('api/schools?' + API.qs({ q: el.value.trim(), limit: 8 })).then(function (d) {
          var dl = document.getElementById('ct_schools'); if (dl) dl.innerHTML = d.items.map(function (s) { return '<option value="' + esc(s.name + ', ' + s.district) + '">'; }).join('');
        }).catch(function () {});
      }, 300);
    }
    redraw();
  };
  AC.ct_print = function (el) {
    var which = el.getAttribute('data-v'), c = F.cert;
    if (!c.name.trim()) { var n = document.getElementById('ct_name'); if (n) { n.focus(); n.classList.add('bad'); } return; }
    if (App.journey) App.journey.cert();
    var cls = which === 'front' ? 'print-front' : which === 'back' ? 'print-back' : '';
    if (cls) document.body.classList.add(cls);
    document.body.classList.add('printing-cert');
    setTimeout(function () { window.print(); }, 50);
    var clean = function () { document.body.classList.remove('print-front', 'print-back', 'printing-cert'); window.removeEventListener('afterprint', clean); };
    window.addEventListener('afterprint', clean);
  };
})();

  function suggested() {                                  // careers from the assessment, best first

        '<div class="jr-bar" role="progressbar" aria-valuenow="' + n + '" aria-valuemin="0" aria-valuemax="5"><i style="width:' + (n / 5 * 100) + '%"></i></div><ol class="jr">' +
        st.map(function (x, i) { return '<li class="' + (x[1] ? 'done' : i === next ? 'next' : '') + '"><a href="' + x[0] + '"><span class="jr-n">' + (x[1] ? '✓' : i + 1) + '</span><span>' + t('jr_' + (i + 1)) + '</span></a></li>'; }).join('') + '</ol>' +

        var st = status(s), pct = st === 'part' && s.A ? Math.round((s.A.i || 0) / 54 * 100) : 0;
        var label = st === 'done' ? t('cl_st_done') : st === 'part' ? t('cl_st_part') + (pct ? ' · ' + pct + '%' : '') : t('cl_st_none');
        return '<tr><td>' + esc(s.roll || '—') + '</td><td><b>' + esc(s.name) + '</b></td><td><span class="st ' + st + '">' + (st === 'done' ? icon('check') : '') + label + '</span></td>' +
          '<td class="act"><button class="btn sm" data-act="cl_go" data-v="' + s.id + '">' + (st === 'done' ? t('cl_view') : st === 'part' ? t('cl_cont') : t('cl_go')) + '</button> ' +
          '<button class="btn btn-ghost sm" data-act="cl_rm" data-v="' + s.id + '" aria-label="' + esc(t('cl_remove') + ': ' + s.name) + '">' + t('cl_remove') + '</button></td></tr>';
      }).join('') + '</tbody></table>';
  }
  function howTo() {
    return '<h2>' + t('cl_how') + '</h2><ol class="plan-steps">' + [1, 2, 3, 4].map(function (i) { return '<li><div><b>' + t('cl_h' + i) + '</b><p>' + t('cl_h' + i + 'd') + '</p></div></li>'; }).join('') + '</ol>' +
      '<div class="notice priv">' + t('cl_priv') + '</div>';
  }
  V.class = function (args) {
    if (args && args[0] === 'print') return printView();
    if (C && C.active) park();
    var html = '<section class="page-hero"><div class="wrap">' + crumb(t('cl_title')) + '<h1>' + t('cl_title') + '</h1><p class="lead">' + t('cl_lead') + '</p></div></section><div class="wrap section">';
    if (!C || editing) return html + '<div class="two-col">' + setupForm() + '<div>' + howTo() + '</div></div></div>';
    var done = C.students.filter(function (s) { return status(s) === 'done'; }).length, part = C.students.filter(function (s) { return status(s) === 'part'; }).length;
    html += '<div class="sec-head"><h2 class="sec-t">' + esc(C.school) + ' · ' + clsLabel() + '</h2><button class="linkbtn no-print" data-act="cl_edit">' + t('cl_edit') + '</button></div>' +
      '<p class="stat-line">' + (C.teacher ? '<span>' + esc(C.teacher) + '</span>' : '') + '<span>' + t('cl_students') + ': <b>' + C.students.length + '</b></span><span>' + t('cl_done') + ': <b>' + done + '</b></span><span>' + t('cl_prog') + ': <b>' + part + '</b></span></p>' +
      '<form class="card no-print" onsubmit="return false" style="margin-bottom:1.5rem"><h3>' + t('cl_add') + '</h3><div class="add-row">' +
      '<label class="fld"><span>' + t('cl_name') + '</span><input id="cl_name" maxlength="60" autocomplete="off"></label>' +
      '<label class="fld"><span>' + t('cl_roll') + '</span><input id="cl_roll" maxlength="10" inputmode="numeric" autocomplete="off"></label>' +
      '<button class="btn" data-act="cl_add">' + icon('plus') + t('cl_add_btn') + '</button></div><p class="form-msg" role="alert">' + (msg || '') + '</p></form>' +
      roster() +
      '<p class="cta-row no-print"><a class="btn btn-lg" href="#/class/print"' + (done ? '' : ' aria-disabled="true" data-act="cl_none"') + '>' + icon('print') + t('cl_print_all') + (done ? ' (' + done + ')' : '') + '</a>' +
      '<button class="btn btn-ghost btn-lg" data-act="print">' + t('cl_print_list') + '</button></p>' +
      '<div class="two-col no-print" style="margin-top:2.5rem"><div>' + howTo() + '</div><div><h2>' + t('cl_end') + '</h2><p class="muted">' + t('cl_end_q') + '</p><button class="btn btn-ghost warn-btn" data-act="cl_end">' + icon('trash') + t('cl_end') + '</button></div></div>';
    return html + '</div>';
  };
  AC.cl_none = function (el, e) { e.preventDefault(); msg = t('cl_pr_none'); App.rerender(true); };
  AC.cl_add = function () {
    var n = document.getElementById('cl_name'), r = document.getElementById('cl_roll');
    if (!n.value.trim()) { msg = t('cl_need_name'); App.rerender(true); var f = document.getElementById('cl_name'); f.focus(); f.classList.add('bad'); return; }
    C.students.push({ id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: n.value.trim(), roll: r.value.trim(), A: null });
    msg = ''; save(); App.rerender(true);
    var f2 = document.getElementById('cl_name'); if (f2) f2.focus();
  };
  document.addEventListener('keydown', function (e) {           // Enter in the name / roll field adds the student
    if (e.key === 'Enter' && e.target && (e.target.id === 'cl_name' || e.target.id === 'cl_roll')) { e.preventDefault(); AC.cl_add(); }
  });
  AC.cl_rm = function (el) {
    var s = byStu(el.getAttribute('data-v')); if (!s) return;
    if (!window.confirm(t('cl_remove_q').replace('{name}', s.name))) return;
    C.students = C.students.filter(function (x) { return x !== s; }); save(); App.rerender(true);
  };
  AC.cl_go = function (el) {
    var s = byStu(el.getAttribute('data-v')); if (!s) return;
    park();
    App.loadA(s.A);
    if (!s.A) { App.A.profile.cls = C.cls; }
    App.f.cert = certFor(s);
    C.active = s.id; save();
    App.go(status(s) === 'done' ? 'results' : 'assess');
  };
  AC.cl_back = function () { park(); App.go('class'); };
  AC.cl_end = function () {
    if (!window.confirm(t('cl_end_q'))) return;
    park(); C = null; save(); App.rerender(); window.scrollTo(0, 0);
  };

  /* every completed student: certificate (front) + profile (back), page after page */
  function printView() {
    if (C && C.active) park();
    var html = '<section class="page-hero no-print"><div class="wrap">' + crumb(t('cl_pr_title'), ['#/class', t('cl_title')]) + '<h1>' + t('cl_pr_title') + '</h1><p class="lead">' + t('cl_pr_lead') + '</p></div></section>';
    var list = C ? C.students.filter(function (s) { return status(s) === 'done'; }) : [];
    if (!list.length) return html + '<div class="wrap section no-print"><p>' + t('cl_pr_none') + '</p><a class="btn" href="#/class">' + t('cl_back_list') + '</a></div>';
    list.sort(function (a, b) { return (parseInt(a.roll, 10) || 1e9) - (parseInt(b.roll, 10) || 1e9) || a.name.localeCompare(b.name); });
    var sheets = '', keep = App.snapA();
    list.forEach(function (s) {
      App.loadA(s.A);
      var R = App.report(); if (!R) return;
      var pg = App.certSheets(certFor(s), R);
      sheets += '<div class="sheet-box"><div class="sheet-lbl no-print">' + esc(s.name) + (s.roll ? ' · ' + esc(s.roll) : '') + ' — ' + t('cert_front') + '</div><div>' + pg[0] + '</div></div>' +
        '<div class="sheet-box"><div class="sheet-lbl no-print">' + esc(s.name) + ' — ' + t('cert_back') + '</div><div>' + pg[1] + '</div></div>';
    });
    App.loadA(keep.step === 'intro' ? null : keep);
    return html + '<div class="wrap section no-print cert-ui"><p class="cta-row"><button class="btn btn-lg" data-act="cl_print">' + icon('print') + t('cl_pr_btn').replace('{n}', list.length) + '</button><a class="btn btn-ghost btn-lg" href="#/class">' + t('cl_back_list') + '</a></p><p class="hint">' + t('cert_p2') + '</p></div>' +
      '<div class="sheets-wrap">' + sheets + '</div>';
  }
  App.after = App.after || {};
  App.after.class = function () {
    var w = document.documentElement.clientWidth - 32; document.documentElement.style.setProperty('--sc', Math.min(1, w / 793.7).toFixed(4));
    Array.prototype.forEach.call(document.querySelectorAll('.sheet.back .inner'), function (inner) {
      var ul = inner.querySelector('.cl2'), z = 1; if (!ul) return;
      while (inner.scrollHeight > inner.clientHeight + 1 && z > 0.8) { z -= 0.02; ul.style.zoom = z.toFixed(2); }
    });
  };
  AC.cl_print = function () {
    document.body.classList.add('printing-cert');
    var clean = function () { document.body.classList.remove('printing-cert'); window.removeEventListener('afterprint', clean); };
    window.addEventListener('afterprint', clean);
    setTimeout(function () { window.print(); }, 50);
  };

  /* while a student is taking the assessment, a bar under the header says whose turn it is */
  var chrome = App.chrome;
  App.chrome = function (active) {
    chrome(active);
    var s = App.classActive();
    if (!s || active === 'class') return;
    document.getElementById('main').insertAdjacentHTML('afterbegin', '<div class="cls-bar"><div class="wrap cls-bar-in"><span><b>' + t('cl_now') + '</b> · ' + esc(C.school) + ' · ' + clsLabel() + ' · ' + t('cl_taking') + ' <b>' + esc(s.name) + '</b>' + (s.roll ? ' (' + esc(s.roll) + ')' : '') + '</span>' +
      '<button class="btn btn-ghost" data-act="cl_back">' + icon('back') + t('cl_back') + '</button></div></div>');
  };
})();

</script>
</body>
</html>
