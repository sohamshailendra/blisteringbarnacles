<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free bilingual career guidance for Class 10 and 12 students — assessment, career tree, courses, colleges, scholarships and official links.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mera Bhavishya">
  <title>Mera Bhavishya – Mera Nirnay • Career Guidance Portal</title>

  <!-- Fonts: Devanagari + Latin. For a NIC server without internet access, download these
       fonts and host them locally (see README → "Fonts"). The site still works without them. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   STYLES — organised top to bottom:
   1 tokens  2 base  3 header/footer  4 buttons & chips  5 hero  6 cards & grids
   7 forms/filters  8 tree  9 assessment  10 results  11 tables  12 misc  13 responsive  14 print
   ===================================================================== */
/* 1 ── design tokens. Page (home) and app screens share one face and one palette:
   ink on white / pale blue-grey, one blue for the action and the main data element, no colour in the chrome. ── */
:root{
  --fs:1;
  --ink:#111; --mut:#5f6368; --soft:#8a8f98; --line:#e3e5e8; --line-2:#c9ccd1;
  --bg:#fff; --ground:#f2f4f7; --tint:#f2f4f7; --tint-2:#e8ebef; --card:#fff; --pill:#e6e7e9; --pill-h:#dadcdf; --active:#e6e8ec;
  --acc:#1a4be0; --acc-d:#1239b3; --acc-t:#e8eefd;
  --pri:#111; --pri-d:#000; --pri-t:var(--acc-t);
  --focus:#1a4be0;
  --ok:#137333; --ok-t:#e6f4ea; --warn:#8a5a00; --warn-t:#fdf3dc; --err:#c5221f; --err-t:#fce8e6;
  /* names older views and data still use */
  --navy:var(--ink); --navy2:var(--ink); --amber:var(--acc); --amber-d:var(--acc); --amber-l:var(--acc-t);
  --blue:#2457a6; --teal:#0f766e; --orange:#b45309; --magenta:#9d2b6b; --green:var(--ok); --red:var(--err); --road:var(--acc); --road-d:var(--acc-d);
  --r:8px; --r-s:6px; --sh:none;
  --head:'Anek Devanagari','Noto Sans Devanagari','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Anek Devanagari','Noto Sans Devanagari','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --side:248px;
  --s-small:clamp(.875rem,.85rem + .1vw,.9375rem);
  --s-body:clamp(1.0625rem,1rem + .25vw,1.1875rem);
  --s-lead:clamp(1.25rem,1.1rem + .7vw,1.625rem);
  --s-head:clamp(2rem,1.3rem + 3.2vw,4rem);
}
/* 2 ── base ── */
*{box-sizing:border-box}
html{font-size:calc(100% * var(--fs));scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:var(--s-body);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variation-settings:'wdth' 100}
body.is-app{background:var(--ground)}
body.is-app h1{font-size:clamp(1.6rem,1.3rem + .9vw,2rem)}
h1,h2,h3,h4{font-family:var(--head);line-height:1.12;margin:0 0 .6rem;color:var(--ink);font-weight:600;text-wrap:balance}
h1{font-size:clamp(1.9rem,1.4rem + 1.6vw,2.5rem)} h2{font-size:clamp(1.4rem,1.2rem + .8vw,1.75rem)} h3{font-size:1.1875rem} h4{font-size:1.0625rem}
html[lang=en] h1,html[lang=en] h2{letter-spacing:-.02em}
p{margin:0 0 .9rem} img{max-width:100%;display:block}
a{color:var(--acc);text-underline-offset:.2em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{accent-color:var(--ink)}
.wrap{width:min(1180px,100% - 3rem);margin-inline:auto}
.section{padding:2.5rem 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:.7rem 1rem;z-index:100;font-weight:600}
.skip:focus{left:0}
.muted{color:var(--mut)} .center{text-align:center} .hint{font-size:var(--s-small);color:var(--mut)} .note{font-size:var(--s-small);color:var(--mut);margin-top:.9rem}
main:focus{outline:none}
.ico-tile,.ico,.ci,.cmp-ico,.facts .fi,.big-ico,.root-node>span:first-child,.face .em,.gate .ico-tile{display:none!important}
svg.i{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 3 ── chrome: home has a top line; app screens have a sidebar (a 52px bar on phones); one full-screen menu for both ── */
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);min-width:0}
.brand:hover{color:var(--ink)}
.brand img{height:40px;width:auto;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-t b{font-size:1rem;font-weight:600}
.brand-t small{color:var(--mut);font-size:.875rem}
.lang{display:inline-flex;background:var(--pill);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;border-radius:999px;padding:.3rem .8rem;font-weight:500;font-size:1rem;cursor:pointer;color:var(--mut);min-height:34px;transition:background-color .16s var(--ease),color .16s var(--ease)}
.lang button.on{background:#fff;color:var(--ink)}
.chip-btn{border:0;background:transparent;color:var(--ink);border-radius:999px;min-height:34px;min-width:34px;padding:.1rem .55rem;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;transition:background-color .16s var(--ease)}
.chip-btn:hover{background:var(--pill)}
.chip-btn.listen[aria-pressed="true"]{background:var(--ink);color:#fff}
.menu-btn{display:inline-flex;align-items:center;gap:.45rem;border:0;background:var(--pill);border-radius:999px;min-height:40px;padding:0 1rem;font-weight:600;cursor:pointer;transition:background-color .16s var(--ease),transform .12s var(--ease)}
.menu-btn:hover{background:var(--pill-h)}.menu-btn:active{transform:scale(.97)}
.menu-btn i{display:grid;gap:4px}.menu-btn i b{display:block;width:16px;height:2px;background:currentColor;border-radius:1px}
/* home top line */
.topline{display:flex;align-items:center;gap:1.5rem;padding:1.1rem 0}
.topline nav{display:flex;gap:1.6rem;margin-left:auto}
.topline nav a{color:var(--ink);text-decoration:none;font-size:1rem;font-weight:500}
.topline nav a:hover{color:var(--acc)}
.topline .lang{margin-left:.5rem}
/* app sidebar */
.side{display:flex;flex-direction:column;gap:1.4rem;padding:1.4rem 1rem 1.2rem;min-height:100%}
.side .brand{padding:0 .4rem}
.side .lang{align-self:flex-start;margin-left:.4rem}
.navg{display:grid;gap:2px}
.navg>span{font-size:.875rem;color:var(--mut);padding:0 .75rem .3rem;font-weight:500}
.navg a{display:flex;align-items:center;min-height:34px;padding:0 .75rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9375rem;transition:background-color .14s var(--ease)}
.navg a:hover{background:rgba(17,17,17,.05)}
.navg a.on{background:var(--active);font-weight:600}
.side-tools{margin-top:auto;display:flex;gap:.2rem;flex-wrap:wrap;padding:.8rem .4rem 0}
.appbar{display:none}
@media (min-width:1024px){
  body.is-app #hdr{position:fixed;inset:0 auto 0 0;width:var(--side);overflow-y:auto;overscroll-behavior:contain;background:var(--ground);z-index:40}
  body.is-app main,body.is-app .site-footer{margin-left:var(--side)}
  body.is-app .wrap{width:min(1120px,100% - 4rem)}
}
@media (max-width:1023px){
  body.is-app .side{display:none}
  body.is-app .appbar{display:flex;align-items:center;gap:.6rem;height:56px;padding:0 1rem;position:sticky;top:0;z-index:40;background:rgba(242,244,247,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
  body.is-app .appbar .brand{flex:1}
  body.is-app .appbar .brand img{height:32px}
}
/* full-screen menu */
.navsheet{position:fixed;inset:0;z-index:90;background:#fff;overflow-y:auto;overscroll-behavior:contain;display:none;padding:1rem 1.25rem 2rem}
.navsheet.open{display:block;animation:sheetin .22s var(--ease)}
@keyframes sheetin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.navsheet-top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.navsheet-top .brand{flex:1}
.navsheet .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.6rem 2rem;max-width:1120px;margin:0 auto}
.navsheet .navg a{font-size:1.0625rem;min-height:44px}
.navsheet .side-tools{max-width:1120px;margin:2rem auto 0;padding:0}
body.sheet-open{overflow:hidden}
/* footer */
.site-footer{color:var(--ink);margin-top:4rem}
.foot{display:grid;grid-template-columns:1.2fr 1fr 1.6fr;gap:2rem;font-size:1rem;padding-top:2.5rem}.foot p{max-width:52ch}
.foot b{font-weight:600}.foot p{margin:.4rem 0 0;color:var(--mut)}
.foot-b{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2rem;padding:1.2rem 0 1.6rem;font-size:.875rem;flex-wrap:wrap;color:var(--mut)}
.foot-nav{display:flex;gap:1.4rem;flex-wrap:wrap}.foot-b>span:first-child{max-width:60ch}.foot-nav a{color:inherit}
.install-btn{margin:0;color:inherit;font-weight:600;text-decoration:underline;min-height:32px}
.foot-name{display:none}
body:not(.is-app) .site-footer{background:var(--ink);color:#fff;margin-top:0;min-height:80svh;display:flex;flex-direction:column}
body:not(.is-app) .site-footer a,body:not(.is-app) .site-footer a:hover{color:#fff}body:not(.is-app) .site-footer a:hover{text-decoration-thickness:2px}
body:not(.is-app) .foot p,body:not(.is-app) .foot-b{color:#d4d6da}
body:not(.is-app) .foot-name{display:block;margin-top:auto;padding-top:4rem;font-family:var(--head);font-weight:600;font-size:clamp(2.6rem,1rem + 6.6vw,7.5rem);line-height:.98;color:#fff}
html[lang=en] body:not(.is-app) .foot-name{letter-spacing:-.04em}
/* 4 ── buttons, chips, tags ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--pri);color:#fff;border:0;min-height:44px;padding:.5rem 1.25rem;border-radius:999px;font-weight:600;line-height:1.25;text-decoration:none;cursor:pointer;transition:background-color .16s var(--ease),transform .12s var(--ease);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:hover{background:#2b2b2b;color:#fff}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.4;cursor:not-allowed;transform:none}
.btn-lg{min-height:52px;padding:.7rem 1.6rem;font-size:1.0625rem}
.btn.sm{min-height:36px;padding:.3rem .9rem;font-size:.9375rem}
.btn.block{display:flex;width:100%;margin-bottom:.5rem;justify-content:flex-start}
.btn-ghost,.btn-light,.btn-ghost-light{background:var(--pill);color:var(--ink)}
.btn-ghost:hover,.btn-light:hover,.btn-ghost-light:hover{background:var(--pill-h);color:var(--ink)}
.btn.acc{background:var(--acc)}.btn.acc:hover{background:var(--acc-d)}
.btn.warn-btn{color:var(--err)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:.2em;cursor:pointer;margin-top:.8rem;padding:0}
.cta-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1.5rem}.cta-row.between{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:.35rem .9rem;min-height:38px;font-size:.9375rem;cursor:pointer;color:var(--ink);transition:background-color .14s var(--ease),border-color .14s var(--ease),transform .12s var(--ease)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip:active{transform:scale(.97)}
.tag,.badge{display:inline-block;font-size:.8125rem;font-weight:600;border-radius:999px;padding:.1rem .6rem}
.tag{background:var(--pill);color:var(--ink)}.badge{background:var(--ok-t);color:var(--ok)}
.mini{display:inline-block;background:var(--tint);color:var(--mut);border-radius:999px;padding:.05rem .6rem;font-size:.8125rem;font-weight:500}
.mini.ok{background:var(--ok-t);color:var(--ok)}.mini.new,.mini.lv{background:var(--acc-t);color:var(--acc-d)}
.minis{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.cdot{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:6px;color:#fff;font-size:.8125rem;font-weight:700;margin-right:.2rem}.codes{margin-top:.6rem}.codes.lg .cdot{width:2.4rem;height:2.4rem;font-size:1.1rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{background:var(--pill);border-radius:999px;padding:.4rem .9rem;text-decoration:none;color:var(--ink);font-weight:500;font-size:.9375rem;transition:background-color .14s var(--ease)}
.pill:hover{background:var(--pill-h);color:var(--ink)}
.lnk{font-weight:500;word-break:break-word}
/* 5 ── app page header ── */
.page-hero{padding:2.4rem 0 1.4rem}
.page-hero h1{max-width:24ch}
.page-hero .lead{margin:0}
.page-hero.slim{padding:1.8rem 0 1rem}
.lead{font-size:var(--s-lead);max-width:52ch;color:var(--mut);line-height:1.35}
.page-hero .lead{font-size:1.125rem;line-height:1.45}
.crumbs{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.875rem;margin:0 0 .9rem;color:var(--mut)}
.crumbs a{color:var(--mut);text-decoration:none}.crumbs a:hover{color:var(--ink)}
.crumbs span[aria-hidden]{color:var(--soft)}.crumbs b{font-weight:500;color:var(--ink)}
.step-of{display:block;font-size:.9375rem;color:var(--mut);margin:0 0 .3rem}
.code-line{display:flex;align-items:center;gap:.5rem;margin-top:1rem;font-weight:500;flex-wrap:wrap}
.code-line b{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:8px;font-size:1.3rem;color:#fff}
.career-hero .ch{display:flex;gap:1.2rem;align-items:center;margin-top:.4rem}
.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.8rem;font-weight:500;color:var(--mut);text-decoration:none}
.band{background:var(--tint)}
/* 6 ── home (page) ── */
.hero2{min-height:calc(100svh - 76px);display:flex;flex-direction:column;justify-content:center;gap:clamp(2rem,6vh,4.5rem);padding:2rem 0 2.5rem}
.name{font-family:var(--head);font-weight:600;font-size:clamp(3.4rem,1rem + 7.6vw,8.75rem);line-height:.95;margin:0;color:var(--ink);text-align:left}
html[lang=en] .name{letter-spacing:-.045em}
.name .l{display:flex;align-items:baseline;gap:0 .2em}
.name .slot{display:inline-block;flex:none;width:2.1em;height:.72em;border-radius:.1em;overflow:hidden;align-self:baseline;position:relative;top:.02em;background:var(--tint)}
.name .slot img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.name .sub{display:block;font-size:var(--s-lead);font-weight:500;letter-spacing:0;color:var(--mut);line-height:1.3;margin-top:.7rem;max-width:34ch}
.hero2-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem 3rem;align-items:end}
.hero2-foot p{margin:0;max-width:46ch;font-size:var(--s-body);color:var(--ink)}
.hero2 .lead{max-width:44ch;color:var(--ink)}
.class-pick{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1rem;font-weight:500}
.class-pick a{display:inline-flex;align-items:center;min-height:40px;padding:0 1rem;border-radius:999px;background:var(--pill);color:var(--ink);text-decoration:none;transition:background-color .14s var(--ease),transform .12s var(--ease)}
.class-pick a:hover{background:var(--pill-h)}.class-pick a:active{transform:scale(.97)}
.resume{background:var(--tint);border-radius:var(--r);padding:1.2rem 1.4rem;max-width:560px}
.resume h2{font-size:1.1875rem;margin:0 0 .4rem}
.match{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.55rem 0;text-decoration:none;color:var(--ink)}
.match b{font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:.2em}
.match small{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.match:hover b{text-decoration-color:var(--ink)}
.side-h{font-weight:600}
.wb-code{display:flex;align-items:center;gap:.3rem;margin:0 0 .6rem;font-size:.9375rem;flex-wrap:wrap}.wb-code b{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:6px;color:#fff;font-size:.8125rem}
.hsec{padding:clamp(4rem,9vh,7rem) 0}
.stairs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(2.2rem,5vh,3.5rem) 1rem;margin:0;padding:0;list-style:none}
.stairs li{grid-column:var(--c) / span 7}
.stairs li:nth-child(1){--c:1}.stairs li:nth-child(2){--c:3}.stairs li:nth-child(3){--c:5}.stairs li:nth-child(4){--c:6}
.stairs h2,.stairs b{display:block;font-family:var(--head);font-weight:600;font-size:clamp(2rem,1rem + 3.3vw,4.6rem);line-height:1;margin:0;color:var(--ink)}
html[lang=en] .stairs h2,html[lang=en] .stairs b{letter-spacing:-.035em}
.stairs li:last-child b{color:var(--acc)}
.stairs p{margin:.75rem 0 0;max-width:36ch;color:var(--ink)}
.rows-sec .axis{padding-left:calc((100% + 1rem) / 12 * 2)}
.rows-sec .statement{display:flex;align-items:center;margin:0 0 3.5rem}
.rows-sec .statement h2{font-size:var(--s-head);line-height:1;max-width:12ch;margin:0}
html[lang=en] .rows-sec .statement h2{letter-spacing:-.035em}
.frow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:start;margin-top:clamp(4rem,9vh,7rem)}
.frow2:nth-child(2){margin-top:0}
.frow2 h3{font-size:clamp(1.6rem,1rem + 1.8vw,2.75rem);line-height:1.05;margin:0 0 .7rem}
html[lang=en] .frow2 h3{letter-spacing:-.025em}
.frow2 h3 a{color:var(--ink);text-decoration:none}
.frow2 h3 a:hover{color:var(--acc)}
.frow2 p{max-width:36ch;color:var(--ink);margin:0 0 .9rem}
.frow2 .go{font-weight:600}
.frow2 figure{margin:0}
.frow2 img{object-fit:cover;border-radius:4px;background:var(--tint)}
.frow2:nth-child(2) img{width:240px;aspect-ratio:4/5}.frow2:nth-child(3) img{width:320px;aspect-ratio:3/2}.frow2:nth-child(4) img{width:180px;aspect-ratio:1}.frow2:nth-child(5) img{width:280px;aspect-ratio:4/5}
.more-tools{margin-top:clamp(4rem,9vh,7rem);display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.more-tools span{color:var(--mut);margin-right:.6rem}
.tbl-sec h2{font-size:var(--s-head);line-height:1;margin:0 0 clamp(3rem,8vh,6rem);max-width:14ch;padding-left:3vw}
html[lang=en] .tbl-sec h2{letter-spacing:-.035em}
.tbl-sec .tgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 1rem}
.tbl-sec .tpic{grid-column:1 / span 4;grid-row:1 / span 2;align-self:end;margin:0}.tbl-sec .tpic img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px}
.tbl-sec .tname{grid-column:7 / span 1;grid-row:1;font-size:.875rem;color:var(--mut);padding-top:.15rem}
.tbl-sec ol{grid-column:8 / span 5;grid-row:1;list-style:none;margin:0;padding:0}
.tbl-sec li{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:1rem;padding:.6rem 0;align-items:baseline;font-size:1rem}
.tbl-sec li:nth-child(4n+1):not(:first-child){margin-top:1.4rem}
.tbl-sec li span{color:var(--mut);font-variant-numeric:tabular-nums}.tbl-sec li em{font-style:normal;color:var(--mut);text-align:right;white-space:nowrap}
.tbl-sec .tfoot{grid-column:8 / span 5;grid-row:2;margin-top:1.4rem}

  detail:{en:['In Hindi, a polytechnic is called a ‘multi-technical institute’ (बहु-तकनीकी संस्थान). It gives a 3-year technical diploma after Class 10 and is a road to an early technical job.', 'In Haryana, admission to polytechnics is through HSTES online counselling. Seats are filled on the merit of Class 10 marks.', 'Haryana has a government polytechnic in most districts, such as Guru Brahmanand Ji Govt Polytechnic, Nilokheri (Karnal), Govt Polytechnic Ambala City and Kalpana Chawla Govt Women’s Polytechnic, Ambala. There are also society-mode, aided and private polytechnics, and new-age diplomas (AI, EV, solar, cyber security) at some institutes.', 'Low marks in Class 10 do not end your chances. Strong careers are built through ITI, polytechnic and skill courses. You can also do a diploma after 10+2, and a degree after the diploma.'], hi:['Polytechnic को हिंदी में बहु-तकनीकी संस्थान कहते हैं। यह 10वीं के बाद 3 वर्ष का तकनीकी डिप्लोमा है — जल्दी तकनीकी नौकरी का रास्ता।', 'हरियाणा में पॉलिटेक्निक में दाख़िले HSTES की ऑनलाइन काउंसलिंग से होते हैं। दाख़िला 10वीं के अंकों की मेरिट से होता है।', 'हरियाणा के अधिकांश ज़िलों में राजकीय पॉलिटेक्निक हैं — जैसे गुरु ब्रह्मानंद जी राजकीय पॉलिटेक्निक नीलोखेड़ी (करनाल), राजकीय पॉलिटेक्निक अंबाला शहर व कल्पना चावला राजकीय महिला पॉलिटेक्निक, अंबाला। राज्य भर में सोसाइटी-मोड, सहायता-प्राप्त व निजी पॉलिटेक्निक भी हैं, और कुछ संस्थानों में नए ज़माने के डिप्लोमा (AI, EV, सोलर, साइबर सुरक्षा) भी।', '10वीं में अंक कम आए तो सब ख़त्म नहीं — ITI/पॉलिटेक्निक/कौशल-कोर्स से मज़बूत करियर बनते हैं। 10+2 के बाद भी डिप्लोमा किया जा सकता है, और डिप्लोमा के बाद भी डिग्री।']},

  after:{en:['Lateral entry (LEET) into the 2nd year of B.Tech', 'JE recruitment exams (SSC-JE, Railways, power corporations, HSSC)', 'Apprenticeship through apprenticeshipindia.gov.in', 'Haryana CET for Group C/D posts (minimum Class 10/12)'], hi:['B.Tech द्वितीय वर्ष में लेटरल एंट्री (LEET)', 'JE भर्ती परीक्षाएँ (SSC-JE, रेलवे, बिजली निगम, HSSC)', 'अप्रेंटिसशिप — apprenticeshipindia.gov.in', 'ग्रुप C/D पदों हेतु हरियाणा CET (न्यूनतम 10वीं/12वीं)']},
  tips:{en:['Do not worry about fees: govt polytechnic fees are low, and scholarships are available for SC/BC and meritorious students.', 'SC/BC and eligible students can apply for the Haryana Post-Matric Scholarship on saralharyana.gov.in.', 'Girls in technical diploma courses can get the AICTE Pragati scholarship (aicte-india.org). Haryana has women’s polytechnics in Ambala, Sirsa, Faridabad, Loharu and Morni.', 'Divyang students get 5% reserved seats in higher education. Make your UDID card early (swavlambancard.gov.in).', 'Anyone asking for money in the name of a scholarship is a fraud. Govt portals charge no fee.', 'The institute list is indicative and can change. Check the official list, trades and seats for the current session on hstes.org.in and techeduhry.gov.in.'], hi:['फ़ीस चिंता नहीं: सरकारी पॉलिटेक्निक की फ़ीस कम है; SC/BC व मेधावी विद्यार्थियों के लिए छात्रवृत्तियाँ उपलब्ध हैं।', 'SC/BC व पात्र वर्गों के विद्यार्थी हरियाणा पोस्ट-मैट्रिक छात्रवृत्ति के लिए saralharyana.gov.in पर आवेदन करें।', 'तकनीकी डिप्लोमा की छात्राओं के लिए AICTE प्रगति छात्रवृत्ति (aicte-india.org)। अंबाला, सिरसा, फ़रीदाबाद, लोहारू व मोरनी में राजकीय महिला पॉलिटेक्निक हैं।', 'दिव्यांग विद्यार्थियों के लिए उच्च शिक्षा में 5% आरक्षित सीटें — UDID कार्ड समय से बनवाएँ (swavlambancard.gov.in)।', 'छात्रवृत्ति के नाम पर पैसे माँगने वाला हर व्यक्ति/वेबसाइट फ़र्ज़ी है — सरकारी पोर्टल कोई शुल्क नहीं लेते।', 'संस्थान-सूची सांकेतिक है और बदल सकती है — चालू सत्र की आधिकारिक सूची, ट्रेड, सीटें व दाख़िला hstes.org.in व techeduhry.gov.in पर देखें।']},

  detail:{en:['ITI means Industrial Training Institute — a school for hands-on skills. Trades last 6 months to 2 years after Class 8 or 10, and you get a national certificate (NCVT/SCVT) with the training.', 'In Haryana, admission is online on itiharyana.gov.in. Which trades are offered changes from institute to institute, so check the list on the portal.', 'Almost every district in Haryana has a govt ITI and a separate women’s ITI, and many have several (one district alone can have six or seven). You can also take admission in a neighbouring district’s ITI, as per your trade.', '‘Skill is wealth that no one can steal.’ Low marks in Class 10 are not the end — ITI builds strong careers.'], hi:['ITI = औद्योगिक प्रशिक्षण संस्थान — हाथ के हुनर की पाठशाला। 8वीं/10वीं के बाद 6 माह से 2 वर्ष के ट्रेड; प्रशिक्षण के साथ राष्ट्रीय प्रमाणपत्र (NCVT/SCVT)।', 'हरियाणा में दाख़िले ऑनलाइन: itiharyana.gov.in। ट्रेड-उपलब्धता संस्थान-अनुसार बदलती है — पोर्टल पर सूची देखें।', 'हरियाणा के लगभग हर ज़िले में राजकीय ITI व छात्राओं हेतु अलग महिला ITI है, और कई ज़िलों में एक से अधिक (किसी-किसी ज़िले में छह-सात तक)। पड़ोसी ज़िले की ITI में भी ट्रेड के अनुसार दाख़िला लिया जा सकता है।', '“हुनर वह पूँजी है जिसे कोई चुरा नहीं सकता।” 10वीं में अंक कम आए तो भी सब ख़त्म नहीं — ITI से मज़बूत करियर बनते हैं।']},

  work:{en:['Apprentice in Railways, HAL, power corporations, factories', 'Railway technician / ALP and Group-D posts', 'Army Agniveer (Technical / Tradesman)', 'Haryana CET Group C/D posts', 'Electrician / EV mechanic / solar technician — immediate employment', 'Drone repair technician and assembly', 'Own shop or workshop'], hi:['अप्रेंटिसशिप (रेलवे, HAL, बिजली निगम, फ़ैक्टरियाँ)', 'रेलवे तकनीशियन/ALP व ग्रुप-D भर्तियाँ', 'सेना (अग्निवीर तकनीकी/ट्रेड्समैन)', 'हरियाणा CET से ग्रुप-C/D पद', 'इलेक्ट्रीशियन/EV मैकेनिक/सोलर ट्रेड → तुरंत रोज़गार', 'ड्रोन मरम्मत तकनीशियन व असेंबली', 'अपनी दुकान/वर्कशॉप']},
  after:{en:['10+2 equivalence option, and later a diploma (LEET)', 'Railways (RRB): Level-1 with Class 10/ITI; ITI needed for ALP', 'Agniveer Technical: 12th (PCM + English) or the ITI route', 'COPA/IT trade + online courses: data entry → analyst', 'Self-employment with PM Vishwakarma or Mudra loan for a shop/workshop'], hi:['10+2 समकक्षता के विकल्प व आगे डिप्लोमा (LEET)', 'रेलवे (RRB): 10वीं/ITI से Level-1; ALP हेतु ITI', 'अग्निवीर तकनीकी: 12वीं (PCM+अंग्रेज़ी) या ITI मार्ग', 'COPA/IT ट्रेड + ऑनलाइन कोर्स से डेटा-एंट्री → एनालिस्ट', 'स्वरोज़गार — PM विश्वकर्मा, मुद्रा ऋण से दुकान/वर्कशॉप']},
  tips:{en:['Trades offered change by institute — check the latest list on itiharyana.gov.in. Other block-level ITIs are also listed there.', 'Girls: almost every district has a separate govt women’s ITI.', 'SC/BC and eligible students can apply for the Haryana Post-Matric Scholarship on saralharyana.gov.in.', 'Govt jobs are given only through exam/merit. Report anyone who promises a job for money to the police (dial 112).', 'For a drone course, first check that it is a DGCA-approved RPTO.'], hi:['ट्रेड-उपलब्धता संस्थान-अनुसार बदलती है — नवीनतम सूची itiharyana.gov.in पर देखें; अन्य खंड-स्तरीय ITI भी वहीं।', 'छात्राएँ: लगभग हर ज़िले में छात्राओं हेतु अलग राजकीय महिला ITI है।', 'SC/BC व पात्र वर्गों के विद्यार्थी हरियाणा पोस्ट-मैट्रिक छात्रवृत्ति के लिए saralharyana.gov.in पर आवेदन करें।', 'सरकारी भर्ती में चयन केवल परीक्षा/मेरिट से होता है — पैसे देकर नौकरी का दावा करने वाले की शिकायत तुरंत पुलिस (डायल 112) को करें।', 'किसी भी ड्रोन कोर्स से पहले जाँचें कि वह DGCA-अनुमोदित RPTO है या नहीं।']},
  near:{en:['Shri Vishwakarma Skill University (Palwal)', 'Government ITIs in every district, with separate Women ITIs in almost every district (all districts)', 'Find your district’s government ITIs on itiharyana.gov.in'], hi:['श्री विश्वकर्मा कौशल विश्वविद्यालय (पलवल)', 'राजकीय ITI – हरियाणा के हर ज़िले में, लगभग हर ज़िले में अलग महिला ITI (सभी ज़िले)', 'अपने ज़िले की राजकीय ITI itiharyana.gov.in पर देखें']} },

  path:{en:['Class 10 / 12','DMLT, X-ray, OT-tech certificate / diploma','Hospital or lab job','Optional: B.Sc allied health'], hi:['10वीं / 12वीं','DMLT, X-ray, OT-टेक सर्टिफ़िकेट / डिप्लोमा','अस्पताल या लैब में नौकरी','वैकल्पिक: B.Sc अलाइड हेल्थ']},
  links:[['DMER Haryana','https://dmer.haryana.gov.in'],['CUET-UG (NTA)', 'https://cuet.nta.nic.in'],['AIIMS Exams', 'https://aiimsexams.ac.in'],['National Scholarship Portal', 'https://scholarships.gov.in']],
  detail:{en:['Paramedical means ‘medical-assistant’ courses — the soldiers of the health army. Every hospital needs a team of trained assistants to work with doctors, and the demand is huge in India and abroad.', 'Most diplomas are 1–3 years long, after Class 10 or Class 12 (PCB).', 'Study only at a recognised institute (approved by the State Paramedical Council, Pharmacy Council or Nursing Council). A certificate without recognition does not get you a govt job.', 'If you do not clear NEET, do not lose hope. B.Sc Nursing, B.Pharma, BPT, allied-health degrees and microbiology/biotech also give a respected, stable health career.'], hi:['Paramedical यानी चिकित्सा-सहायक कोर्स — स्वास्थ्य सेना के सिपाही। हर अस्पताल में डॉक्टर के साथ प्रशिक्षित सहायकों की फ़ौज चाहिए — भारत व विदेश दोनों में भारी माँग।', 'अधिकतर डिप्लोमा 10वीं/12वीं (PCB) के बाद 1–3 वर्ष के होते हैं।', 'केवल मान्यता-प्राप्त संस्थान से ही कोर्स करें (राज्य पैरामेडिकल काउंसिल / फ़ार्मेसी काउंसिल / नर्सिंग काउंसिल से)। बिना मान्यता के प्रमाणपत्र से सरकारी नौकरी नहीं मिलती।', 'NEET में सफलता न मिले तो निराश न हों — B.Sc नर्सिंग, B.Pharma, BPT, एलाइड-हेल्थ डिग्री, माइक्रोबायोलॉजी/बायोटेक से भी स्वास्थ्य-क्षेत्र में सम्मानजनक व स्थिर करियर बनता है।']},
  courses:{en:[['DMLT — Medical Lab Technician', '2 years'], ['X-Ray / Radiology Imaging Assistant', '2 years'], ['OT Assistant (Operation Theatre)', '1–2 years'], ['D.Pharma — Pharmacy Diploma (after 12th PCB/PCM)', '2 years'], ['ANM / GNM Nursing (popular among girls)', '2 / 3 years'], ['Physiotherapy Assistant, Dialysis Technician, ECG Technician', '1–2 years'], ['DNYT — Diploma in Naturopathy & Yoga Therapy', '1–2 years'], ['Health / Sanitary Inspector Diploma', '1 year']], hi:[['DMLT — मेडिकल लैब तकनीशियन', '2 वर्ष'], ['X-Ray / रेडियोलॉजी इमेजिंग सहायक', '2 वर्ष'], ['OT असिस्टेंट (ऑपरेशन थिएटर)', '1–2 वर्ष'], ['D.Pharma — फ़ार्मेसी डिप्लोमा (12वीं PCB/PCM)', '2 वर्ष'], ['ANM / GNM नर्सिंग (छात्राओं में लोकप्रिय)', '2 / 3 वर्ष'], ['फ़िज़ियोथेरेपी सहायक, डायलिसिस तकनीशियन, ECG तकनीशियन', '1–2 वर्ष'], ['DNYT — प्राकृतिक चिकित्सा एवं योग थेरेपी डिप्लोमा', '1–2 वर्ष'], ['हेल्थ/सैनिटरी इंस्पेक्टर डिप्लोमा', '1 वर्ष']]},
  work:{en:['Testing labs and blood banks', 'X-ray and sonography assistance', 'Assisting the surgery team', 'Medicine shops and hospital pharmacies', 'Nursing service', 'Special departments (physiotherapy, dialysis, ECG)', 'Yoga centres, wellness / AYUSH centres', 'Municipal bodies and food safety', 'Health + tech: health informatics, medical coding, tele-medicine assistant'], hi:['जाँच-लैब, ब्लड बैंक', 'एक्स-रे, सोनोग्राफ़ी सहायता', 'सर्जरी टीम सहायता', 'दवा दुकान/अस्पताल फ़ार्मेसी', 'नर्सिंग सेवा', 'विशेष विभाग (फ़िज़ियोथेरेपी, डायलिसिस, ECG)', 'योग-केंद्र, वेलनेस/आयुष केंद्र', 'नगर निकाय, फ़ूड सेफ़्टी', 'हेल्थ + टेक: हेल्थ इन्फ़ॉर्मेटिक्स, मेडिकल कोडिंग, टेली-मेडिसिन सहायक']},
  after:{en:['B.Pharma, B.Sc, allied-health degrees through CUET-UG', 'State nursing / paramedical admissions (ANM/GNM/B.Sc Nursing, DMLT) — dmer.haryana.gov.in', 'B.Sc (Hons) Nursing at AIIMS institutes', 'Hospital management (BHA/MHA)', 'Nursing jobs abroad — only through govt-registered agencies'], hi:['CUET-UG से B.Pharma, B.Sc, एलाइड हेल्थ डिग्री', 'राज्य नर्सिंग/पैरामेडिकल दाख़िले (ANM/GNM/B.Sc नर्सिंग, DMLT) — dmer.haryana.gov.in', 'AIIMS संस्थानों में B.Sc (H) नर्सिंग', 'अस्पताल-प्रबंधन (BHA/MHA)', 'विदेश में नर्सिंग — केवल सरकारी-पंजीकृत एजेंसियों से']},
  skills:{en:['Biology (PCB)', 'Spirit of service'], hi:['जीव विज्ञान (PCB)', 'सेवा-भाव']},
  tips:{en:['Join only a recognised institute (State Paramedical Council / Pharmacy Council / Nursing Council). Without recognition, no govt job.', 'Govt college fees are much lower than private ones — fill govt colleges first.', 'Anyone asking money to ‘get you a seat’ is a cheat. Admission happens only through counselling.', 'For physiotherapy, B.Sc Nursing and similar courses, watch for NEET/state counselling notices.', 'Going abroad: use only govt-registered agencies. ‘Donkey’ or illegal routes can kill — verify any agent who asks for money with the district administration/police.', 'Scholarships: apply on the National Scholarship Portal (scholarships.gov.in); SC/BC students also on saralharyana.gov.in.'], hi:['केवल मान्यता-प्राप्त संस्थान (राज्य पैरामेडिकल काउंसिल / फ़ार्मेसी काउंसिल / नर्सिंग काउंसिल) से कोर्स करें — बिना मान्यता के सरकारी नौकरी नहीं।', 'सरकारी कॉलेजों की फ़ीस निजी की तुलना में बहुत कम है — पहले वही भरें।', '“सीट दिलाने” के नाम पर पैसे माँगने वाला हर एजेंट ठग है — दाख़िला केवल काउंसलिंग से होता है।', 'फ़िज़ियोथेरेपी, B.Sc नर्सिंग आदि के लिए भी NEET/राज्य काउंसलिंग की सूचना देखें।', 'विदेश जाना हो तो केवल सरकारी-पंजीकृत एजेंसियों से जाएँ; “डंकी” या ग़ैर-क़ानूनी रास्ते जानलेवा हैं — पैसे माँगने वाले एजेंट का ज़िला प्रशासन/पुलिस से सत्यापन करें।', 'छात्रवृत्ति: राष्ट्रीय छात्रवृत्ति पोर्टल (scholarships.gov.in) पर आवेदन करें; SC/BC विद्यार्थी saralharyana.gov.in पर भी।']},

  tips:{en:['Apply only on official websites. Do not fall for any broker or a promise of a “sure job”.', 'Fake recruitment ads and money-asking gangs are caught every year. Report anyone who promises a job for money to the police (dial 112).', 'Haryana CET general knowledge asks a lot about Haryana’s history, geography and culture. Start making notes now.', 'Three free tools: NCERT books (Class 6–10), a daily newspaper with monthly current affairs, and previous papers free on official websites.', 'SSC, RRB and HSSC recruitments open all year. Haryana CET usually comes around October–November, as per notification.', 'Divyang candidates get 4% reservation in government jobs. Get your UDID card made (swavlambancard.gov.in).'], hi:['सभी आवेदन केवल आधिकारिक वेबसाइट से करें — किसी दलाल या “पक्की नौकरी” के झाँसे में न आएँ।', 'हर वर्ष नक़ली भर्ती-विज्ञापन व पैसे माँगने वाले गिरोह पकड़े जाते हैं। पैसे देकर नौकरी का दावा करने वाले की शिकायत तुरंत पुलिस (डायल 112) को करें।', 'हरियाणा CET के सामान्य ज्ञान में हरियाणा का इतिहास, भूगोल व संस्कृति विशेष रूप से पूछा जाता है — अभी से नोट्स बनाएँ।', 'तैयारी के 3 मुफ़्त साधन: NCERT पुस्तकें (कक्षा 6–10), रोज़ाना समाचार-पत्र + मासिक करंट अफ़ेयर्स, आधिकारिक वेबसाइटों पर मुफ़्त पिछले प्रश्न-पत्र।', 'SSC/RRB/HSSC भर्तियाँ वर्ष भर आती हैं; हरियाणा CET प्रायः अक्टूबर–नवंबर में (अधिसूचना-अनुसार)।', 'दिव्यांग विद्यार्थियों को सरकारी नौकरियों में 4% आरक्षण — UDID कार्ड बनवाएँ (swavlambancard.gov.in)।']},

  about:{en:'Join the armed forces under the Agnipath scheme after Class 10 or 12 (depending on the post). You earn a salary and acquire discipline and technical skills from the start.', hi:'अग्निपथ योजना में पद के अनुसार 10वीं या 12वीं के बाद सेना में भर्ती। पहले दिन से वेतन, अनुशासन व तकनीकी कौशल।'},

  detail:{en:['Since 2022, soldier-level recruitment in the armed forces happens under the Agnipath scheme. Selected youth serve for 4 years as “Agniveers”. After that, about 25% are kept in the permanent cadre.', 'Haryana, the land of heroes, sends thousands of young people every year.', 'Pay starts at about ₹30,000 a month and rises every year. After 4 years you get a Seva Nidhi of about ₹11.7 lakh (tax-free), plus life insurance cover of ₹48 lakh and a skill certificate.', 'Girls can join as Women Military Police (GD) after Class 10.'], hi:['2022 से सशस्त्र बलों में सैनिक-स्तर की भर्ती अग्निपथ योजना के अंतर्गत होती है। चयनित युवा 4 वर्ष “अग्निवीर” के रूप में सेवा करते हैं; इसके बाद लगभग 25% को स्थायी काडर में रखा जाता है।', 'हरियाणा — वीरों की भूमि — से हर वर्ष हज़ारों युवा चुने जाते हैं।', 'प्रारंभिक पैकेज लगभग ₹30,000/माह से, प्रतिवर्ष वृद्धि। 4 वर्ष पूरे होने पर सेवा-निधि ≈ ₹11.7 लाख (कर-मुक्त), ₹48 लाख का जीवन बीमा कवर व कौशल प्रमाणपत्र।', 'बेटियों के लिए 10वीं के बाद महिला सैन्य पुलिस (GD) भर्ती।']},
  courses:{en:[['Agniveer General Duty (GD)', 'Class 10 — 45% total, 33% in each subject'], ['Agniveer Technical', 'Class 12 (PCM + English) 50%/40%, or ITI route'], ['Agniveer Clerk / Store Keeper', 'Class 12 any stream 60%/50% (50% in English and Maths/Accounts)'], ['Agniveer Tradesman', 'Class 8 / 10 pass'], ['Women Military Police (GD)', 'Class 10 45%/33% — for girls'], ['Navy (SSR / MR), Air Force (Agniveervayu)', 'See their own websites']], hi:[['अग्निवीर जनरल ड्यूटी (GD)', '10वीं — कुल 45% व हर विषय में 33%'], ['अग्निवीर तकनीकी', '12वीं (PCM+अंग्रेज़ी) 50%/40% या ITI मार्ग'], ['अग्निवीर क्लर्क / स्टोर कीपर', '12वीं किसी भी संकाय में 60%/50% (अंग्रेज़ी व गणित/लेखा में 50%)'], ['अग्निवीर ट्रेड्समैन', '8वीं / 10वीं पास'], ['महिला सैन्य पुलिस (GD)', '10वीं 45%/33% — बेटियों के लिए'], ['नौसेना (SSR/MR), वायुसेना (अग्निवीरवायु)', 'अपनी-अपनी वेबसाइट देखें']]},
  work:{en:['Army, Navy and Air Force as an Agniveer', 'Women Military Police'], hi:['थलसेना, नौसेना व वायुसेना में अग्निवीर', 'महिला सैन्य पुलिस']},

  about:{en:'Drones are used in farming, surveying, mapping, media and defence. Take a DGCA-approved Remote Pilot course, an ITI drone trade, or an engineering diploma / degree.', hi:'खेती, सर्वेक्षण, मैपिंग, मीडिया व रक्षा में ड्रोन का उपयोग बढ़ रहा है। DGCA-मान्य रिमोट पायलट कोर्स, ITI ड्रोन ट्रेड या इंजीनियरिंग डिप्लोमा/डिग्री करें।'},
  elig:{en:'Class 10 pass + age 18 (indicative).', hi:'10वीं पास + 18 वर्ष आयु (सांकेतिक)।'},
  exams:{en:'Training at a DGCA-approved RPTO → Remote Pilot Certificate (RPC)', hi:'DGCA-अनुमोदित RPTO से प्रशिक्षण → रिमोट पायलट सर्टिफ़िकेट (RPC)'},
  path:{en:['Class 10 / 12','Remote pilot course / ITI / diploma','Certificate (DGCA)','Agri-drone, survey, media, defence work'], hi:['10वीं/12वीं','रिमोट पायलट कोर्स / ITI / डिप्लोमा','प्रमाणपत्र (DGCA)','एग्री-ड्रोन, सर्वे, मीडिया, रक्षा क्षेत्र']},
  links:[['Digital Sky (DGCA)','https://digitalsky.dgca.gov.in'],['ITI Haryana', 'https://itiharyana.gov.in']],
  detail:{en:['Drone technology is a new job in the sky. You train at a DGCA-approved RPTO and get a Remote Pilot Certificate (RPC).', 'Eligibility: Class 10 pass + 18 years of age (indicative). The course usually takes 5–10 days (about a week). You register on the Digital Sky portal.', 'Training in Haryana: DRIISHYA (Drone Imaging and Information Service of Haryana), a Haryana government body based in Karnal, runs DGCA-approved drone-pilot courses. Drone Didi training also happens there.', 'ITIs also have a new-age Drone Technician trade — demand is huge in farming and survey.'], hi:['ड्रोन तकनीक — आसमान का नया रोज़गार। DGCA-अनुमोदित RPTO से प्रशिक्षण → रिमोट पायलट सर्टिफ़िकेट (RPC)।', 'योग्यता: 10वीं पास + 18 वर्ष आयु (सांकेतिक)। कोर्स प्रायः 5–10 दिन का (लगभग एक सप्ताह); डिजिटल स्काई पोर्टल पर पंजीकरण।', 'हरियाणा में प्रशिक्षण: हरियाणा सरकार की संस्था दृश्या (DRIISHYA) — ड्रोन इमेजिंग एंड इंफ़ॉर्मेशन सर्विस ऑफ़ हरियाणा, करनाल — DGCA-अनुमोदित ड्रोन-पायलट कोर्स कराती है; ड्रोन दीदी प्रशिक्षण भी वहीं।', 'ITI में नए ज़माने का ड्रोन तकनीशियन ट्रेड भी है — खेती व सर्वे में भारी माँग।']},
  courses:{en:[['Remote Pilot Certificate (RPC) at a DGCA-approved RPTO', '5–10 days'], ['ITI Drone Technician trade', 'new-age trade; availability varies by institute']], hi:[['DGCA-अनुमोदित RPTO से रिमोट पायलट सर्टिफ़िकेट (RPC)', '5–10 दिन'], ['ITI ड्रोन तकनीशियन ट्रेड', 'नए ज़माने का ट्रेड; उपलब्धता संस्थान-अनुसार']]},
  work:{en:['Farming: spraying nano-urea / medicine — Kisan Drone and the Drone Didi scheme (for women SHGs)', 'Survey and mapping (schemes like SVAMITVA), power-line / solar inspection', 'Photo-videography (weddings / events), delivery and disaster relief', 'Drone repair technician and assembly — the ITI route'], hi:['खेती: नैनो-यूरिया/दवा छिड़काव — किसान ड्रोन व ड्रोन दीदी योजना (महिला SHG हेतु)', 'सर्वे व मैपिंग (SVAMITVA जैसी योजनाएँ), बिजली-लाइन/सोलर निरीक्षण', 'फ़ोटो-वीडियोग्राफ़ी (शादी/इवेंट), डिलीवरी व आपदा-राहत', 'ड्रोन मरम्मत तकनीशियन व असेंबली — ITI मार्ग']},
  tips:{en:['Before any private ‘drone course’, check whether it is a DGCA-approved RPTO.', 'A state-level drone training institute has been announced in Haryana (like DRIISHYA) — ask your district horticulture / agriculture department about current training chances.', 'For women: the Drone Didi scheme gives women SHGs free drone-pilot training; Haryana’s DRIISHYA centre is in Karnal.', 'ITI trades change by institute — check the list on itiharyana.gov.in.'], hi:['किसी भी निजी “ड्रोन कोर्स” से पहले जाँचें कि वह DGCA-अनुमोदित RPTO है या नहीं।', 'हरियाणा में ड्रोन प्रशिक्षण हेतु राज्य-स्तरीय संस्थान (जैसे दृश्या/DRIISHYA) की घोषणा हुई है — अपने ज़िला उद्यान/कृषि विभाग से वर्तमान प्रशिक्षण-अवसर पूछें।', 'महिलाओं के लिए: ड्रोन दीदी योजना — महिला SHG को मुफ़्त ड्रोन-पायलट प्रशिक्षण; हरियाणा का दृश्या केंद्र करनाल में है।', 'ITI ट्रेड-उपलब्धता संस्थान-अनुसार बदलती है — itiharyana.gov.in पर सूची देखें।']},
  near:{en:['DRIISHYA – Drone Imaging and Information Service of Haryana, DGCA-approved drone-pilot training (Karnal)', 'Government ITIs – drone/solar/EV technician trades (all districts)'], hi:['दृश्या (DRIISHYA) – ड्रोन इमेजिंग एंड इंफ़ॉर्मेशन सर्विस ऑफ़ हरियाणा, DGCA-अनुमोदित ड्रोन-पायलट कोर्स (करनाल)', 'राजकीय ITI – ड्रोन/सोलर/EV तकनीशियन ट्रेड (सभी ज़िले)']} },

  detail:{en:['The whole vehicle industry is moving from petrol-diesel to electric. Solar on every roof (PM Surya Ghar Yojana) and the Green Hydrogen Mission are creating lakhs of new jobs.', 'Solar on every roof means every village needs technicians, and the EV charging network is spreading fast.', 'Routes: ITI (Electrician / EV Mechanic / Solar trade) for a quick job; a diploma or B.Tech in Electrical, Mechanical, EV or Renewable Energy; or skill-council courses like ‘Suryamitra’ (see the Skill India portal).', 'Other green careers: B.Sc Environmental Science, Forest Service (IFS — UPSC), Pollution Control Board, water-conservation expert. ‘Green jobs’ will be among the biggest job groups of the coming decade.'], hi:['पेट्रोल-डीज़ल से बिजली की ओर पूरा वाहन-उद्योग बदल रहा है; हर छत पर सोलर (PM सूर्य घर योजना) व ग्रीन हाइड्रोजन मिशन से लाखों नई नौकरियाँ बन रही हैं।', 'हर छत पर सोलर = हर गाँव में तकनीशियन की माँग; चार्जिंग नेटवर्क तेज़ी से फैल रहा है।', 'रास्ते: ITI — इलेक्ट्रीशियन/EV मैकेनिक/सोलर ट्रेड → तुरंत रोज़गार; डिप्लोमा/B.Tech — इलेक्ट्रिकल, मैकेनिकल, EV, रिन्यूएबल एनर्जी; कौशल कोर्स — स्किल काउंसिल के “सूर्यमित्र” जैसे कार्यक्रम (Skill India पोर्टल देखें)।', 'पर्यावरण से जुड़े अन्य करियर: B.Sc पर्यावरण विज्ञान, वन-सेवा (IFS — UPSC), प्रदूषण नियंत्रण बोर्ड, जल-संरक्षण विशेषज्ञ — “ग्रीन जॉब्स” आने वाले दशक की सबसे बड़ी श्रेणियों में हैं।']},
  courses:{en:[['ITI Electrician', '2 years'], ['ITI EV Mechanic / Solar Technician', 'new-age trades; availability varies'], ['Diploma: Electric Vehicle (EV) technology, Solar / Renewable Energy', '3 years after Class 10'], ['B.Tech: Electrical, Mechanical, EV, Renewable Energy', '4 years'], ['Skill course: ‘Suryamitra’', 'skill council programme'], ['B.Sc Environmental Science', '3–4 years']], hi:[['ITI इलेक्ट्रीशियन', '2 वर्ष'], ['ITI EV मैकेनिक / सोलर तकनीशियन', 'नए ज़माने के ट्रेड; उपलब्धता संस्थान-अनुसार'], ['डिप्लोमा: इलेक्ट्रिक वाहन (EV) तकनीक, सोलर/रिन्यूएबल एनर्जी', '10वीं के बाद 3 वर्ष'], ['B.Tech: इलेक्ट्रिकल, मैकेनिकल, EV, रिन्यूएबल एनर्जी', '4 वर्ष'], ['कौशल कोर्स: “सूर्यमित्र”', 'स्किल काउंसिल कार्यक्रम'], ['B.Sc पर्यावरण विज्ञान', '3–4 वर्ष']]},

  after:{en:['After ITI: apprenticeship (Railways, HAL, power corporations, factories)', 'After ITI: 10+2 equivalence options, then diploma (LEET)', 'After diploma: Junior Engineer (SSC-JE, Railways, power corporations, HSSC) or B.Tech 2nd year (lateral entry)', 'Self-employment — PM Vishwakarma, Mudra loan for a shop / workshop'], hi:['ITI के बाद: अप्रेंटिसशिप (रेलवे, HAL, बिजली निगम, फ़ैक्टरियाँ)', 'ITI के बाद: 10+2 समकक्षता के विकल्प व आगे डिप्लोमा (LEET)', 'डिप्लोमा के बाद: जूनियर इंजीनियर (SSC-JE, रेलवे, बिजली निगम, HSSC) या B.Tech द्वितीय वर्ष में लेटरल एंट्री', 'स्वरोज़गार — PM विश्वकर्मा, मुद्रा ऋण से दुकान/वर्कशॉप']},
  tips:{en:['Trades and diploma branches differ by institute — check the list on itiharyana.gov.in (ITI) and the HSTES list (diploma).', 'For skill-council courses like Suryamitra, see the Skill India Digital portal — it also has free online courses.', 'Government polytechnic fees are low; scholarships are available for SC/BC and meritorious students.', 'Almost every district in Haryana has a separate women’s ITI.'], hi:['ट्रेड व डिप्लोमा ब्रांच की उपलब्धता संस्थान-अनुसार है — itiharyana.gov.in (ITI) व HSTES सूची (डिप्लोमा) देखें।', '“सूर्यमित्र” जैसे स्किल काउंसिल कार्यक्रमों के लिए Skill India Digital पोर्टल देखें — वहाँ मुफ़्त ऑनलाइन कोर्स भी हैं।', 'सरकारी पॉलिटेक्निक की फ़ीस कम है; SC/BC व मेधावी विद्यार्थियों के लिए छात्रवृत्तियाँ उपलब्ध हैं।', 'हरियाणा के लगभग हर ज़िले में छात्राओं हेतु अलग महिला ITI है।']},
  near:{en:['National Institute of Technology, NIT (Kurukshetra)', 'Deenbandhu Chhotu Ram University of Science & Technology, DCRUST, Murthal (Sonipat)', 'J.C. Bose University of Science & Technology, YMCA (Faridabad)', 'Guru Jambheshwar University of Science & Technology, GJU (Hisar)', 'Shri Vishwakarma Skill University (Palwal)', 'UIET – Kurukshetra University (Kurukshetra)'], hi:['राष्ट्रीय प्रौद्योगिकी संस्थान, NIT (कुरुक्षेत्र)', 'दीनबंधु छोटू राम विज्ञान एवं प्रौद्योगिकी विवि, मुरथल (सोनीपत)', 'जे0सी0 बोस विज्ञान एवं प्रौद्योगिकी विवि, YMCA (फ़रीदाबाद)', 'गुरु जम्भेश्वर विज्ञान एवं प्रौद्योगिकी विवि, GJU (हिसार)', 'श्री विश्वकर्मा कौशल विश्वविद्यालय (पलवल)', 'UIET – कुरुक्षेत्र विश्वविद्यालय (कुरुक्षेत्र)']} },

{ id:'avgc', ico:'🎬', lv:['10','12'], st:['any'], rs:'arts', ri:'AIR', ap:['spa','verb'], cost:2, earn:3, reloc:1, tag:['emerging'],

  about:{en:'Animation, VFX, game design, video editing and content creation. A portfolio of your work matters more than marks — start building one early.', hi:'एनीमेशन, VFX, गेम डिज़ाइन, वीडियो एडिटिंग व कंटेंट क्रिएशन। अंकों से ज़्यादा आपके काम का पोर्टफ़ोलियो मायने रखता है — अभी से बनाना शुरू करें।'},
  elig:{en:'Class 10 / 12, any stream; drawing / creativity.', hi:'10वीं/12वीं, कोई भी स्ट्रीम; चित्रकला / रचनात्मकता।'},

  detail:{en:['From VFX in films to mobile games — India’s AVGC-XR (animation, visual effects, gaming, comics) industry is growing fast, and the government’s national AVGC policy is pushing it.', 'Work ranges from animation, VFX, game design and AR/VR to content creation, video editing and social-media management.', 'The creator economy is a real profession, but income can be uncertain. Pursue it with skill and studies together, not by leaving your studies.', 'The talent for telling stories runs in Haryana’s veins — now bring it to the screen.'], hi:['फ़िल्मों के VFX से लेकर मोबाइल गेम्स तक — भारत का AVGC-XR (एनीमेशन, विज़ुअल इफ़ेक्ट्स, गेमिंग, कॉमिक्स) उद्योग तेज़ी से बढ़ रहा है और सरकार की राष्ट्रीय AVGC नीति इसे बढ़ावा दे रही है।', 'काम एनीमेशन, VFX, गेम डिज़ाइन व AR/VR से लेकर कंटेंट क्रिएशन, वीडियो एडिटिंग व सोशल-मीडिया प्रबंधन तक है।', 'क्रिएटर-अर्थव्यवस्था असली पेशा है, पर आमदनी अनिश्चित हो सकती है — इसे कौशल + पढ़ाई के साथ साधें, पढ़ाई छोड़कर नहीं।', 'कहानी कहने का हुनर हरियाणा की रगों में है — अब उसे पर्दे पर उतारिए।']},

  detail:{en:['B.Tech / B.E. is a 4-year degree. It makes you an engineer, software developer or scientist. Core branches are Computer Science (CSE), Mechanical, Civil, Electrical, Electronics (ECE), Chemical, Automobile, Aerospace, Biotech, Food Tech, Mining and Textile.', 'New-generation branches are AI & Machine Learning (AI-ML), Data Science, Cyber Security, Robotics & Automation, IoT, VLSI / semiconductor chip design, Electric Vehicles (EV) and Renewable Energy. Demand for these is expected to grow fastest in the next decade.', 'In Haryana, state government and private colleges admit through HSTES counselling, using the JEE Main score or Class 12 merit. NIT Kurukshetra is Haryana’s only NIT. Engineering is now just as strong a field for girls.', 'After Class 10 you can also do a 3-year polytechnic diploma and then join B.Tech directly in the second year (lateral entry).'], hi:['B.Tech / B.E. 4 वर्ष की डिग्री है — इससे इंजीनियर, सॉफ़्टवेयर डेवलपर, वैज्ञानिक बनते हैं। कोर ब्रांच: कंप्यूटर साइंस (CSE), मैकेनिकल, सिविल, इलेक्ट्रिकल, इलेक्ट्रॉनिक्स (ECE), केमिकल, ऑटोमोबाइल, एयरोस्पेस, बायोटेक, फ़ूड टेक, माइनिंग, टेक्सटाइल।', 'नई पीढ़ी की ब्रांच: आर्टिफ़िशियल इंटेलिजेंस व मशीन लर्निंग (AI-ML), डेटा साइंस, साइबर सुरक्षा, रोबोटिक्स व ऑटोमेशन, IoT, VLSI/सेमीकंडक्टर चिप डिज़ाइन, इलेक्ट्रिक वाहन (EV), रिन्यूएबल एनर्जी — इनकी माँग अगले दशक में सबसे तेज़ बढ़ने का अनुमान है।', 'हरियाणा में राज्य के सरकारी/निजी कॉलेजों में HSTES काउंसलिंग से दाख़िला होता है — JEE Main स्कोर/12वीं मेरिट से। NIT कुरुक्षेत्र हरियाणा का एकमात्र NIT है। इंजीनियरिंग अब बेटियों का भी उतना ही मज़बूत क्षेत्र है।', '10वीं के बाद 3 वर्ष का पॉलिटेक्निक डिप्लोमा करके B.Tech के दूसरे वर्ष में लेटरल एंट्री का रास्ता भी है।']},

  tips:{en:['For girls: technical institutes have extra (supernumerary) seats for girls, and scholarships like AICTE Pragati.', 'Bhagat Phool Singh Mahila Vishwavidyalaya, Khanpur Kalan (Sonipat) teaches engineering too; IGDTUW Delhi is a technical university only for girls (JEE Main).', 'Haryana government programmes like Super-100 give meritorious government-school students free JEE/NEET coaching — ask at your school.', 'Free resources: NTA Abhyas app, IIT-PAL (SWAYAM), NPTEL on YouTube. Master NCERT — a big part of JEE Main comes from it.', 'Exam patterns keep changing — always read that year’s information bulletin before applying.', 'Always check AICTE approval and NAAC/NBA accreditation. Check a private institute’s fees and real placements first. Government institutes have low fees and scholarships.', 'Haryana is close to Delhi and Chandigarh — every big institute in the country is within your reach.'], hi:['बेटियों के लिए: तकनीकी संस्थानों में छात्राओं हेतु अतिरिक्त सीटें (सुपरन्यूमेरी) व AICTE-प्रगति जैसी छात्रवृत्तियाँ उपलब्ध हैं।', 'भगत फूल सिंह महिला विश्वविद्यालय, ख़ानपुर कलाँ (सोनीपत) — इंजीनियरिंग समेत; IGDTUW दिल्ली — केवल छात्राओं का तकनीकी विश्वविद्यालय (JEE Main)।', 'हरियाणा सरकार के सुपर-100 जैसे कार्यक्रम मेधावी सरकारी-स्कूल विद्यार्थियों को मुफ़्त JEE/NEET कोचिंग देते हैं — अपने विद्यालय से जानकारी लें।', 'मुफ़्त संसाधन: NTA Abhyas ऐप, IIT-PAL (SWAYAM), यूट्यूब पर NPTEL। NCERT पर पूर्ण पकड़ — JEE Main का बड़ा हिस्सा यहीं से।', 'परीक्षा-पैटर्न बदलते रहते हैं — आवेदन से पहले उसी वर्ष का सूचना-बुलेटिन अवश्य पढ़ें।', 'AICTE-अनुमोदन व NAAC/NBA मान्यता अवश्य जाँचें। निजी संस्थान की फ़ीस व प्लेसमेंट-वास्तविकता पहले जाँचें। सरकारी संस्थानों की फ़ीस कम है और छात्रवृत्तियाँ उपलब्ध हैं।', 'हरियाणा से दिल्ली व चंडीगढ़ पास हैं — देश का हर बड़ा संस्थान आपकी पहुँच में है।']},

  links:[['JEE Main','https://jeemain.nta.nic.in'],['CUET-UG','https://cuet.nta.nic.in'],['SWAYAM','https://swayam.gov.in'],['IIT Madras BS (online)', 'https://study.iitm.ac.in'],['Skill India Digital', 'https://skillindiadigital.gov.in'],['ITI Haryana', 'https://itiharyana.gov.in']],
  detail:{en:['AI is like electricity today — every industry will use it. Farming, hospitals, banks, shops and government offices all need people who know AI.', 'Good news: you do not need to move to an expensive city to learn it. World-class study is free on the internet.', 'Routes from any background: with PCM, B.Tech AI-ML, Data Science or CSE through JEE, or IIT Madras’s online BS in Data Science (an IIT degree from home). From any stream, BCA → data analytics, or B.Sc Computer Science. After Class 10 / ITI, the COPA / IT trade plus online courses → data entry → analyst.', 'AI will not eat jobs, it will change them — a person who can use AI will stay ahead of one who cannot. Data is the new paddy, and Haryana’s children will lead in growing it too.'], hi:['AI आज बिजली जैसा है — हर उद्योग में लगेगा। खेती, अस्पताल, बैंक, दुकानें, सरकारी दफ़्तर — सब जगह AI-जानकारों की माँग है।', 'अच्छी ख़बर: इसे सीखने के लिए महँगे शहर जाना ज़रूरी नहीं — इंटरनेट पर विश्व-स्तरीय पढ़ाई मुफ़्त उपलब्ध है।', 'रास्ते (कोई भी पृष्ठभूमि): PCM — B.Tech AI-ML, डेटा साइंस या CSE (JEE से), या IIT मद्रास ऑनलाइन BS डेटा साइंस (घर बैठे IIT डिग्री)। कोई भी स्ट्रीम — BCA → डेटा एनालिटिक्स, या B.Sc कंप्यूटर साइंस। 10वीं/ITI — COPA/IT ट्रेड + ऑनलाइन कोर्स से डेटा-एंट्री → एनालिस्ट।', 'AI नौकरियाँ खाएगा नहीं, बदलेगा — जो AI चलाना जानता है, वह उससे आगे रहेगा जो नहीं जानता। डेटा नया धान है — और हरियाणा के बच्चे उसकी खेती में भी आगे रहेंगे।']},

  tips:{en:['Start at home today: (1) learn Python free on the internet, in Hindi too (2) learn to handle data in Excel / Google Sheets (3) do an NPTEL course like ‘Python for Data Science’ on SWAYAM (with a certificate) (4) make a small project, such as a data analysis of your village’s crops or rainfall. This portfolio gets you the job.', 'Free courses: SWAYAM, NPTEL (IIT professors), Skill India Digital.', 'Possible from a village school: take PCM in Class 11 → prepare for JEE (Super-100 / free online resources) → B.Tech (CSE / AI). Mobile + regularity = half the battle won.', 'Students of every stream should have a basic understanding of AI tools.', 'Collecting certificates is not the goal — showing your work is. After each course, make a small project (website, report, design, analysis).', 'Make your mobile a friend, not the boss: fix a daily time for study, download and watch offline, and use the village CSC, library or school computer lab.'], hi:['घर बैठे शुरुआत — आज ही: ① पायथन (Python) सीखें — इंटरनेट पर हिंदी में मुफ़्त ② एक्सेल/गूगल शीट्स में डेटा सँभालना सीखें ③ SWAYAM पर “Python for Data Science” जैसे NPTEL कोर्स करें (प्रमाणपत्र भी) ④ छोटा प्रोजेक्ट बनाएँ — जैसे अपने गाँव की फ़सल/वर्षा का डेटा-विश्लेषण। यही पोर्टफ़ोलियो नौकरी दिलाता है।', 'मुफ़्त कोर्स: SWAYAM, NPTEL (IIT प्रोफ़ेसर), Skill India Digital।', 'गाँव के स्कूल से संभव: 11वीं में PCM लें → JEE की तैयारी (सुपर-100/मुफ़्त ऑनलाइन साधन) → B.Tech (CSE/AI)। मोबाइल + नियमितता = आधी लड़ाई जीत।', 'हर स्ट्रीम के विद्यार्थी को AI-टूल्स की बुनियादी समझ अवश्य रखनी चाहिए।', 'प्रमाणपत्र इकट्ठे करना लक्ष्य नहीं — करके दिखाना लक्ष्य है। हर कोर्स के बाद एक छोटा प्रोजेक्ट बनाइए (वेबसाइट, रिपोर्ट, डिज़ाइन, विश्लेषण)।', 'मोबाइल को दोस्त बनाइए, मालिक नहीं: दिन में तय समय पढ़ाई के लिए, डाउनलोड कर ऑफ़लाइन देखें, गाँव के CSC/पुस्तकालय/स्कूल-कंप्यूटर लैब का उपयोग करें।']},

  tips:{en:['Selection: written exam (Maths + General Ability), then a 5-day SSB interview, then medical.', 'SSB tip: they do not test spoken English. They test Officer Like Qualities (OLQ) — work on sports, leadership and general knowledge.', 'NDA-I exam is around April (apply Dec–Jan); NDA-II around August–September (apply May–June).', 'Want to be a pilot? Try the Air Force route first (NDA after Class 12 PCM, or AFCAT after graduation) — the government pays for training.', 'Girls are also admitted to Sainik Schools now.'], hi:['चयन: लिखित (गणित + सामान्य योग्यता) → SSB साक्षात्कार (5 दिन) → मेडिकल।', 'SSB टिप: अंग्रेज़ी बोलना नहीं, व्यक्तित्व-गुण (OLQ) परखे जाते हैं — खेल, नेतृत्व व सामान्य ज्ञान पर काम करें।', 'NDA-I परीक्षा प्रायः अप्रैल (आवेदन दिसं–जन); NDA-II अगस्त–सितंबर (आवेदन मई–जून)।', 'पायलट बनना है? पहले वायुसेना का रास्ता आज़माएँ — NDA (12वीं PCM) या AFCAT (स्नातक); प्रशिक्षण सरकार कराती है।', 'सैनिक स्कूलों में भी अब छात्राओं का दाख़िला।']},

  courses:{en:[['B.Sc (Physics / Maths / …)', '3–4 years'], ['Integrated BS-MS', '5 years'], ['B.Sc (Botany / Zoology / Microbiology …)', '3–4 years']], hi:[['B.Sc (भौतिकी/गणित/…)', '3–4 वर्ष'], ['इंटीग्रेटेड BS-MS', '5 वर्ष'], ['B.Sc (वनस्पति/प्राणी/माइक्रोबायोलॉजी…)', '3–4 वर्ष']]},

  detail:{en:['NEET-UG is the single entrance exam for MBBS, BDS, BAMS, BHMS, B.V.Sc and most medical courses. AIIMS and JIPMER seats also fill through NEET.', 'A government MBBS seat is a dream you can reach. 85% of seats in Haryana’s government medical colleges are filled by state-quota counselling run by DMER Haryana. 15% are all-India quota, filled by MCC.', 'Haryana has government medical colleges across the state — PGIMS Rohtak, Kalpana Chawla GMC Karnal, BPS GMC Khanpur Kalan, SHKM GMC Nalhar and others — and health sciences universities at Rohtak and Kutail. The full system to become a doctor is right in your own state.', 'AIIMS Majra (Rewari) is being built, with 50 MBBS seats approved from the 2026-27 session. New government medical colleges are approved or being built in Jind, Bhiwani, Kaithal, Yamunanagar, Sirsa and other districts.'], hi:['MBBS, BDS, BAMS, BHMS, B.V.Sc व अधिकतर मेडिकल कोर्सों के लिए NEET-UG एकमात्र प्रवेश-परीक्षा है। AIIMS व JIPMER की सीटें भी NEET से ही भरती हैं।', 'सरकारी MBBS सीट का सपना संभव है। हरियाणा के सरकारी मेडिकल कॉलेजों की 85% राज्य-कोटा सीटों की काउंसलिंग DMER हरियाणा करता है, 15% अखिल भारतीय कोटा की MCC।', 'हरियाणा में राज्य भर में राजकीय मेडिकल कॉलेज हैं — PGIMS रोहतक, कल्पना चावला GMC करनाल, BPS GMC खानपुर कलाँ, SHKM GMC नल्हड़ आदि — और रोहतक व कुटैल में स्वास्थ्य विज्ञान विश्वविद्यालय। अपने राज्य से डॉक्टर बनने का पूरा तंत्र मौजूद है।', 'AIIMS माजरा (रेवाड़ी) निर्माणाधीन है — 2026-27 सत्र से 50 MBBS सीटें स्वीकृत। साथ ही जींद, भिवानी, कैथल, यमुनानगर, सिरसा आदि ज़िलों में नए राजकीय मेडिकल कॉलेज स्वीकृत/निर्माणाधीन हैं।']},

  tips:{en:['NEET-UG pattern (indicative): pen-paper; Physics 45 + Chemistry 45 + Biology 90 = 180 questions, 720 marks, +4/−1. Exam in May; applications usually in February–March.', 'Check that the college is recognised by the NMC (National Medical Commission).', 'Government college fees are much lower than private ones — fill government colleges first in counselling.', 'Any agent who asks for money to “get you a seat” is a cheat. Admission happens only through counselling.', 'For BAMS / BHMS / BUMS too, watch the NEET / state counselling notices.', 'If NEET does not work out, do not lose hope. B.Sc Nursing, B.Pharma, BPT, allied-health degrees and Microbiology/Biotech also give a respected, stable health career. Join one of these while you try NEET again — your time is not wasted.', 'NEET is possible without coaching: NCERT + past papers + free online resources (SWAYAM, NTA Abhyas) + discipline. Government Super-100 type schemes give free coaching to bright students — ask your school.', 'Money should not stop you: government colleges have low fees; NSP / state scholarships, fee waivers and PM Vidyalaxmi education loans (without guarantee) are available.', 'Divyang students: 5% reserved seats in higher education, and extra time and a scribe in NEET. Get your UDID card made (swavlambancard.gov.in).'], hi:['NEET-UG स्वरूप (सांकेतिक): पेन-पेपर • भौतिकी 45 + रसायन 45 + जीवविज्ञान 90 = 180 प्रश्न, 720 अंक, +4/−1। परीक्षा मई में; आवेदन प्रायः फ़रवरी-मार्च।', 'कॉलेज NMC (राष्ट्रीय आयुर्विज्ञान आयोग) से मान्यता-प्राप्त है या नहीं — अवश्य जाँचें।', 'सरकारी कॉलेजों की फ़ीस निजी की तुलना में बहुत कम है — पहले वही भरें।', '“सीट दिलाने” के नाम पर पैसे माँगने वाला हर एजेंट ठग है — दाख़िला केवल काउंसलिंग से होता है।', 'BAMS/BHMS/BUMS के लिए भी NEET/राज्य काउंसलिंग की सूचना देखें।', 'NEET में सफलता न मिले तो निराश न हों — B.Sc नर्सिंग, B.Pharma, BPT, एलाइड-हेल्थ डिग्री, माइक्रोबायोलॉजी/बायोटेक से भी स्वास्थ्य-क्षेत्र में सम्मानजनक व स्थिर करियर बनता है। दूसरा प्रयास करते हुए इनमें से किसी डिग्री में प्रवेश लेना समझदारी है — समय व्यर्थ नहीं जाता।', 'बिना कोचिंग NEET संभव है: NCERT + पिछले प्रश्न-पत्र + मुफ़्त ऑनलाइन साधन (SWAYAM, NTA Abhyas) + अनुशासन। सरकारी सुपर-100 जैसी योजनाएँ मेधावी विद्यार्थियों को मुफ़्त कोचिंग देती हैं — विद्यालय से पूछें।', 'पैसा रुकावट न बने: सरकारी कॉलेज की फ़ीस कम है; NSP/राज्य छात्रवृत्तियाँ, फ़ीस-माफ़ी व PM विद्यालक्ष्मी (बिना गारंटी) शिक्षा-ऋण मौजूद हैं।', 'दिव्यांग विद्यार्थी: उच्च शिक्षा में 5% आरक्षित सीटें व NEET में अतिरिक्त समय व लेखक (scribe) की सुविधा। UDID कार्ड बनवाएँ (swavlambancard.gov.in)।']},

  path:{en:['Class 12','Graduation (any subject)','Prelims → Mains → Interview','IAS / IPS / HCS'], hi:['12वीं','स्नातक (कोई भी विषय)','प्रारंभिक → मुख्य → साक्षात्कार','IAS / IPS / HCS']},
  links:[['UPSC','https://upsc.gov.in'],['HPSC','https://hpsc.gov.in'],['Haryana college admissions', 'https://admissions.highereduhry.ac.in']],
  detail:{en:['District officers like the DC, SP and SDM all come from the civil services. The exam is open to students of any stream, any medium (Hindi or English) and any money background — you only need a degree.', 'UPSC Civil Services (IAS, IPS, IFS…) needs a degree in any subject and age 21+ (relaxation as per rules). It has three stages: Prelims (objective), Mains (written) and Interview.', 'HCS (Haryana Civil Service) is run by HPSC for posts like SDM, DSP, Tehsildar and ETO. The pattern is like UPSC. Haryana’s history, geography and culture matter a lot.', 'Most IAS/IPS/HCS officers come from humanities subjects. Many are selected through self-study, without coaching.'], hi:['ज़िले के DC, SP, SDM — ये सब सिविल सेवा से आते हैं। यह परीक्षा किसी भी स्ट्रीम, किसी भी माध्यम (हिंदी/अंग्रेज़ी) और किसी भी आर्थिक पृष्ठभूमि के विद्यार्थी के लिए खुली है — केवल स्नातक होना ज़रूरी है।', 'UPSC सिविल सेवा (IAS/IPS/IFS…): पात्रता स्नातक (कोई भी विषय), आयु 21+ (छूट नियमानुसार)। तीन चरण: प्रारंभिक (वस्तुनिष्ठ) → मुख्य (लिखित) → साक्षात्कार।', 'HCS (हरियाणा सिविल सेवा): HPSC द्वारा — SDM, DSP, तहसीलदार, ETO जैसे पद; पैटर्न UPSC जैसा। हरियाणा का इतिहास-भूगोल-संस्कृति विशेष महत्त्व।', 'देश के अधिकांश IAS/IPS/HCS अधिकारी मानविकी विषयों से ही आते हैं। स्व-अध्ययन से भी चयन होते हैं।']},
  courses:{en:[['BA (History / Political Science / Geography / Economics / Sociology / Public Administration)', 'Graduation — leads to UPSC / HCS'], ['Graduation in any subject', 'Science, commerce, arts — all equally eligible']], hi:[['BA (इतिहास/राजनीति/भूगोल/अर्थशास्त्र/समाजशास्त्र/लोक-प्रशासन)', 'स्नातक — UPSC/HCS की ओर'], ['किसी भी विषय में स्नातक', 'कला, विज्ञान, वाणिज्य — सब बराबर']]},
  work:{en:['IAS, IPS, IFS (DC, SP, SDM)', 'HCS posts: SDM, DSP, Tehsildar, ETO', 'Indian Forest Service, Defence Accounts, Railway Management (IRMS), Indian Economic / Statistical Service'], hi:['IAS, IPS, IFS (DC, SP, SDM)', 'HCS पद: SDM, DSP, तहसीलदार, ETO', 'भारतीय वन सेवा (IFS), रक्षा लेखा, रेलवे प्रबंधन (IRMS), भारतीय आर्थिक/सांख्यिकी सेवा']},
  after:{en:['All these services open through a degree + UPSC'], hi:['सबका दरवाज़ा स्नातक + UPSC से खुलता है']},
  skills:{en:['NCERT (Class 6–12)', 'Newspaper editorials', 'Essay writing', 'Debating', 'Haryana GK'], hi:['NCERT (कक्षा 6–12)', 'संपादकीय पृष्ठ', 'निबंध-लेखन', 'भाषण-वाद-विवाद', 'हरियाणा सामान्य ज्ञान']},
  tips:{en:['Build the base in school, without coaching: NCERT (Class 6–12) History, Geography, Polity, Economics and Science.', 'Make reading a newspaper a daily habit — the editorial page is a must.', 'In graduation, choose the subject you enjoy. Political Science, History, Geography, Public Administration and Sociology are popular optional subjects.', 'Practise writing: one essay every week. Take part in speech and debate.', 'Free study material: PIB, Sansad TV, Rajya Sabha TV programmes and IGNOU notes.', 'Any stream is equal, the whole exam can be given in Hindi, and selection is possible through self-study.'], hi:['स्कूल से ही तैयारी की नींव (बिना कोचिंग): NCERT (कक्षा 6–12) इतिहास, भूगोल, राजनीति, अर्थशास्त्र, विज्ञान — यही आधार है।', 'रोज़ समाचार-पत्र पढ़ने की आदत — संपादकीय पृष्ठ ज़रूर।', 'स्नातक में वही विषय चुनें जिसमें रुचि हो (राजनीति विज्ञान, इतिहास, भूगोल, लोक-प्रशासन, समाजशास्त्र लोकप्रिय वैकल्पिक विषय हैं)।', 'लेखन-अभ्यास: हर हफ़्ते एक निबंध; भाषण-वाद-विवाद में भाग लें।', 'मुफ़्त सामग्री: PIB, संसद TV, राज्यसभा TV के कार्यक्रम, IGNOU नोट्स।', 'कोई भी स्ट्रीम बराबर, पूरी परीक्षा हिंदी में संभव, स्व-अध्ययन से भी चयन होते हैं।']},
  near:{en:['Haryana Public Service Commission, HPSC – HCS/HPS (hpsc.gov.in)'], hi:['हरियाणा लोक सेवा आयोग, HPSC – HCS/HPS (hpsc.gov.in)']},
  national:{en:['Union Public Service Commission, UPSC (upsc.gov.in)'], hi:['संघ लोक सेवा आयोग, UPSC (upsc.gov.in)']} },

{ id:'law', ico:'⚖️', lv:['12'], st:['any'], rs:'arts', ri:'EIS', ap:['verb','log'], cost:2, earn:5, reloc:1,
  name:{en:'Law (BA LLB / CLAT)', hi:'विधि (BA LLB / CLAT)'},

  elig:{en:'Class 12, any stream (about 45% for CLAT).', hi:'12वीं, कोई भी स्ट्रीम (CLAT हेतु ~45%)।'},

  detail:{en:['Law is open to any stream. The integrated BA-LLB / B.Com-LLB / BBA-LLB takes 5 years after Class 12; LLB takes 3 years after graduation.', 'A recent trend: doing 5-year law after Class 12 matches the UPSC/HCS syllabus, opens the door to judicial service, and keeps the advocate profession in hand.', 'In Haryana you can study at Dr. B.R. Ambedkar National Law University, Sonipat, the Institute of Law at KUK, MDU Rohtak, GJU Hisar and recognised law colleges.'], hi:['लॉ — क़ानून की पढ़ाई (any stream)। BA-LLB / B.Com-LLB / BBA-LLB (एकीकृत) 12वीं के बाद 5 वर्ष; LLB स्नातक के बाद 3 वर्ष।', '5-वर्षीय लॉ + UPSC: हाल के वर्षों का चलन — 12वीं के बाद 5-वर्षीय लॉ करने से क़ानून की पढ़ाई UPSC/HCS पाठ्यक्रम से मेल खाती है, न्यायिक सेवा का दरवाज़ा भी खुलता है, और वकालत का पेशा भी हाथ में रहता है।', 'हरियाणा में डॉ0 बी0आर0 अंबेडकर राष्ट्रीय विधि विश्वविद्यालय सोनीपत, कुरुक्षेत्र विवि (KUK) विधि संस्थान, MDU रोहतक, GJU हिसार व मान्यता-प्राप्त लॉ कॉलेज।']},
  courses:{en:[['BA-LLB / B.Com-LLB / BBA-LLB (integrated)', '5 years; Class 12 any stream (about 45% for CLAT)'], ['LLB', '3 years; after graduation'], ['LLM', '1–2 years; after LLB']], hi:[['BA-LLB / B.Com-LLB / BBA-LLB (एकीकृत)', '5 वर्ष; 12वीं कोई भी स्ट्रीम (CLAT हेतु ~45%)'], ['LLB', '3 वर्ष; स्नातक के बाद'], ['LLM', '1–2 वर्ष; LLB के बाद']]},
  work:{en:['Advocate (civil/criminal/revenue) — from district court to Supreme Court', 'Judicial service (judge): HCS (Judicial Branch) — exam after LLB', 'Legal adviser in companies, corporate law', 'APP/ADA (government prosecutor), JAG (Army’s law branch)', 'Cyber law, IPR, environmental law — new specialist fields'], hi:['वकालत (सिविल/आपराधिक/राजस्व) — ज़िला न्यायालय से सुप्रीम कोर्ट तक', 'न्यायिक सेवा (जज): HCS (न्यायिक शाखा) — LLB के बाद परीक्षा', 'कंपनियों में लीगल एडवाइज़र, कॉर्पोरेट लॉ', 'APP/ADA (सरकारी अभियोजक), JAG (सेना की विधि शाखा)', 'साइबर-लॉ, IPR, पर्यावरण-विधि — नए विशेषज्ञ क्षेत्र']},

  skills:{en:['English', 'Current affairs', 'Legal reasoning', 'Logical reasoning', 'Maths'], hi:['अंग्रेज़ी', 'करेंट अफ़ेयर्स', 'लीगल रीज़निंग', 'लॉजिकल रीज़निंग', 'गणित']},
  tips:{en:['CLAT is for the National Law Universities (NLUs); usually in December. 120 questions, 2 hours — English, current affairs, legal and logical reasoning, maths.', 'AILET is for NLU Delhi.', 'CUET / university tests for the law departments of KUK, MDU, GJU etc.', 'Choose only Bar Council of India (BCI) approved law colleges.'], hi:['CLAT — देश की राष्ट्रीय लॉ यूनिवर्सिटियों (NLU) हेतु; प्रायः दिसंबर में। 120 प्रश्न, 2 घंटे — अंग्रेज़ी, करेंट अफ़ेयर्स, लीगल व लॉजिकल रीज़निंग, गणित।', 'AILET — NLU दिल्ली हेतु।', 'CUET / विवि परीक्षाएँ — KUK, MDU, GJU आदि के लॉ विभाग।', 'केवल बार काउंसिल ऑफ़ इंडिया (BCI) से मान्यता-प्राप्त लॉ कॉलेज ही चुनें।']},
  near:{en:['Dr. B.R. Ambedkar National Law University (Sonipat)', 'Institute of Law, Kurukshetra University (Kurukshetra)', 'Maharshi Dayanand University – Law (Rohtak)', 'Guru Jambheshwar University – Law (Hisar)', 'Jindal Global Law School (Sonipat)'], hi:['डॉ0 बी0आर0 अंबेडकर राष्ट्रीय विधि विश्वविद्यालय (सोनीपत)', 'विधि संस्थान, कुरुक्षेत्र विश्वविद्यालय (कुरुक्षेत्र)', 'महर्षि दयानंद विश्वविद्यालय – विधि (रोहतक)', 'गुरु जम्भेश्वर विवि – विधि (हिसार)', 'जिंदल ग्लोबल लॉ स्कूल (सोनीपत)']},
  national:{en:['National Law School of India University, NLSIU (Bengaluru)', 'NALSAR (Hyderabad)', 'National Law University, NLU – AILET (Delhi)', 'WBNUJS (Kolkata)', 'NLU Jodhpur (Jodhpur)', 'GNLU (Gandhinagar)', 'HNLU (Raipur)', 'RMLNLU (Lucknow)', 'RGNUL (Patiala)', 'Faculty of Law, University of Delhi – after graduation (Delhi)'], hi:['राष्ट्रीय विधि विद्यालय, NLSIU (बेंगलुरु)', 'NALSAR (हैदराबाद)', 'राष्ट्रीय विधि विश्वविद्यालय, NLU – AILET (दिल्ली)', 'WBNUJS (कोलकाता)', 'NLU जोधपुर (जोधपुर)', 'GNLU (गांधीनगर)', 'HNLU (रायपुर)', 'RMLNLU (लखनऊ)', 'RGNUL (पटियाला)', 'विधि संकाय, दिल्ली विश्वविद्यालय – स्नातक के बाद (दिल्ली)']} },

  tips:{en:['Make physical training a daily habit — running is half the exam.', 'Haryana CET general knowledge asks a lot about Haryana’s history, geography and culture.', 'Ex-Agniveers get reservation in Haryana Police and 10% reservation in CAPF.', 'Players with a national-level certificate get direct recruitment in police through the sports quota.', 'Selection is only through exam and merit. Report anyone asking money for a job to the police (dial 112).'], hi:['शारीरिक तैयारी रोज़ की आदत बनाएँ — दौड़ ही आधी परीक्षा है।', 'हरियाणा CET के सामान्य ज्ञान में हरियाणा का इतिहास, भूगोल व संस्कृति विशेष रूप से पूछा जाता है।', 'पूर्व-अग्निवीरों को हरियाणा पुलिस में आरक्षण व CAPF में 10% आरक्षण।', 'राष्ट्रीय-स्तर प्रमाणपत्र वाले खिलाड़ियों की खेल कोटा से पुलिस में सीधी भर्ती।', 'चयन केवल परीक्षा/मेरिट से — पैसे माँगने वाले की शिकायत पुलिस (डायल 112) को करें।']},

{ id:'veterinary', ico:'🐄', lv:['12'], st:['pcb'], rs:'pcb', ri:'IRS', ap:['log','num'], cost:2, earn:5.5, reloc:1,

  dur:{en:'2 – 5½ years', hi:'2 – 5½ वर्ष'},
  about:{en:'Treat and care for animals as a vet, or work in dairy, poultry and fisheries. Haryana’s huge livestock sector needs trained people.', hi:'पशु-चिकित्सक बनकर पशुओं का इलाज करें या डेयरी, पोल्ट्री व मत्स्य क्षेत्र में काम करें। हरियाणा के बड़े पशुधन क्षेत्र को प्रशिक्षित लोग चाहिए।'},
  elig:{en:'Class 12 PCB with English (diplomas: Class 10 / 12).', hi:'12वीं PCB व अंग्रेज़ी (डिप्लोमा: 10वीं / 12वीं)।'},
  exams:{en:'NEET-UG (VCI 15% quota + LUVAS state seats), university tests', hi:'NEET-UG (VCI 15% कोटा + LUVAS राज्य सीटें), विवि परीक्षाएँ'},
  path:{en:['Class 12 PCB', 'NEET-UG', 'B.V.Sc & A.H. (5½ yrs)', 'Vet officer, dairy, M.V.Sc'], hi:['12वीं PCB', 'NEET-UG', 'B.V.Sc व A.H. (5½ वर्ष)', 'पशु-चिकित्सक, डेयरी, M.V.Sc']},
  links:[['LUVAS Hisar', 'https://www.luvas.edu.in'], ['NEET-UG', 'https://neet.nta.nic.in'], ['ICAR-NDRI Karnal', 'https://www.ndri.res.in'], ['Dept. of Animal Husbandry & Dairying', 'https://dahd.gov.in']],
  detail:{en:['B.V.Sc & A.H. (Bachelor of Veterinary Science and Animal Husbandry) is the degree to become a vet. It takes 5½ years, including a 6-month internship.', 'It suits students who love animals, are not afraid of hard work in villages and farms, and like biology. Related fields are dairy technology, poultry, fisheries and animal-feed science.', 'Haryana has a large buffalo and cattle population, a big milk sector and its own veterinary university, LUVAS Hisar. Vets work in government hospitals, dairies, pharma and feed companies, and research.', 'To start: prepare well for NEET-UG in Class 12. 15% seats are filled all-India by the Veterinary Council of India (VCI); LUVAS fills state seats through its own counselling. Diplomas are also available after Class 10 / 12.'], hi:['B.V.Sc व A.H. (पशु-चिकित्सा विज्ञान एवं पशुपालन स्नातक) से पशु-चिकित्सक बनते हैं। अवधि 5½ वर्ष है, जिसमें 6 माह की इंटर्नशिप शामिल है।', 'यह उन विद्यार्थियों के लिए है जिन्हें पशुओं से लगाव है, गाँव व फ़ार्म पर मेहनत से नहीं डरते और जीवविज्ञान पसंद है। डेयरी तकनीक, पोल्ट्री, मत्स्य व पशु-आहार विज्ञान इससे जुड़े क्षेत्र हैं।', 'हरियाणा में भैंस व गाय की बड़ी संख्या, बड़ा दुग्ध-क्षेत्र और अपना पशु-चिकित्सा विश्वविद्यालय LUVAS हिसार है। पशु-चिकित्सक सरकारी अस्पताल, डेयरी, दवा व पशु-आहार कंपनियों और अनुसंधान में काम करते हैं।', 'शुरुआत: 12वीं में NEET-UG की अच्छी तैयारी करें। 15% सीटें भारतीय पशु-चिकित्सा परिषद (VCI) अखिल भारतीय स्तर पर भरती है; राज्य सीटें LUVAS अपनी काउंसलिंग से भरता है। 10वीं/12वीं के बाद डिप्लोमा भी उपलब्ध हैं।']},
  courses:{en:[['B.V.Sc & A.H.', '5½ years incl. internship; NEET-UG'], ['B.Tech Dairy Technology', '4 years; ICAR / university admission'], ['B.F.Sc (Fisheries Science)', '4 years'], ['Diploma in Veterinary / Livestock Development', '2 years; LUVAS polytechnics'], ['Certificate / diploma in dairy, poultry', 'short courses; university / KVK'], ['M.V.Sc / M.Tech / Ph.D', 'after degree']], hi:[['B.V.Sc व A.H.', '5½ वर्ष इंटर्नशिप सहित; NEET-UG'], ['B.Tech डेयरी टेक्नोलॉजी', '4 वर्ष; ICAR / विवि दाख़िला'], ['B.F.Sc (मत्स्य विज्ञान)', '4 वर्ष'], ['पशु-चिकित्सा / पशुधन विकास डिप्लोमा', '2 वर्ष; LUVAS पॉलिटेक्निक'], ['डेयरी, पोल्ट्री में सर्टिफ़िकेट / डिप्लोमा', 'अल्पकालिक; विवि / KVK'], ['M.V.Sc / M.Tech / Ph.D', 'डिग्री के बाद']]},

  tips:{en:['Take NEET-UG seriously — B.V.Sc admission in LUVAS and VCI-quota colleges is through NEET scores.', 'Choose only colleges recognised by the Veterinary Council of India (VCI).', 'Visit a government veterinary hospital or a dairy farm before deciding — the work is hands-on.', 'Girls are doing very well as vets; many work in hospitals, research and teaching.', 'Scholarships: NSP (scholarships.gov.in) and Haryana post-matric scholarship (saralharyana.gov.in). Anyone asking money for a seat is a fraud.'], hi:['NEET-UG को गंभीरता से लें — LUVAS व VCI-कोटा कॉलेजों में B.V.Sc दाख़िला NEET अंकों से होता है।', 'केवल भारतीय पशु-चिकित्सा परिषद (VCI) से मान्यता-प्राप्त कॉलेज ही चुनें।', 'निर्णय से पहले किसी सरकारी पशु-अस्पताल या डेयरी फ़ार्म पर जाएँ — यह हाथों से किया जाने वाला काम है।', 'बेटियाँ पशु-चिकित्सक के रूप में बहुत आगे हैं; अस्पताल, अनुसंधान व अध्यापन में कार्यरत हैं।', 'छात्रवृत्ति: NSP (scholarships.gov.in) व हरियाणा पोस्ट-मैट्रिक छात्रवृत्ति (saralharyana.gov.in)। सीट दिलाने के नाम पर पैसे माँगने वाला ठग है।']} },

  about:{en:'Health careers beyond MBBS: physiotherapist, optometrist, dietitian, occupational therapist or audiologist. Growing demand in hospitals and sports.', hi:'MBBS के अलावा स्वास्थ्य करियर: फ़िज़ियोथेरेपिस्ट, ऑप्टोमेट्रिस्ट, डायटीशियन, ऑक्यूपेशनल थेरेपिस्ट या ऑडियोलॉजिस्ट। अस्पताल व खेल में बढ़ती माँग।'},
  elig:{en:'Class 12 PCB (some courses accept PCM / Home Science).', hi:'12वीं PCB (कुछ कोर्स PCM / गृह विज्ञान भी लेते हैं)।'},

  path:{en:['Class 12 PCB', 'NEET / CUET / state counselling', 'BPT / B.Optom / B.Sc Nutrition', 'Hospital, clinic, master’s'], hi:['12वीं PCB', 'NEET / CUET / राज्य काउंसलिंग', 'BPT / B.Optom / B.Sc पोषण', 'अस्पताल, क्लिनिक, मास्टर्स']},
  links:[['DMER Haryana', 'https://dmer.haryana.gov.in'], ['AIIMS Exams', 'https://www.aiimsexams.ac.in'], ['Rehabilitation Council of India', 'https://rehabcouncil.nic.in'], ['CUET-UG', 'https://cuet.nta.nic.in']],
  detail:{en:['These are allied health degrees. A physiotherapist helps patients recover movement through exercise; an optometrist tests eyes and fits glasses or lenses; a dietitian plans healthy diets; occupational therapists and audiologists help people with disability, speech or hearing problems.', 'They suit students who like biology, want to help people every day and are patient. These are good options if you do not get an MBBS seat.', 'Demand is rising with sports, ageing population, lifestyle diseases and eye problems. In Haryana, sports physiotherapy has special scope. These professions are now regulated nationally by the NCAHP (National Commission for Allied and Healthcare Professions); audiology and speech therapy by the RCI.', 'To start: take Class 12 PCB, appear in NEET-UG and CUET-UG, and follow DMER Haryana and university admission notices.'], hi:['ये एलाइड हेल्थ डिग्रियाँ हैं। फ़िज़ियोथेरेपिस्ट व्यायाम से मरीज़ की गतिशीलता लौटाता है; ऑप्टोमेट्रिस्ट आँखों की जाँच कर चश्मा/लेंस देता है; डायटीशियन स्वस्थ आहार की योजना बनाता है; ऑक्यूपेशनल थेरेपिस्ट व ऑडियोलॉजिस्ट दिव्यांगता, बोलने या सुनने की समस्या में मदद करते हैं।', 'यह जीवविज्ञान में रुचि रखने वाले, रोज़ लोगों की मदद करना चाहने वाले व धैर्यवान विद्यार्थियों के लिए है। MBBS सीट न मिले तो ये अच्छे विकल्प हैं।', 'खेल, बढ़ती उम्र की आबादी, जीवनशैली रोग व आँखों की समस्याओं से माँग बढ़ रही है। हरियाणा में स्पोर्ट्स फ़िज़ियोथेरेपी की विशेष संभावना है। अब ये पेशे राष्ट्रीय स्तर पर NCAHP (राष्ट्रीय सहबद्ध एवं स्वास्थ्य देखभाल वृत्ति आयोग) से नियंत्रित हैं; ऑडियोलॉजी व स्पीच थेरेपी RCI से।', 'शुरुआत: 12वीं PCB लें, NEET-UG व CUET-UG दें और DMER हरियाणा व विश्वविद्यालयों की दाख़िला सूचनाएँ देखते रहें।']},
  courses:{en:[['BPT (Physiotherapy)', '4½ years incl. internship'], ['B.Optom (Optometry)', '4 years incl. internship'], ['B.Sc Nutrition & Dietetics / Food & Nutrition', '3 – 4 years'], ['BOT (Occupational Therapy)', '4½ years incl. internship'], ['BASLP (Audiology & Speech-Language Pathology)', '4 years incl. internship; RCI'], ['MPT / M.Optom / M.Sc Nutrition', '2 years; after degree']], hi:[['BPT (फ़िज़ियोथेरेपी)', '4½ वर्ष इंटर्नशिप सहित'], ['B.Optom (ऑप्टोमेट्री)', '4 वर्ष इंटर्नशिप सहित'], ['B.Sc पोषण एवं आहार विज्ञान / फ़ूड व न्यूट्रिशन', '3 – 4 वर्ष'], ['BOT (ऑक्यूपेशनल थेरेपी)', '4½ वर्ष इंटर्नशिप सहित'], ['BASLP (ऑडियोलॉजी व स्पीच-लैंग्वेज पैथोलॉजी)', '4 वर्ष इंटर्नशिप सहित; RCI'], ['MPT / M.Optom / M.Sc पोषण', '2 वर्ष; डिग्री के बाद']]},
  work:{en:['Physiotherapist in hospitals and rehab centres', 'Sports physio with teams, academies and SAI centres', 'Optometrist in eye hospitals and optical chains', 'Dietitian in hospitals, gyms, schools and food companies', 'Occupational therapist in special schools and rehab centres', 'Audiologist / speech therapist in ENT clinics', 'Own clinic or home-visit practice'], hi:['अस्पताल व पुनर्वास केंद्रों में फ़िज़ियोथेरेपिस्ट', 'टीमों, अकादमियों व SAI केंद्रों में स्पोर्ट्स फ़िज़ियो', 'नेत्र अस्पतालों व ऑप्टिकल चेन में ऑप्टोमेट्रिस्ट', 'अस्पताल, जिम, स्कूल व फ़ूड कंपनियों में डायटीशियन', 'विशेष स्कूलों व पुनर्वास केंद्रों में ऑक्यूपेशनल थेरेपिस्ट', 'ENT क्लिनिकों में ऑडियोलॉजिस्ट / स्पीच थेरेपिस्ट', 'अपना क्लिनिक या घर जाकर सेवा']},
