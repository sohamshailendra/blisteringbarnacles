  tips:{en:['Admission routes differ by institute — some use NEET-UG, some CUET-UG, some their own test. Read each prospectus.', 'Choose recognised institutes; check NCAHP / state council updates, and RCI approval for audiology and speech courses.', 'Avoid short “physio” or “dietitian” certificates from unknown institutes — they do not make you a registered professional.', 'Very good options for girls — clinics, schools and hospitals need many women therapists and dietitians.', 'Scholarships: NSP (scholarships.gov.in) and Haryana post-matric scholarship (saralharyana.gov.in).'], hi:['दाख़िले का तरीका संस्थान अनुसार अलग है — कहीं NEET-UG, कहीं CUET-UG, कहीं अपनी परीक्षा। हर विवरणिका पढ़ें।', 'मान्यता-प्राप्त संस्थान ही चुनें; NCAHP / राज्य परिषद की सूचना देखें, और ऑडियोलॉजी व स्पीच कोर्स के लिए RCI मान्यता जाँचें।', 'अनजान संस्थानों के छोटे “फ़िज़ियो” या “डायटीशियन” सर्टिफ़िकेट से बचें — इनसे पंजीकृत पेशेवर नहीं बनते।', 'बेटियों के लिए बहुत अच्छे विकल्प — क्लिनिक, स्कूल व अस्पतालों को महिला थेरेपिस्ट व डायटीशियन चाहिए।', 'छात्रवृत्ति: NSP (scholarships.gov.in) व हरियाणा पोस्ट-मैट्रिक छात्रवृत्ति (saralharyana.gov.in)।']} },
{ id:'biotech-forensic', ico:'🧫', lv:['12'], st:['pcb','pcm'], rs:'pcb', ri:'IRC', ap:['log','num'], cost:2, earn:4, reloc:1,
  name:{en:'Biotechnology & Forensic Science', hi:'जैव-प्रौद्योगिकी व फ़ोरेंसिक विज्ञान'},
  dur:{en:'3 – 4 years', hi:'3 – 4 वर्ष'},
  about:{en:'Use biology in labs: make vaccines, medicines and better crops, or examine crime-scene evidence like DNA and fingerprints for police and courts.', hi:'प्रयोगशाला में जीवविज्ञान का उपयोग: टीके, दवाएँ व बेहतर फ़सलें बनाना, या पुलिस व अदालत के लिए DNA, फ़िंगरप्रिंट जैसे अपराध-साक्ष्य की जाँच।'},
  elig:{en:'Class 12 PCB or PCM (B.Tech Biotech: PCM / PCB as per institute).', hi:'12वीं PCB या PCM (B.Tech बायोटेक: संस्थान अनुसार PCM / PCB)।'},
  exams:{en:'CUET-UG, JEE Main + HSTES (B.Tech), NFSU entrance, university tests', hi:'CUET-UG, JEE Main + HSTES (B.Tech), NFSU प्रवेश-परीक्षा, विवि परीक्षाएँ'},
  path:{en:['Class 12 PCB / PCM', 'CUET / JEE Main / NFSU test', 'B.Sc / B.Tech (3 – 4 yrs)', 'M.Sc, lab jobs, FSL, research'], hi:['12वीं PCB / PCM', 'CUET / JEE Main / NFSU परीक्षा', 'B.Sc / B.Tech (3 – 4 वर्ष)', 'M.Sc, लैब नौकरी, FSL, शोध']},
  links:[['National Forensic Sciences University', 'https://www.nfsu.ac.in'], ['Department of Biotechnology (GoI)', 'https://dbtindia.gov.in'], ['HSTES Haryana', 'https://hstes.org.in']],
  detail:{en:['Biotechnology uses living cells to make useful products — vaccines, medicines, enzymes, better seeds. Microbiology studies bacteria and viruses. Forensic science uses chemistry and biology to solve crimes through DNA, blood, fingerprints and documents.', 'These fields suit curious students who enjoy lab work, careful observation and science. Forensic science needs a calm mind and honesty.', 'Pharma, vaccine, food and diagnostic companies need biotech graduates. Haryana has its own Forensic Science Laboratory at Madhuban (Karnal), and forensic experts are needed more after new criminal laws made forensic evidence compulsory in serious cases.', 'To start: choose PCB or PCM in Class 11. B.Sc admission is mostly through CUET-UG or university merit; B.Tech through JEE Main and HSTES counselling. Plan for an M.Sc — most good lab jobs need it.'], hi:['जैव-प्रौद्योगिकी जीवित कोशिकाओं से उपयोगी उत्पाद बनाती है — टीके, दवाएँ, एंज़ाइम, बेहतर बीज। माइक्रोबायोलॉजी बैक्टीरिया व वायरस का अध्ययन है। फ़ोरेंसिक विज्ञान DNA, रक्त, फ़िंगरप्रिंट व दस्तावेज़ों की जाँच से अपराध सुलझाता है।', 'ये क्षेत्र जिज्ञासु, लैब-कार्य व बारीकी से अवलोकन पसंद करने वाले विद्यार्थियों के लिए हैं। फ़ोरेंसिक में शांत मन व ईमानदारी ज़रूरी है।', 'दवा, टीका, खाद्य व जाँच (डायग्नॉस्टिक) कंपनियों को बायोटेक स्नातक चाहिए। हरियाणा की अपनी फ़ोरेंसिक विज्ञान प्रयोगशाला मधुबन (करनाल) में है; नए आपराधिक क़ानूनों में गंभीर मामलों में फ़ोरेंसिक जाँच अनिवार्य होने से विशेषज्ञों की माँग बढ़ी है।', 'शुरुआत: 11वीं में PCB या PCM लें। B.Sc दाख़िला प्रायः CUET-UG या विवि मेरिट से; B.Tech JEE Main व HSTES काउंसलिंग से। M.Sc की योजना रखें — अधिकतर अच्छी लैब नौकरियों में यह चाहिए।']},

  work:{en:['Scientific assistant / officer in State and Central Forensic Science Labs', 'Crime-scene and fingerprint expert with police', 'Research assistant in pharma and vaccine companies', 'Quality control in food, dairy and drug industries', 'Diagnostic and pathology labs', 'Research projects in ICAR, CSIR and ICMR institutes', 'Cyber and document examination (with extra training)'], hi:['राज्य व केंद्रीय फ़ोरेंसिक लैब में वैज्ञानिक सहायक / अधिकारी', 'पुलिस के साथ क्राइम-सीन व फ़िंगरप्रिंट विशेषज्ञ', 'दवा व टीका कंपनियों में रिसर्च असिस्टेंट', 'खाद्य, डेयरी व दवा उद्योग में गुणवत्ता नियंत्रण', 'डायग्नॉस्टिक व पैथोलॉजी लैब', 'ICAR, CSIR व ICMR संस्थानों की शोध परियोजनाएँ', 'साइबर व दस्तावेज़ जाँच (अतिरिक्त प्रशिक्षण के साथ)']},

  tips:{en:['A B.Sc alone gives limited jobs — plan for M.Sc, and prepare for IIT JAM, GAT-B or CUET-PG in your final year.', 'Forensic science is not like TV crime shows — it is careful lab work and court reports. Visit FSL Madhuban on an open day if possible.', 'Check UGC / AICTE recognition before joining any private college; avoid unknown “forensic diploma” institutes.', 'Learn basic computers and data handling — bioinformatics and digital forensics are growing fast.', 'Girls are well represented in labs and research. Look for DST INSPIRE (online-inspire.gov.in) and NSP scholarships.'], hi:['केवल B.Sc से सीमित नौकरियाँ हैं — M.Sc की योजना रखें और अंतिम वर्ष में IIT JAM, GAT-B या CUET-PG की तैयारी करें।', 'फ़ोरेंसिक विज्ञान टीवी क्राइम-शो जैसा नहीं — यह सावधानी भरा लैब-कार्य व अदालत की रिपोर्ट है। संभव हो तो FSL मधुबन देखने जाएँ।', 'किसी भी निजी कॉलेज में जाने से पहले UGC / AICTE मान्यता जाँचें; अनजान “फ़ोरेंसिक डिप्लोमा” संस्थानों से बचें।', 'बेसिक कंप्यूटर व डेटा सीखें — बायोइन्फ़ॉर्मेटिक्स व डिजिटल फ़ोरेंसिक तेज़ी से बढ़ रहे हैं।', 'लैब व शोध में बेटियाँ आगे हैं। DST INSPIRE (online-inspire.gov.in) व NSP छात्रवृत्तियाँ देखें।']} },
{ id:'economics-stats', ico:'📊', lv:['12'], st:['commerce','arts','pcm'], rs:'commerce', ri:'ICE', ap:['num','log'], cost:2, earn:4, reloc:1,
  name:{en:'Economics, Statistics & Actuarial Science', hi:'अर्थशास्त्र, सांख्यिकी व एक्चुरियल साइंस'},
  dur:{en:'3 – 4 years', hi:'3 – 4 वर्ष'},
  about:{en:'Work with numbers and data to understand prices, jobs, risk and government policy. Leads to banks, insurance, research and IES / ISS services.', hi:'आँकड़ों से क़ीमतें, रोज़गार, जोखिम व सरकारी नीति समझें। बैंक, बीमा, शोध और IES / ISS सेवाओं तक रास्ता।'},

  exams:{en:'CUET-UG, ISI Admission Test (B.Stat), IAI ACET, UPSC IES / ISS', hi:'CUET-UG, ISI प्रवेश परीक्षा (B.Stat), IAI ACET, UPSC IES / ISS'},
  path:{en:['Class 12 (Maths preferred)', 'CUET / ISI test / university', 'BA / B.Sc Economics or Stats', 'MA / M.Stat, IES / ISS, actuary'], hi:['12वीं (गणित बेहतर)', 'CUET / ISI परीक्षा / विवि', 'BA / B.Sc अर्थशास्त्र या सांख्यिकी', 'MA / M.Stat, IES / ISS, एक्चुअरी']},
  links:[['Indian Statistical Institute', 'https://www.isical.ac.in'], ['Institute of Actuaries of India', 'https://www.actuariesindia.org'], ['UPSC', 'https://upsc.gov.in'], ['Ministry of Statistics (MoSPI)', 'https://mospi.gov.in']],
  detail:{en:['Economics studies how people, businesses and governments use money and resources. Statistics is the science of collecting and reading data. Actuaries use maths and statistics to measure risk for insurance and pension companies.', 'These fields suit students who like Maths, reasoning and current affairs. Commerce, arts and science students can all take economics; statistics and actuarial science need good Maths.', 'Economics with statistics and data skills (Excel, Python) is among the most in-demand combinations today — in banks, RBI, NITI Aayog, research bodies, data companies and government statistics offices.', 'To start: keep Maths in Class 11–12 if possible. Take CUET-UG for central and state universities, the ISI Admission Test for B.Stat (Hons), and the Actuarial Common Entrance Test (ACET) to begin actuarial exams.'], hi:['अर्थशास्त्र बताता है कि लोग, व्यवसाय व सरकार पैसे व संसाधनों का उपयोग कैसे करते हैं। सांख्यिकी आँकड़े इकट्ठा करने व समझने का विज्ञान है। एक्चुअरी गणित व सांख्यिकी से बीमा व पेंशन कंपनियों के लिए जोखिम मापते हैं।', 'ये क्षेत्र गणित, तर्क व करेंट अफ़ेयर्स पसंद करने वाले विद्यार्थियों के लिए हैं। वाणिज्य, कला व विज्ञान — सभी अर्थशास्त्र ले सकते हैं; सांख्यिकी व एक्चुरियल के लिए गणित अच्छा होना चाहिए।', 'अर्थशास्त्र + सांख्यिकी + डेटा कौशल (एक्सेल, पायथन) आज के सबसे माँग वाले संयोजनों में है — बैंक, RBI, नीति आयोग, शोध संस्थान, डेटा कंपनियाँ व सरकारी सांख्यिकी कार्यालय।', 'शुरुआत: हो सके तो 11वीं–12वीं में गणित रखें। केंद्रीय व राज्य विश्वविद्यालयों के लिए CUET-UG, B.Stat (ऑनर्स) के लिए ISI प्रवेश परीक्षा और एक्चुरियल परीक्षाएँ शुरू करने के लिए ACET दें।']},
  courses:{en:[['BA / B.Sc (Hons) Economics', '3 – 4 years'], ['B.Stat (Hons)', '3 years; ISI Kolkata'], ['B.Sc Statistics / Maths with Statistics', '3 – 4 years'], ['BS Economic Sciences', '4 years; IIT Kanpur via JEE Advanced'], ['Actuarial exams (IAI)', 'after ACET; papers taken step by step'], ['MA Economics / M.Sc Statistics / M.Stat', '2 years; after degree']], hi:[['BA / B.Sc (ऑनर्स) अर्थशास्त्र', '3 – 4 वर्ष'], ['B.Stat (ऑनर्स)', '3 वर्ष; ISI कोलकाता'], ['B.Sc सांख्यिकी / गणित सहित सांख्यिकी', '3 – 4 वर्ष'], ['BS इकोनॉमिक साइंसेज़', '4 वर्ष; IIT कानपुर, JEE Advanced से'], ['एक्चुरियल परीक्षाएँ (IAI)', 'ACET के बाद; पेपर चरणबद्ध'], ['MA अर्थशास्त्र / M.Sc सांख्यिकी / M.Stat', '2 वर्ष; डिग्री के बाद']]},
  work:{en:['Indian Economic Service / Indian Statistical Service officer (UPSC)', 'RBI Grade B and bank officer', 'Statistical officer in MoSPI / state statistics dept (via SSC / HPSC)', 'Actuary in insurance and pension companies', 'Data / policy / research analyst', 'Economist in research institutes and NITI Aayog', 'Lecturer in economics or statistics'], hi:['भारतीय आर्थिक सेवा / भारतीय सांख्यिकी सेवा अधिकारी (UPSC)', 'RBI ग्रेड-B व बैंक अधिकारी', 'MoSPI / राज्य सांख्यिकी विभाग में सांख्यिकी अधिकारी (SSC / HPSC से)', 'बीमा व पेंशन कंपनियों में एक्चुअरी', 'डेटा / नीति / रिसर्च एनालिस्ट', 'शोध संस्थानों व नीति आयोग में अर्थशास्त्री', 'अर्थशास्त्र या सांख्यिकी के प्राध्यापक']},
  after:{en:['MA / M.Sc via CUET-PG, Delhi School of Economics, ISI M.Stat', 'UPSC IES / ISS after postgraduation', 'Complete IAI papers to become a Fellow Actuary', 'UGC-NET for lectureship; civil services (economics helps)'], hi:['CUET-PG, दिल्ली स्कूल ऑफ़ इकोनॉमिक्स, ISI M.Stat से MA / M.Sc', 'स्नातकोत्तर के बाद UPSC IES / ISS', 'IAI पेपर पूरे कर फ़ेलो एक्चुअरी बनें', 'प्राध्यापक हेतु UGC-NET; सिविल सेवा (अर्थशास्त्र मददगार)']},
  skills:{en:['Maths', 'Data & Excel', 'Logical thinking', 'Current affairs', 'English writing'], hi:['गणित', 'डेटा व एक्सेल', 'तार्किक सोच', 'करेंट अफ़ेयर्स', 'अंग्रेज़ी लेखन']},
  near:{en:['Kurukshetra University (Kurukshetra)', 'Maharshi Dayanand University (Rohtak)', 'CCS Haryana Agricultural University – Statistics (Hisar)', 'Chaudhary Devi Lal University (Sirsa)', 'Central University of Haryana (Mahendragarh)', 'Ashoka University (Sonipat)', 'Government colleges – BA Economics (most districts)'], hi:['कुरुक्षेत्र विश्वविद्यालय (कुरुक्षेत्र)', 'महर्षि दयानंद विश्वविद्यालय (रोहतक)', 'चौ0 चरण सिंह हरियाणा कृषि विवि – सांख्यिकी (हिसार)', 'चौ0 देवीलाल विश्वविद्यालय (सिरसा)', 'केंद्रीय विश्वविद्यालय हरियाणा (महेंद्रगढ़)', 'अशोका विश्वविद्यालय (सोनीपत)', 'राजकीय महाविद्यालय – BA अर्थशास्त्र (अधिकांश ज़िले)']},
  national:{en:['Indian Statistical Institute, ISI (Kolkata)', 'Delhi School of Economics – MA (Delhi)', 'Shri Ram College of Commerce, SRCC (Delhi)', 'St. Stephen’s College (Delhi)', 'Lady Shri Ram College for Women (Delhi)', 'IIT Kanpur – BS Economic Sciences (Kanpur)', 'Gokhale Institute of Politics & Economics (Pune)', 'Madras School of Economics (Chennai)'], hi:['भारतीय सांख्यिकी संस्थान, ISI (कोलकाता)', 'दिल्ली स्कूल ऑफ़ इकोनॉमिक्स – MA (दिल्ली)', 'श्रीराम कॉलेज ऑफ़ कॉमर्स, SRCC (दिल्ली)', 'सेंट स्टीफ़न्स कॉलेज (दिल्ली)', 'लेडी श्रीराम कॉलेज (छात्राओं हेतु) (दिल्ली)', 'IIT कानपुर – BS इकोनॉमिक साइंसेज़ (कानपुर)', 'गोखले राजनीति एवं अर्थशास्त्र संस्थान (पुणे)', 'मद्रास स्कूल ऑफ़ इकोनॉमिक्स (चेन्नई)']},
  tips:{en:['Keep Maths in Class 11–12 if you can — top economics colleges and all statistics/actuarial routes need it.', 'The ISI Admission Test for B.Stat is usually held in May; forms come out early in the year. Check isical.ac.in.', 'ACET (actuarial entrance) can be taken after Class 12; register only on actuariesindia.org.', 'Learn Excel and basic Python free (SWAYAM / NPTEL) — data skills greatly improve jobs.', 'Scholarships: NSP (scholarships.gov.in), Haryana post-matric scholarship (saralharyana.gov.in); ISI students get a monthly stipend — check the prospectus.'], hi:['हो सके तो 11वीं–12वीं में गणित रखें — शीर्ष अर्थशास्त्र कॉलेज व सभी सांख्यिकी/एक्चुरियल रास्तों में यह चाहिए।', 'B.Stat के लिए ISI प्रवेश परीक्षा प्रायः मई में होती है; फ़ॉर्म वर्ष की शुरुआत में आते हैं। isical.ac.in देखें।', 'ACET (एक्चुरियल प्रवेश) 12वीं के बाद दी जा सकती है; पंजीकरण केवल actuariesindia.org पर करें।', 'एक्सेल व बेसिक पायथन मुफ़्त सीखें (SWAYAM / NPTEL) — डेटा कौशल से नौकरियाँ बहुत बेहतर होती हैं।', 'छात्रवृत्ति: NSP (scholarships.gov.in), हरियाणा पोस्ट-मैट्रिक छात्रवृत्ति (saralharyana.gov.in); ISI विद्यार्थियों को मासिक वज़ीफ़ा मिलता है — विवरणिका देखें।']} },
{ id:'aviation', ico:'✈️', lv:['12'], st:['any'], rs:'pcm', ri:'RES', ap:['spa','num'], cost:3, earn:2, reloc:1,
  name:{en:'Aviation (Pilot, Aircraft Maintenance, Cabin Crew, Airport Jobs)', hi:'विमानन (पायलट, विमान रखरखाव, केबिन क्रू, एयरपोर्ट जॉब्स)'},
  dur:{en:'6 months – 3 years', hi:'6 महीने – 3 वर्ष'},
  about:{en:'Fly planes, keep aircraft safe, serve passengers or run airport operations. Pilot and AME licences are given by DGCA.', hi:'विमान उड़ाना, विमानों को सुरक्षित रखना, यात्रियों की सेवा या एयरपोर्ट संचालन। पायलट व AME लाइसेंस DGCA देता है।'},
  elig:{en:'Class 12 PCM for pilot / AME; Class 12 any stream for cabin crew & ground jobs.', hi:'पायलट / AME हेतु 12वीं PCM; केबिन क्रू व ग्राउंड जॉब हेतु 12वीं कोई भी स्ट्रीम।'},
  exams:{en:'DGCA medical & CPL exams, IGRUA entrance, DGCA AME modules, airline selection', hi:'DGCA मेडिकल व CPL परीक्षाएँ, IGRUA प्रवेश, DGCA AME मॉड्यूल, एयरलाइन चयन'},
  path:{en:['Class 12 (PCM for pilot / AME)', 'DGCA medical / institute entrance', 'Flying school / AME / crew course', 'Licence → airline, MRO, airport'], hi:['12वीं (पायलट / AME हेतु PCM)', 'DGCA मेडिकल / संस्थान प्रवेश', 'फ़्लाइंग स्कूल / AME / क्रू कोर्स', 'लाइसेंस → एयरलाइन, MRO, एयरपोर्ट']},
  links:[['DGCA (Directorate General of Civil Aviation)', 'https://www.dgca.gov.in'], ['IGRUA', 'https://www.igrua.gov.in'], ['Airports Authority of India', 'https://www.aai.aero']],
  detail:{en:['Aviation has four main doors. Pilot: earn a Commercial Pilot Licence (CPL) from DGCA after medical tests, ground classes and about 200 hours of flying. Aircraft Maintenance Engineer (AME): study at a DGCA-approved institute and get a B1 (mechanical) or B2 (avionics) licence. Cabin crew and airport / ground jobs: short courses and airline selection.', 'It suits students who are calm, disciplined, fit and good at English. Pilots and AMEs need Class 12 with Physics and Maths; cabin crew and ground staff can come from any stream. Pilot training is costly, so plan the money and check scholarships before you start.', 'India’s air traffic and airline fleets are growing fast, so airlines, maintenance (MRO) companies and airports need trained people. Delhi airport is next door for Haryana students, and Hisar airport is being developed. The Haryana Institute of Civil Aviation runs flying training at Karnal, Pinjore and Hisar.', 'To start: for pilot, first clear the DGCA Class 2 medical, then join a DGCA-approved flying school. For AME, choose only a DGCA-approved (CAR-147) institute. For cabin crew, work on English, grooming and fitness and apply directly when airlines announce openings.'], hi:['विमानन में चार मुख्य रास्ते हैं। पायलट: मेडिकल, ग्राउंड क्लास और लगभग 200 घंटे की उड़ान के बाद DGCA से कमर्शियल पायलट लाइसेंस (CPL)। विमान रखरखाव इंजीनियर (AME): DGCA-अनुमोदित संस्थान से पढ़ाई कर B1 (मैकेनिकल) या B2 (एवियोनिक्स) लाइसेंस। केबिन क्रू व एयरपोर्ट / ग्राउंड जॉब: छोटे कोर्स और एयरलाइन चयन।', 'यह क्षेत्र उन विद्यार्थियों के लिए है जो शांत, अनुशासित, फ़िट और अंग्रेज़ी में अच्छे हों। पायलट व AME हेतु 12वीं में भौतिकी व गणित ज़रूरी; केबिन क्रू व ग्राउंड स्टाफ़ किसी भी स्ट्रीम से। पायलट ट्रेनिंग महँगी है, इसलिए शुरू करने से पहले पैसों की योजना बनाएँ और छात्रवृत्ति देखें।', 'भारत में हवाई यात्री और विमान तेज़ी से बढ़ रहे हैं, इसलिए एयरलाइनों, रखरखाव (MRO) कंपनियों और एयरपोर्ट को प्रशिक्षित लोगों की ज़रूरत है। हरियाणा के विद्यार्थियों के लिए दिल्ली एयरपोर्ट पास है और हिसार एयरपोर्ट विकसित हो रहा है। हरियाणा नागरिक उड्डयन संस्थान करनाल, पिंजौर व हिसार में उड़ान प्रशिक्षण देता है।', 'शुरुआत: पायलट हेतु पहले DGCA क्लास 2 मेडिकल पास करें, फिर DGCA-अनुमोदित फ़्लाइंग स्कूल में दाख़िला लें। AME हेतु केवल DGCA-अनुमोदित (CAR-147) संस्थान चुनें। केबिन क्रू हेतु अंग्रेज़ी, ग्रूमिंग व फ़िटनेस पर काम करें और एयरलाइन भर्ती निकलने पर सीधे आवेदन करें।']},
  courses:{en:[['Commercial Pilot Licence (CPL)', 'About 18 months – 2 years; Class 12 PCM, DGCA Class 1 medical'], ['Aircraft Maintenance Engineering – B1 / B2 licence', 'About 2 – 3 years training + DGCA exams; Class 12 PCM'], ['B.Sc Aviation / B.Sc Aeronautics', '3 years; Class 12 PCM (offered with some flying schools)'], ['Cabin crew / air hostess training', '6 months – 1 year; Class 12 any stream'], ['Diploma / BBA in Aviation or Airport Management', '1 – 3 years; Class 12 any stream'], ['Aeronautical / Aerospace Engineering (B.Tech)', '4 years; Class 12 PCM, JEE Main / JEE Advanced']], hi:[['कमर्शियल पायलट लाइसेंस (CPL)', 'लगभग 18 महीने – 2 वर्ष; 12वीं PCM, DGCA क्लास 1 मेडिकल'], ['विमान रखरखाव इंजीनियरिंग – B1 / B2 लाइसेंस', 'लगभग 2 – 3 वर्ष प्रशिक्षण + DGCA परीक्षाएँ; 12वीं PCM'], ['B.Sc एविएशन / B.Sc एरोनॉटिक्स', '3 वर्ष; 12वीं PCM (कुछ फ़्लाइंग स्कूलों के साथ)'], ['केबिन क्रू / एयर होस्टेस प्रशिक्षण', '6 महीने – 1 वर्ष; 12वीं कोई भी स्ट्रीम'], ['एविएशन या एयरपोर्ट मैनेजमेंट में डिप्लोमा / BBA', '1 – 3 वर्ष; 12वीं कोई भी स्ट्रीम'], ['एरोनॉटिकल / एयरोस्पेस इंजीनियरिंग (B.Tech)', '4 वर्ष; 12वीं PCM, JEE Main / JEE Advanced']]},
  work:{en:['Commercial pilot / first officer with airlines', 'Licensed aircraft maintenance engineer (B1 / B2) at airlines and MROs', 'Cabin crew / flight attendant', 'Airport ground staff – check-in, ramp, cargo, customer service', 'Flight dispatcher / airline operations', 'Flying instructor at flying clubs', 'Air Force / Navy flying branch (through NDA / AFCAT)'], hi:['एयरलाइन में कमर्शियल पायलट / फ़र्स्ट ऑफ़िसर', 'एयरलाइन व MRO में लाइसेंस-प्राप्त विमान रखरखाव इंजीनियर (B1 / B2)', 'केबिन क्रू / फ़्लाइट अटेंडेंट', 'एयरपोर्ट ग्राउंड स्टाफ़ – चेक-इन, रैंप, कार्गो, ग्राहक सेवा', 'फ़्लाइट डिस्पैचर / एयरलाइन ऑपरेशंस', 'फ़्लाइंग क्लब में फ़्लाइंग इंस्ट्रक्टर', 'वायुसेना / नौसेना की फ़्लाइंग शाखा (NDA / AFCAT से)']},
  after:{en:['Type rating on an aircraft → captain, then ATPL', 'AME: add more aircraft types and licence categories', 'Cabin crew → senior crew, trainer, in-flight manager', 'MBA in Aviation / Airport Management', 'AAI Junior Executive (ATC) after a B.Sc / B.Tech (check the official notification)'], hi:['किसी विमान पर टाइप रेटिंग → कैप्टन, फिर ATPL', 'AME: और विमान टाइप व लाइसेंस श्रेणियाँ जोड़ें', 'केबिन क्रू → सीनियर क्रू, ट्रेनर, इन-फ़्लाइट मैनेजर', 'एविएशन / एयरपोर्ट मैनेजमेंट में MBA', 'B.Sc / B.Tech के बाद AAI जूनियर एग्ज़िक्यूटिव (ATC) (आधिकारिक अधिसूचना देखें)']},
  skills:{en:['Physics & Maths', 'Good English', 'Calm under pressure', 'Physical fitness', 'Teamwork'], hi:['भौतिकी व गणित', 'अच्छी अंग्रेज़ी', 'दबाव में शांत', 'शारीरिक फ़िटनेस', 'टीमवर्क']},
  near:{en:['Haryana Institute of Civil Aviation – flying training (Karnal)', 'Haryana Institute of Civil Aviation – flying training (Panchkula, Pinjore)', 'Haryana Institute of Civil Aviation – flying training (Hisar)', 'Check DGCA’s list of approved AME institutes and flying schools on dgca.gov.in'], hi:['हरियाणा नागरिक उड्डयन संस्थान – उड़ान प्रशिक्षण (करनाल)', 'हरियाणा नागरिक उड्डयन संस्थान – उड़ान प्रशिक्षण (पंचकूला, पिंजौर)', 'हरियाणा नागरिक उड्डयन संस्थान – उड़ान प्रशिक्षण (हिसार)', 'DGCA-अनुमोदित AME संस्थान व फ़्लाइंग स्कूलों की सूची dgca.gov.in पर देखें']},
  national:{en:['Indira Gandhi Rashtriya Uran Akademi, IGRUA (Fursatganj, Amethi)', 'National Flying Training Institute (Gondia)', 'Rajiv Gandhi National Aviation University (Fursatganj, Amethi)', 'Banasthali Vidyapith – flying training for women (Banasthali, Rajasthan)', 'Bombay Flying Club (Mumbai)', 'IIT Bombay – Aerospace Engineering (Mumbai)'], hi:['इंदिरा गांधी राष्ट्रीय उड़ान अकादमी, IGRUA (फ़ुरसतगंज, अमेठी)', 'नेशनल फ़्लाइंग ट्रेनिंग इंस्टीट्यूट (गोंदिया)', 'राजीव गांधी राष्ट्रीय विमानन विश्वविद्यालय (फ़ुरसतगंज, अमेठी)', 'बनस्थली विद्यापीठ – महिलाओं हेतु उड़ान प्रशिक्षण (बनस्थली, राजस्थान)', 'बॉम्बे फ़्लाइंग क्लब (मुंबई)', 'IIT बॉम्बे – एयरोस्पेस इंजीनियरिंग (मुंबई)']},
  tips:{en:['Before paying any flying school, clear the DGCA Class 2 medical — eyesight and health rules are strict.', 'Join only DGCA-approved flying schools and AME institutes; check the list on dgca.gov.in. Beware of agents who ‘guarantee’ airline jobs.', 'Pilot training is expensive; ask about education loans and government or airline scholarships, and check the official notification for fees.', 'Girls are welcome in every role — pilot, aircraft engineer, cabin crew and airport staff.', 'Cabin crew selection looks at English, confidence, grooming and fitness; airlines set height and age limits, so read each notice.'], hi:['किसी फ़्लाइंग स्कूल को पैसे देने से पहले DGCA क्लास 2 मेडिकल पास करें — आँखों व स्वास्थ्य के नियम सख़्त हैं।', 'केवल DGCA-अनुमोदित फ़्लाइंग स्कूल व AME संस्थान चुनें; सूची dgca.gov.in पर देखें। एयरलाइन नौकरी की ‘गारंटी’ देने वाले एजेंटों से सावधान रहें।', 'पायलट ट्रेनिंग महँगी है; शिक्षा ऋण तथा सरकारी या एयरलाइन छात्रवृत्ति के बारे में पूछें, और फ़ीस हेतु आधिकारिक अधिसूचना देखें।', 'लड़कियों का हर भूमिका में स्वागत है — पायलट, विमान इंजीनियर, केबिन क्रू व एयरपोर्ट स्टाफ़।', 'केबिन क्रू चयन में अंग्रेज़ी, आत्मविश्वास, ग्रूमिंग व फ़िटनेस देखी जाती है; एयरलाइन ऊँचाई व आयु सीमा तय करती हैं, इसलिए हर सूचना पढ़ें।']} },
{ id:'merchant-navy', ico:'🚢', lv:['10','12'], st:['pcm'], rs:'pcm', ri:'RIE', ap:['spa','num'], cost:3, earn:4, reloc:1,
  name:{en:'Merchant Navy', hi:'मर्चेंट नेवी'},
  dur:{en:'6 months – 4 years', hi:'6 महीने – 4 वर्ष'},
  about:{en:'Work on big cargo and passenger ships as a deck officer, marine engineer or rating. Study only at DG Shipping-approved institutes.', hi:'बड़े मालवाहक व यात्री जहाज़ों पर डेक ऑफ़िसर, मरीन इंजीनियर या रेटिंग के रूप में काम। केवल DG Shipping-अनुमोदित संस्थानों में पढ़ें।'},
  elig:{en:'Class 10 for GP Rating; Class 12 PCM (with English) for officer courses.', hi:'GP रेटिंग हेतु 10वीं; ऑफ़िसर कोर्स हेतु 12वीं PCM (अंग्रेज़ी सहित)।'},
  exams:{en:'IMU-CET, company sponsorship tests, DG Shipping medical, CoC exams', hi:'IMU-CET, कंपनी स्पॉन्सरशिप टेस्ट, DG Shipping मेडिकल, CoC परीक्षाएँ'},
  path:{en:['Class 10 (rating) / 12 PCM (officer)', 'IMU-CET or sponsorship test', 'Pre-sea course + medical', 'Sea service → CoC → officer'], hi:['10वीं (रेटिंग) / 12वीं PCM (ऑफ़िसर)', 'IMU-CET या स्पॉन्सरशिप टेस्ट', 'प्री-सी कोर्स + मेडिकल', 'समुद्री सेवा → CoC → ऑफ़िसर']},
  links:[['Directorate General of Shipping', 'https://www.dgshipping.gov.in'], ['Indian Maritime University (IMU-CET)', 'https://www.imu.edu.in'], ['Ministry of Ports, Shipping and Waterways', 'https://shipmin.gov.in']],
  detail:{en:['The Merchant Navy runs the cargo, oil and passenger ships that carry most of the world’s trade. It is not the Indian Navy (defence). There are three main groups: deck officers who navigate the ship, marine engineers who run its engines, and ratings (sailors and helpers) who support both.', 'It suits students who are physically fit, love travel, can stay away from home for months and can handle hard work and discipline. Eyesight and medical fitness rules are strict, especially for deck officers, so get a DG Shipping-approved medical check early.', 'Indian seafarers are in demand on Indian and foreign ships. Officers can rise to Captain (Master) or Chief Engineer. Haryana has no sea coast, but many Haryana students join pre-sea institutes in other states and work worldwide.', 'To start: after Class 10 you can do a 6-month GP Rating course. After Class 12 PCM, take IMU-CET for B.Sc Nautical Science, B.Tech Marine Engineering or the 1-year Diploma in Nautical Science (DNS). Join only DG Shipping-approved institutes and verify them on the DG Shipping website.'], hi:['मर्चेंट नेवी उन मालवाहक, तेल व यात्री जहाज़ों को चलाती है जिनसे दुनिया का अधिकांश व्यापार होता है। यह भारतीय नौसेना (रक्षा) नहीं है। तीन मुख्य समूह हैं: डेक ऑफ़िसर जो जहाज़ चलाते हैं, मरीन इंजीनियर जो इंजन संभालते हैं, और रेटिंग (नाविक व सहायक) जो दोनों की मदद करते हैं।', 'यह क्षेत्र उन विद्यार्थियों के लिए है जो शारीरिक रूप से फ़िट हों, घूमना पसंद करें, महीनों घर से दूर रह सकें और मेहनत व अनुशासन संभाल सकें। आँखों व मेडिकल फ़िटनेस के नियम सख़्त हैं, ख़ासकर डेक ऑफ़िसर हेतु, इसलिए DG Shipping-अनुमोदित मेडिकल जाँच जल्दी करा लें।', 'भारतीय नाविकों की भारतीय व विदेशी जहाज़ों पर माँग है। ऑफ़िसर आगे चलकर कैप्टन (मास्टर) या चीफ़ इंजीनियर बन सकते हैं। हरियाणा में समुद्र तट नहीं है, फिर भी हरियाणा के कई विद्यार्थी दूसरे राज्यों के प्री-सी संस्थानों से पढ़कर दुनिया भर में काम करते हैं।', 'शुरुआत: 10वीं के बाद 6 महीने का GP रेटिंग कोर्स कर सकते हैं। 12वीं PCM के बाद B.Sc नॉटिकल साइंस, B.Tech मरीन इंजीनियरिंग या 1-वर्षीय डिप्लोमा इन नॉटिकल साइंस (DNS) हेतु IMU-CET दें। केवल DG Shipping-अनुमोदित संस्थान चुनें और उन्हें DG Shipping वेबसाइट पर जाँचें।']},
  courses:{en:[['GP Rating (General Purpose Rating)', '6 months; Class 10 (check marks and age in the official notice)'], ['Diploma in Nautical Science (DNS)', '1 year + sea training; Class 12 PCM'], ['B.Sc Nautical Science', '3 years; Class 12 PCM, IMU-CET'], ['B.Tech Marine Engineering', '4 years; Class 12 PCM, IMU-CET'], ['Graduate Marine Engineering (GME)', '1 year; after B.E. / B.Tech Mechanical'], ['Electro-Technical Officer (ETO)', '4 months – 1 year; after diploma / degree in Electrical / Electronics'], ['Saloon Rating / ship cook', 'Short courses; Class 10']], hi:[['GP रेटिंग (जनरल पर्पज़ रेटिंग)', '6 महीने; 10वीं (अंक व आयु आधिकारिक सूचना में देखें)'], ['डिप्लोमा इन नॉटिकल साइंस (DNS)', '1 वर्ष + समुद्री प्रशिक्षण; 12वीं PCM'], ['B.Sc नॉटिकल साइंस', '3 वर्ष; 12वीं PCM, IMU-CET'], ['B.Tech मरीन इंजीनियरिंग', '4 वर्ष; 12वीं PCM, IMU-CET'], ['ग्रेजुएट मरीन इंजीनियरिंग (GME)', '1 वर्ष; B.E. / B.Tech मैकेनिकल के बाद'], ['इलेक्ट्रो-टेक्निकल ऑफ़िसर (ETO)', '4 महीने – 1 वर्ष; इलेक्ट्रिकल / इलेक्ट्रॉनिक्स डिप्लोमा / डिग्री के बाद'], ['सैलून रेटिंग / शिप कुक', 'छोटे कोर्स; 10वीं']]},
  work:{en:['Deck cadet → Third Officer → Chief Officer → Captain (Master)', 'Engine cadet → Fourth Engineer → Second Engineer → Chief Engineer', 'Electro-technical officer on ships', 'Able seaman / oiler / fitter (ratings)', 'Shipping companies – Shipping Corporation of India and private lines', 'Port, ship-management and marine surveying jobs on shore'], hi:['डेक कैडेट → थर्ड ऑफ़िसर → चीफ़ ऑफ़िसर → कैप्टन (मास्टर)', 'इंजन कैडेट → फ़ोर्थ इंजीनियर → सेकंड इंजीनियर → चीफ़ इंजीनियर', 'जहाज़ पर इलेक्ट्रो-टेक्निकल ऑफ़िसर', 'एबल सीमैन / ऑयलर / फ़िटर (रेटिंग)', 'शिपिंग कंपनियाँ – शिपिंग कॉर्पोरेशन ऑफ़ इंडिया व निजी लाइनें', 'बंदरगाह, शिप-मैनेजमेंट व मरीन सर्वेयर जैसी किनारे की नौकरियाँ']},
  after:{en:['DG Shipping Certificate of Competency (CoC) exams at each rank', 'Ratings can study and move up to officer level', 'Shore jobs: port operations, ship management, marine surveyor', 'MBA in Shipping / Port Management (e.g. at IMU)'], hi:['हर रैंक पर DG Shipping सर्टिफ़िकेट ऑफ़ कॉम्पिटेंसी (CoC) परीक्षाएँ', 'रेटिंग पढ़ाई कर ऑफ़िसर स्तर तक पहुँच सकते हैं', 'किनारे की नौकरियाँ: पोर्ट ऑपरेशंस, शिप मैनेजमेंट, मरीन सर्वेयर', 'शिपिंग / पोर्ट मैनेजमेंट में MBA (जैसे IMU में)']},
  skills:{en:['Physics & Maths', 'Physical fitness', 'Good eyesight', 'English', 'Discipline'], hi:['भौतिकी व गणित', 'शारीरिक फ़िटनेस', 'अच्छी दृष्टि', 'अंग्रेज़ी', 'अनुशासन']},
  near:{en:['Haryana is landlocked — check DG Shipping’s list of approved pre-sea institutes on dgshipping.gov.in (most are in coastal states)'], hi:['हरियाणा में समुद्र तट नहीं है — DG Shipping-अनुमोदित प्री-सी संस्थानों की सूची dgshipping.gov.in पर देखें (अधिकांश तटीय राज्यों में हैं)']},
  national:{en:['Indian Maritime University – Headquarters campus (Chennai)', 'IMU – Kolkata campus, formerly MERI (Kolkata)', 'IMU – Mumbai Port campus (Mumbai)', 'IMU – Navi Mumbai campus, T.S. Chanakya (Navi Mumbai)', 'IMU – Kochi campus (Kochi)', 'IMU – Visakhapatnam campus (Visakhapatnam)', 'Tolani Maritime Institute (Pune)'], hi:['भारतीय समुद्री विश्वविद्यालय – मुख्यालय परिसर (चेन्नई)', 'IMU – कोलकाता परिसर, पूर्व MERI (कोलकाता)', 'IMU – मुंबई पोर्ट परिसर (मुंबई)', 'IMU – नवी मुंबई परिसर, टी.एस. चाणक्य (नवी मुंबई)', 'IMU – कोच्चि परिसर (कोच्चि)', 'IMU – विशाखापत्तनम परिसर (विशाखापत्तनम)', 'तोलानी मैरीटाइम इंस्टीट्यूट (पुणे)']},
  tips:{en:['Fake agents and unapproved institutes are a big problem — check every institute and recruitment agency (RPSL) on dgshipping.gov.in before paying.', 'Get your eyesight and medical tested by a DG Shipping-approved doctor before joining; colour blindness can stop a deck career.', 'Prefer company-sponsored seats — the company then helps with sea training (shipboard cadetship).', 'Girls can join as deck and engine officers; women seafarers are increasing and companies encourage them.', 'You will get an INDoS number and a CDC (seafarer’s book) through your institute — never buy these from agents.'], hi:['फ़र्ज़ी एजेंट व बिना मान्यता के संस्थान बड़ी समस्या हैं — पैसे देने से पहले हर संस्थान व भर्ती एजेंसी (RPSL) को dgshipping.gov.in पर जाँचें।', 'दाख़िले से पहले DG Shipping-अनुमोदित डॉक्टर से आँखों व मेडिकल की जाँच कराएँ; रंग-अंधता डेक करियर रोक सकती है।', 'कंपनी-प्रायोजित सीट को प्राथमिकता दें — तब कंपनी समुद्री प्रशिक्षण (शिपबोर्ड कैडेटशिप) में मदद करती है।', 'लड़कियाँ डेक व इंजन ऑफ़िसर बन सकती हैं; महिला नाविक बढ़ रही हैं और कंपनियाँ उन्हें प्रोत्साहित करती हैं।', 'INDoS नंबर व CDC (नाविक पुस्तिका) संस्थान के माध्यम से मिलते हैं — इन्हें कभी एजेंटों से न ख़रीदें।']} },
{ id:'logistics-retail', ico:'📦', lv:['10','12'], st:['any'], rs:'commerce', ri:'ECR', ap:['num','log'], cost:1, earn:1, reloc:0,
  name:{en:'Logistics, Supply Chain & Retail', hi:'लॉजिस्टिक्स, सप्लाई चेन व रिटेल'},

  about:{en:'Move, store and sell goods — warehouses, delivery, e-commerce and retail stores. Start with a short skill course and grow to manager.', hi:'सामान को पहुँचाना, रखना और बेचना — गोदाम, डिलीवरी, ई-कॉमर्स व रिटेल स्टोर। छोटे कौशल कोर्स से शुरू कर मैनेजर तक बढ़ें।'},
  elig:{en:'Class 10 for skill courses; Class 12 any stream for B.Voc / BBA.', hi:'कौशल कोर्स हेतु 10वीं; B.Voc / BBA हेतु 12वीं कोई भी स्ट्रीम।'},
  exams:{en:'Mostly merit / direct entry; CUET-UG for some universities; company interviews', hi:'अधिकतर मेरिट / सीधा दाख़िला; कुछ विवि हेतु CUET-UG; कंपनी इंटरव्यू'},
  path:{en:['Class 10 / 12 (any stream)', 'Skill course or B.Voc / BBA', 'Warehouse / store / delivery job', 'Supervisor → manager'], hi:['10वीं / 12वीं (कोई भी स्ट्रीम)', 'कौशल कोर्स या B.Voc / BBA', 'गोदाम / स्टोर / डिलीवरी जॉब', 'सुपरवाइज़र → मैनेजर']},
  links:[['Logistics Sector Skill Council', 'https://lsc-india.org'], ['Retailers Association’s Skill Council of India', 'https://www.rasci.in'], ['Skill India Digital', 'https://www.skillindiadigital.gov.in'], ['National Apprenticeship Promotion Scheme', 'https://www.apprenticeshipindia.gov.in']],
  detail:{en:['Logistics and supply chain means getting goods from the factory to the customer: storing them in warehouses, managing stock, packing, transport and delivery. Retail means selling to customers in shops, malls and supermarkets. E-commerce joins both.', 'It suits students from any stream who are organised, active, good with people and basic computers. You can start soon after Class 10 or 12 with a short course, earn early, and keep studying for a degree alongside.', 'Haryana is one of India’s biggest warehousing hubs because it surrounds Delhi. Large warehouses and e-commerce centres are in Gurugram, Manesar, Bahadurgarh, Sonipat (Kundli–Rai), Panipat, Rewari, Palwal and Nuh, along the KMP Expressway and the Dedicated Freight Corridor. A big multi-modal logistics hub is coming up at Nangal Chaudhary (Mahendragarh).', 'To start: join a free or low-cost Logistics or Retail Skill Council course under Skill India, or an apprenticeship with a company. Use computer and Excel skills, and later do a B.Voc, BBA or MBA in logistics / supply chain to move into management.'], hi:['लॉजिस्टिक्स व सप्लाई चेन का अर्थ है सामान को फ़ैक्टरी से ग्राहक तक पहुँचाना: गोदाम में रखना, स्टॉक संभालना, पैकिंग, परिवहन व डिलीवरी। रिटेल का अर्थ है दुकानों, मॉल व सुपरमार्केट में ग्राहकों को बेचना। ई-कॉमर्स दोनों को जोड़ता है।', 'यह किसी भी स्ट्रीम के उन विद्यार्थियों के लिए है जो व्यवस्थित, सक्रिय, लोगों से अच्छा व्यवहार करने वाले हों और बुनियादी कंप्यूटर जानते हों। 10वीं या 12वीं के बाद छोटे कोर्स से जल्दी शुरुआत कर कमाई कर सकते हैं और साथ में डिग्री की पढ़ाई जारी रख सकते हैं।', 'दिल्ली के चारों ओर होने से हरियाणा देश के सबसे बड़े वेयरहाउसिंग केंद्रों में से है। बड़े गोदाम व ई-कॉमर्स केंद्र गुरुग्राम, मानेसर, बहादुरगढ़, सोनीपत (कुंडली–राई), पानीपत, रेवाड़ी, पलवल व नूंह में KMP एक्सप्रेसवे व डेडिकेटेड फ़्रेट कॉरिडोर के साथ हैं। नांगल चौधरी (महेंद्रगढ़) में बड़ा मल्टी-मॉडल लॉजिस्टिक्स हब बन रहा है।', 'शुरुआत: स्किल इंडिया के तहत लॉजिस्टिक्स या रिटेल स्किल काउंसिल का मुफ़्त या कम ख़र्च वाला कोर्स करें, या किसी कंपनी में अप्रेंटिसशिप करें। कंप्यूटर व एक्सेल सीखें, और आगे लॉजिस्टिक्स / सप्लाई चेन में B.Voc, BBA या MBA कर मैनेजमेंट में जाएँ।']},
  courses:{en:[['Warehouse Associate / Picker-Packer / Inventory Clerk (LSC)', 'About 1 – 3 months; Class 10 or below (varies by course)'], ['Retail Sales Associate / Cashier (RASCI)', 'About 1 – 3 months; Class 10 / 12'], ['Forklift operator / delivery associate', 'Short skill courses; Class 10 + driving licence where needed'], ['Apprenticeship in warehousing, retail or e-commerce (NAPS)', '6 months – 1 year; paid stipend'], ['B.Voc Logistics / Retail Management', '3 years; Class 12 any stream'], ['BBA (Logistics & Supply Chain) / B.Com', '3 years; Class 12 any stream'], ['MBA – Supply Chain / Operations / Retail', '2 years; after graduation (CAT / MAT / CMAT)']], hi:[['वेयरहाउस एसोसिएट / पिकर-पैकर / इन्वेंटरी क्लर्क (LSC)', 'लगभग 1 – 3 महीने; 10वीं या कम (कोर्स अनुसार)'], ['रिटेल सेल्स एसोसिएट / कैशियर (RASCI)', 'लगभग 1 – 3 महीने; 10वीं / 12वीं'], ['फ़ोर्कलिफ़्ट ऑपरेटर / डिलीवरी एसोसिएट', 'छोटे कौशल कोर्स; 10वीं + ज़रूरत हो तो ड्राइविंग लाइसेंस'], ['वेयरहाउसिंग, रिटेल या ई-कॉमर्स में अप्रेंटिसशिप (NAPS)', '6 महीने – 1 वर्ष; स्टाइपेंड मिलता है'], ['B.Voc लॉजिस्टिक्स / रिटेल मैनेजमेंट', '3 वर्ष; 12वीं कोई भी स्ट्रीम'], ['BBA (लॉजिस्टिक्स व सप्लाई चेन) / B.Com', '3 वर्ष; 12वीं कोई भी स्ट्रीम'], ['MBA – सप्लाई चेन / ऑपरेशंस / रिटेल', '2 वर्ष; स्नातक के बाद (CAT / MAT / CMAT)']]},
  work:{en:['Warehouse associate, inventory / stock controller', 'E-commerce fulfilment centre and delivery operations', 'Retail sales associate, cashier, store supervisor', 'Store manager / department manager in malls and supermarkets', 'Transport, fleet and dispatch coordinator', 'Purchase and supply chain executive in factories', 'India Post, railways freight and public sector warehousing (through their exams)'], hi:['वेयरहाउस एसोसिएट, इन्वेंटरी / स्टॉक कंट्रोलर', 'ई-कॉमर्स फ़ुलफ़िलमेंट सेंटर व डिलीवरी ऑपरेशंस', 'रिटेल सेल्स एसोसिएट, कैशियर, स्टोर सुपरवाइज़र', 'मॉल व सुपरमार्केट में स्टोर मैनेजर / विभाग मैनेजर', 'परिवहन, फ़्लीट व डिस्पैच कोऑर्डिनेटर', 'फ़ैक्टरियों में ख़रीद व सप्लाई चेन एग्ज़िक्यूटिव', 'भारतीय डाक, रेलवे माल-ढुलाई व सरकारी वेयरहाउसिंग (उनकी परीक्षाओं से)']},
  after:{en:['Supervisor → warehouse / store manager', 'B.Voc / BBA while working, then MBA in supply chain', 'Start your own delivery, transport or retail business', 'Export-import and customs work with further courses'], hi:['सुपरवाइज़र → वेयरहाउस / स्टोर मैनेजर', 'नौकरी के साथ B.Voc / BBA, फिर सप्लाई चेन में MBA', 'अपना डिलीवरी, परिवहन या रिटेल व्यवसाय', 'आगे के कोर्स से निर्यात-आयात व कस्टम्स का काम']},
  skills:{en:['Basic computers & Excel', 'Communication', 'Planning', 'Customer service', 'Honesty'], hi:['बुनियादी कंप्यूटर व एक्सेल', 'संवाद', 'योजना', 'ग्राहक सेवा', 'ईमानदारी']},
  near:{en:['Shri Vishwakarma Skill University (Palwal)', 'Government ITIs and Skill India centres – short-term logistics / retail courses (all districts)', 'Maharshi Dayanand University – BBA / MBA (Rohtak)', 'Kurukshetra University – BBA / MBA (Kurukshetra)', 'Guru Jambheshwar University of Science & Technology – BBA / MBA (Hisar)', 'Central University of Haryana – management studies (Mahendragarh)'], hi:['श्री विश्वकर्मा कौशल विश्वविद्यालय (पलवल)', 'राजकीय ITI व स्किल इंडिया केंद्र – लॉजिस्टिक्स / रिटेल शॉर्ट-टर्म कोर्स (सभी ज़िले)', 'महर्षि दयानंद विश्वविद्यालय – BBA / MBA (रोहतक)', 'कुरुक्षेत्र विश्वविद्यालय – BBA / MBA (कुरुक्षेत्र)', 'गुरु जम्भेश्वर विज्ञान एवं प्रौद्योगिकी विवि – BBA / MBA (हिसार)', 'हरियाणा केंद्रीय विश्वविद्यालय – प्रबंधन अध्ययन (महेंद्रगढ़)']},
  national:{en:['Gati Shakti Vishwavidyalaya – transport & logistics university (Vadodara)', 'IIM Mumbai, formerly NITIE – supply chain & operations (Mumbai)', 'Indian Institute of Foreign Trade (New Delhi)', 'IGNOU – distance BBA / management courses (New Delhi)'], hi:['गति शक्ति विश्वविद्यालय – परिवहन व लॉजिस्टिक्स विश्वविद्यालय (वडोदरा)', 'IIM मुंबई, पूर्व NITIE – सप्लाई चेन व ऑपरेशंस (मुंबई)', 'भारतीय विदेश व्यापार संस्थान (नई दिल्ली)', 'IGNOU – दूरस्थ BBA / प्रबंधन कोर्स (नई दिल्ली)']},
  tips:{en:['Many Skill India (PMKVY) courses are free — find them on skillindiadigital.gov.in and ask for a certificate from the Logistics or Retail Skill Council.', 'Apprenticeships pay a stipend and often lead to a job; register on apprenticeshipindia.gov.in.', 'Learn Excel, basic English and how to use scanners and stock software — these get faster promotions.', 'Avoid institutes that take money for ‘guaranteed placement’; check that the course is listed on Skill India.', 'Girls do well in retail, inventory, customer service and e-commerce office roles; ask about safe transport and shift timings before joining.'], hi:['स्किल इंडिया (PMKVY) के कई कोर्स मुफ़्त हैं — skillindiadigital.gov.in पर खोजें और लॉजिस्टिक्स या रिटेल स्किल काउंसिल का प्रमाणपत्र माँगें।', 'अप्रेंटिसशिप में स्टाइपेंड मिलता है और अक्सर नौकरी भी; apprenticeshipindia.gov.in पर पंजीकरण करें।', 'एक्सेल, बुनियादी अंग्रेज़ी तथा स्कैनर व स्टॉक सॉफ़्टवेयर चलाना सीखें — इनसे जल्दी तरक़्क़ी मिलती है।', '‘पक्की नौकरी’ के नाम पर पैसे लेने वाले संस्थानों से बचें; देखें कि कोर्स स्किल इंडिया पर दर्ज हो।', 'लड़कियाँ रिटेल, इन्वेंटरी, ग्राहक सेवा व ई-कॉमर्स ऑफ़िस भूमिकाओं में अच्छा करती हैं; दाख़िले से पहले सुरक्षित परिवहन व शिफ़्ट समय के बारे में पूछें।']} },

  links:[['IT-ITeS Sector Skill Council (NASSCOM)', 'https://www.sscnasscom.com'], ['FutureSkills Prime', 'https://futureskillsprime.in'], ['Skill India Digital', 'https://www.skillindiadigital.gov.in']],
  detail:{en:['IT-enabled services (ITeS) means work done on computers and phones for other companies: customer support (voice), chat and email support (non-voice), data entry and back office, technical help desks and knowledge work (KPO) like research or accounts.', 'It suits students from any stream who speak clearly, are patient with people and can type fast. Hindi, English and other Indian or foreign languages are all useful. Many people join after Class 12 and study for a degree through distance or evening classes.', 'Gurugram is one of India’s largest BPO and IT hubs, and centres are also growing in other Haryana towns. Companies serve Indian and foreign customers, so night or rotating shifts are common. Good performers move up within 1–3 years.', 'To start: learn computers (typing, MS Office, email), improve spoken English, and take an IT-ITeS Sector Skill Council course such as Domestic Customer Care Executive. A COPA trade at a Government ITI after Class 10 is another way in.'], hi:['आईटी-सक्षम सेवाएँ (ITeS) यानी दूसरी कंपनियों के लिए कंप्यूटर व फ़ोन पर किया गया काम: ग्राहक सहायता (वॉइस), चैट व ईमेल सहायता (नॉन-वॉइस), डेटा एंट्री व बैक ऑफ़िस, टेक्निकल हेल्प डेस्क और रिसर्च या अकाउंट्स जैसा ज्ञान-आधारित काम (KPO)।', 'यह किसी भी स्ट्रीम के उन विद्यार्थियों के लिए है जो साफ़ बोलते हों, लोगों के साथ धैर्य रखें और तेज़ टाइप कर सकें। हिंदी, अंग्रेज़ी व अन्य भारतीय या विदेशी भाषाएँ सभी काम आती हैं। कई लोग 12वीं के बाद जुड़ते हैं और दूरस्थ या सांध्य कक्षाओं से डिग्री करते हैं।', 'गुरुग्राम देश के सबसे बड़े BPO व IT केंद्रों में से है, और हरियाणा के अन्य शहरों में भी केंद्र बढ़ रहे हैं। कंपनियाँ भारतीय व विदेशी ग्राहकों को सेवा देती हैं, इसलिए रात या बदलती शिफ़्ट आम हैं। अच्छा काम करने वाले 1–3 वर्ष में आगे बढ़ जाते हैं।', 'शुरुआत: कंप्यूटर (टाइपिंग, MS Office, ईमेल) सीखें, बोलचाल की अंग्रेज़ी सुधारें, और IT-ITeS सेक्टर स्किल काउंसिल का कोर्स जैसे डोमेस्टिक कस्टमर केयर एग्ज़िक्यूटिव करें। 10वीं के बाद राजकीय ITI से COPA ट्रेड भी एक रास्ता है।']},
  courses:{en:[['Domestic Customer Care Executive / Domestic Data Entry Operator (IT-ITeS SSC)', 'About 1 – 3 months; Class 10 / 12'], ['COPA – Computer Operator & Programming Assistant (ITI)', '1 year; Class 10'], ['Spoken English & typing / MS Office', '1 – 3 months; any level'], ['FutureSkills Prime courses (digital skills, data basics)', 'Online, self-paced'], ['BCA / B.Com / BA / BBA', '3 years; Class 12 any stream (BCA may need Maths at some places)'], ['Diploma in Computer Applications / Office Management', '6 months – 1 year; Class 10 / 12']], hi:[['डोमेस्टिक कस्टमर केयर एग्ज़िक्यूटिव / डोमेस्टिक डेटा एंट्री ऑपरेटर (IT-ITeS SSC)', 'लगभग 1 – 3 महीने; 10वीं / 12वीं'], ['COPA – कंप्यूटर ऑपरेटर एवं प्रोग्रामिंग असिस्टेंट (ITI)', '1 वर्ष; 10वीं'], ['बोलचाल की अंग्रेज़ी व टाइपिंग / MS Office', '1 – 3 महीने; कोई भी स्तर'], ['फ़्यूचरस्किल्स प्राइम कोर्स (डिजिटल कौशल, डेटा की बुनियाद)', 'ऑनलाइन, अपनी गति से'], ['BCA / B.Com / BA / BBA', '3 वर्ष; 12वीं कोई भी स्ट्रीम (कहीं-कहीं BCA हेतु गणित)'], ['डिप्लोमा इन कंप्यूटर एप्लिकेशन / ऑफ़िस मैनेजमेंट', '6 महीने – 1 वर्ष; 10वीं / 12वीं']]},

  near:{en:['Government ITIs – COPA trade (all districts)', 'Shri Vishwakarma Skill University (Palwal)', 'Maharshi Dayanand University – BCA / B.Com, also distance courses (Rohtak)', 'Kurukshetra University – BCA / B.Com, also distance courses (Kurukshetra)', 'Guru Jambheshwar University of Science & Technology (Hisar)', 'Chaudhary Devi Lal University (Sirsa)', 'Central University of Haryana (Mahendragarh)'], hi:['राजकीय ITI – COPA ट्रेड (सभी ज़िले)', 'श्री विश्वकर्मा कौशल विश्वविद्यालय (पलवल)', 'महर्षि दयानंद विश्वविद्यालय – BCA / B.Com, दूरस्थ कोर्स भी (रोहतक)', 'कुरुक्षेत्र विश्वविद्यालय – BCA / B.Com, दूरस्थ कोर्स भी (कुरुक्षेत्र)', 'गुरु जम्भेश्वर विज्ञान एवं प्रौद्योगिकी विवि (हिसार)', 'चौधरी देवी लाल विश्वविद्यालय (सिरसा)', 'हरियाणा केंद्रीय विश्वविद्यालय (महेंद्रगढ़)']},

  tips:{en:['Real companies never ask for money to give a job — avoid ‘placement agents’ who charge fees or ask for deposits.', 'Free English practice: listen to news, read aloud daily and practise mock calls with friends.', 'Learn on Skill India Digital (free) and FutureSkills Prime (some courses free or low-cost); certificates from the IT-ITeS Sector Skill Council help in interviews.', 'Night shifts are common; girls should check that the company gives safe cab pick-up and drop and follows shift rules.', 'Do not stop studying — finish a degree by distance while you work so you can grow to team lead, quality or HR.'], hi:['असली कंपनियाँ नौकरी देने के लिए कभी पैसे नहीं माँगतीं — फ़ीस या जमा राशि माँगने वाले ‘प्लेसमेंट एजेंटों’ से बचें।', 'मुफ़्त अंग्रेज़ी अभ्यास: समाचार सुनें, रोज़ ज़ोर से पढ़ें और दोस्तों के साथ मॉक कॉल का अभ्यास करें।', 'Skill India Digital (मुफ़्त) व FutureSkills Prime (कुछ कोर्स मुफ़्त या कम शुल्क) पर सीखें; IT-ITeS सेक्टर स्किल काउंसिल के प्रमाण-पत्र इंटरव्यू में मदद करते हैं।', 'रात की शिफ़्ट आम है; लड़कियाँ देखें कि कंपनी सुरक्षित कैब पिक-अप व ड्रॉप देती है और शिफ़्ट नियमों का पालन करती है।', 'पढ़ाई न छोड़ें — नौकरी के साथ दूरस्थ डिग्री पूरी करें ताकि टीम लीड, क्वालिटी या HR तक बढ़ सकें।']} },
{ id:'fashion-textile', ico:'👗', lv:['10','12'], st:['any'], rs:'arts', ri:'ARE', ap:['spa','verb'], cost:2, earn:3, reloc:1,
  name:{en:'Fashion & Textile Design', hi:'फ़ैशन व टेक्सटाइल डिज़ाइन'},
  dur:{en:'3 – 4 years', hi:'3 – 4 वर्ष'},
  about:{en:'Fashion designer, textile designer, merchandiser, garment and textile technologist. B.Des via NIFT/NID, or a polytechnic diploma after Class 10.', hi:'फ़ैशन डिज़ाइनर, टेक्सटाइल डिज़ाइनर, मर्चेंडाइज़र, गारमेंट व टेक्सटाइल टेक्नोलॉजिस्ट। NIFT/NID से B.Des, या 10वीं के बाद पॉलिटेक्निक डिप्लोमा।'},
  elig:{en:'Class 10 for diploma; Class 12 any stream for B.Des.', hi:'डिप्लोमा हेतु 10वीं; B.Des हेतु 12वीं कोई भी स्ट्रीम।'},
  exams:{en:'NIFT entrance, NID DAT, UCEED; polytechnic via HSTES counselling', hi:'NIFT प्रवेश, NID DAT, UCEED; पॉलिटेक्निक हेतु HSTES काउंसलिंग'},
  path:{en:['Class 10 / 12', 'Diploma or B.Des (NIFT / NID)', 'Portfolio & internship', 'Designer, merchandiser, own label'], hi:['10वीं / 12वीं', 'डिप्लोमा या B.Des (NIFT / NID)', 'पोर्टफ़ोलियो व इंटर्नशिप', 'डिज़ाइनर, मर्चेंडाइज़र, अपना ब्रांड']},
  links:[['NIFT', 'https://www.nift.ac.in'], ['NID', 'https://www.nid.edu'], ['Ministry of Textiles', 'https://texmin.nic.in'], ['HSTES (polytechnic admissions)', 'https://hstes.org.in']],
  detail:{en:['Fashion and textile design is about creating clothes, fabrics, prints and accessories, and about making and selling them. The main degree is B.Des (4 years) in fashion, textile, knitwear or accessory design. B.FTech (apparel production) and B.Tech Textile Technology are the technical side.', 'It suits students who like drawing, colours, sewing, trends and hands-on work. Drawing skill and creativity matter more than marks — NIFT and NID test them through a written test and a studio/situation test.', 'Haryana is a strong place for this field: Panipat is a major hub for home textiles and handloom exports, and Gurugram–Faridabad have many garment-export units and fashion brands. NIFT has a campus in Panchkula and NID has a campus in Kurukshetra.', 'How to start: after Class 10, a 3-year polytechnic diploma in fashion/garment or textile technology gives a quick start. After Class 12 (any stream), prepare for NIFT / NID / UCEED and start a sketchbook and portfolio now.'], hi:['फ़ैशन व टेक्सटाइल डिज़ाइन में कपड़े, फ़ैब्रिक, प्रिंट और एक्सेसरी बनाना तथा उनका उत्पादन व बिक्री शामिल है। मुख्य डिग्री B.Des (4 वर्ष) है — फ़ैशन, टेक्सटाइल, निटवियर या एक्सेसरी डिज़ाइन में। B.FTech (परिधान उत्पादन) व B.Tech टेक्सटाइल टेक्नोलॉजी इसका तकनीकी पक्ष हैं।', 'यह उन विद्यार्थियों के लिए है जिन्हें ड्रॉइंग, रंग, सिलाई, ट्रेंड और हाथ से काम करना पसंद है। यहाँ अंकों से ज़्यादा ड्रॉइंग व रचनात्मकता मायने रखती है — NIFT और NID लिखित परीक्षा व स्टूडियो/सिचुएशन टेस्ट से यही परखते हैं।', 'हरियाणा इस क्षेत्र के लिए मज़बूत है: पानीपत होम-टेक्सटाइल व हैंडलूम निर्यात का बड़ा केंद्र है, और गुरुग्राम–फ़रीदाबाद में अनेक गारमेंट-निर्यात इकाइयाँ व फ़ैशन ब्रांड हैं। NIFT का कैंपस पंचकूला में और NID का कैंपस कुरुक्षेत्र में है।', 'शुरुआत कैसे करें: 10वीं के बाद फ़ैशन/गारमेंट या टेक्सटाइल टेक्नोलॉजी में 3-वर्षीय पॉलिटेक्निक डिप्लोमा जल्दी शुरुआत देता है। 12वीं (कोई भी स्ट्रीम) के बाद NIFT / NID / UCEED की तैयारी करें और अभी से स्केचबुक व पोर्टफ़ोलियो बनाना शुरू करें।']},
  courses:{en:[['Diploma in Fashion / Garment Technology', '3 years; after Class 10 (polytechnic)'], ['Diploma in Textile Technology / Textile Design', '3 years; after Class 10 (polytechnic)'], ['B.Des (Fashion, Textile, Knitwear, Accessory)', '4 years; Class 12 any stream — NIFT / NID'], ['B.FTech (Apparel Production)', '4 years; Class 12 with Physics, Chemistry, Maths — NIFT'], ['B.Tech Textile Technology', '4 years; Class 12 PCM — JEE Main / HSTES'], ['M.Des / M.FTech / MFM (Fashion Management)', '2 years; after graduation']], hi:[['फ़ैशन / गारमेंट टेक्नोलॉजी डिप्लोमा', '3 वर्ष; 10वीं के बाद (पॉलिटेक्निक)'], ['टेक्सटाइल टेक्नोलॉजी / टेक्सटाइल डिज़ाइन डिप्लोमा', '3 वर्ष; 10वीं के बाद (पॉलिटेक्निक)'], ['B.Des (फ़ैशन, टेक्सटाइल, निटवियर, एक्सेसरी)', '4 वर्ष; 12वीं कोई भी स्ट्रीम — NIFT / NID'], ['B.FTech (परिधान उत्पादन)', '4 वर्ष; 12वीं भौतिकी, रसायन, गणित सहित — NIFT'], ['B.Tech टेक्सटाइल टेक्नोलॉजी', '4 वर्ष; 12वीं PCM — JEE Main / HSTES'], ['M.Des / M.FTech / MFM (फ़ैशन मैनेजमेंट)', '2 वर्ष; स्नातक के बाद']]},

  tips:{en:['Start a sketchbook now — draw clothes, patterns and people every day. A good portfolio helps in NIFT/NID tests and jobs.', 'NIFT and NID forms usually open months before the exam — check nift.ac.in and nid.edu regularly.', 'Polytechnic diplomas in fashion/textile are offered at many government women’s polytechnics — a low-cost option for girls.', 'Before joining a private fashion institute, check its university affiliation or AICTE/UGC approval; avoid “guaranteed placement” promises.', 'Free learning: SWAYAM and NPTEL have courses on textiles and design; visit Panipat or Surajkund Mela to see crafts and fabrics.'], hi:['अभी से स्केचबुक शुरू करें — रोज़ कपड़े, पैटर्न और लोग बनाएँ। अच्छा पोर्टफ़ोलियो NIFT/NID परीक्षा और नौकरी दोनों में काम आता है।', 'NIFT व NID के फ़ॉर्म प्रायः परीक्षा से कई महीने पहले खुलते हैं — nift.ac.in व nid.edu नियमित देखें।', 'फ़ैशन/टेक्सटाइल पॉलिटेक्निक डिप्लोमा कई राजकीय महिला पॉलिटेक्निकों में है — छात्राओं के लिए कम ख़र्च वाला विकल्प।', 'निजी फ़ैशन संस्थान में दाख़िले से पहले उसकी विश्वविद्यालय-संबद्धता या AICTE/UGC मान्यता जाँचें; “पक्की नौकरी” के वादों से बचें।', 'मुफ़्त पढ़ाई: SWAYAM व NPTEL पर टेक्सटाइल व डिज़ाइन के कोर्स; शिल्प व कपड़े देखने हेतु पानीपत या सूरजकुंड मेला जाएँ।']} },

  links:[['Haryana college admissions', 'https://admissions.highereduhry.ac.in'], ['CUET-UG', 'https://cuet.nta.nic.in'], ['UGC NET', 'https://ugcnet.nta.ac.in'], ['Archaeological Survey of India', 'https://asi.nic.in']],
  detail:{en:['Humanities means studying languages, literature, history, geography, archaeology and culture. You can do BA in Hindi, English, Sanskrit, Punjabi or a foreign language (French, German, Japanese, etc.), history, geography, or a mix of subjects.', 'It suits students who love reading, writing, stories, maps and the past. Most IAS/IPS/HCS officers come from humanities subjects, and good language skill is valued everywhere — from offices to digital media.', 'Jobs today: translator and Hindi officer (Rajbhasha) in government offices and banks, school teacher (with B.Ed), lecturer (MA + NET), librarian (B.Lib / M.Lib), archaeologist and museum staff, tourist guide, and content writing and translation with AI tools.', 'How to start: in Haryana government colleges, BA admission is through the online merit portal of the Higher Education Department. For central universities (DU, BHU, JNU), give CUET-UG. Read newspapers and books daily in at least two languages.'], hi:['मानविकी का अर्थ है भाषा, साहित्य, इतिहास, भूगोल, पुरातत्व और संस्कृति की पढ़ाई। आप हिंदी, अंग्रेज़ी, संस्कृत, पंजाबी या किसी विदेशी भाषा (फ़्रेंच, जर्मन, जापानी आदि), इतिहास, भूगोल या विषयों के मेल से BA कर सकते हैं।', 'यह उन विद्यार्थियों के लिए है जिन्हें पढ़ना, लिखना, कहानियाँ, नक़्शे और इतिहास पसंद हैं। अधिकांश IAS/IPS/HCS अधिकारी मानविकी विषयों से आते हैं, और अच्छी भाषा की क़द्र हर जगह है — दफ़्तर से डिजिटल मीडिया तक।', 'आज के करियर: सरकारी दफ़्तरों व बैंकों में अनुवादक व हिंदी (राजभाषा) अधिकारी, स्कूल शिक्षक (B.Ed सहित), प्राध्यापक (MA + NET), पुस्तकालयाध्यक्ष (B.Lib / M.Lib), पुरातत्वविद् व संग्रहालय कर्मी, पर्यटक गाइड, और AI-टूल्स के साथ कंटेंट राइटिंग व अनुवाद।', 'शुरुआत कैसे करें: हरियाणा के सरकारी कॉलेजों में BA दाख़िला उच्चतर शिक्षा विभाग के ऑनलाइन मेरिट पोर्टल से होता है। केंद्रीय विश्वविद्यालयों (DU, BHU, JNU) हेतु CUET-UG दें। रोज़ कम से कम दो भाषाओं में अख़बार व किताबें पढ़ें।']},

  tips:{en:['BA is not a “left-over” option — choose subjects you enjoy and plan your goal (teaching, NET, UPSC/HCS, translation) from the first year.', 'Learn one extra language well — Sanskrit, Punjabi, Urdu or a foreign language adds real value for translation and tourism jobs.', 'UGC NET is held twice a year by NTA; JRF gives a fellowship for PhD — check the official notification.', 'Free learning: SWAYAM, e-PG Pathshala and the National Digital Library of India have free humanities courses and books.', 'Use the Haryana Post-Matric and central scholarships (NSP) — many BA students are eligible.'], hi:['BA कोई “बचा हुआ” विकल्प नहीं — मनपसंद विषय चुनें और पहले वर्ष से लक्ष्य (शिक्षण, NET, UPSC/HCS, अनुवाद) तय करें।', 'एक अतिरिक्त भाषा अच्छी तरह सीखें — संस्कृत, पंजाबी, उर्दू या कोई विदेशी भाषा अनुवाद व पर्यटन नौकरियों में बहुत काम आती है।', 'UGC NET साल में दो बार NTA लेता है; JRF से PhD हेतु फ़ेलोशिप मिलती है — आधिकारिक अधिसूचना देखें।', 'मुफ़्त पढ़ाई: SWAYAM, e-PG पाठशाला व राष्ट्रीय डिजिटल पुस्तकालय पर मानविकी के मुफ़्त कोर्स व किताबें।', 'हरियाणा पोस्ट-मैट्रिक व केंद्रीय छात्रवृत्तियों (NSP) का लाभ लें — BA के कई विद्यार्थी पात्र हैं।']} },

  detail:{en:['Banking and insurance jobs are open to graduates of any stream — Arts, Commerce or Science. Selection is through competitive exams, not through a special degree. B.Com, BBA or BA Economics helps, but is not required.', 'Main routes: IBPS (PO, Clerk, and RRB exams for regional rural banks like Sarva Haryana Gramin Bank), SBI PO and Clerk, RBI Assistant and Grade B officer, and LIC AAO / ADO. Most have a prelims, a mains and an interview or language test.', 'Insurance and finance can be started earlier: after Class 12 you can become an insurance advisor after IRDAI-approved training and the licence exam, or a mutual fund distributor with an NISM certificate. Haryana’s cooperative banks (HARCO Bank and district central cooperative banks) also recruit from time to time.', 'It suits students who are good with numbers, patient with people and ready for steady exam preparation. Start practising maths, reasoning and English during graduation, and read banking news.'], hi:['बैंकिंग व बीमा की नौकरियाँ किसी भी स्ट्रीम — कला, वाणिज्य या विज्ञान — के स्नातकों के लिए खुली हैं। चयन प्रतियोगी परीक्षाओं से होता है, किसी विशेष डिग्री से नहीं। B.Com, BBA या BA अर्थशास्त्र मददगार है, पर ज़रूरी नहीं।', 'मुख्य रास्ते: IBPS (PO, क्लर्क, और सर्व हरियाणा ग्रामीण बैंक जैसे क्षेत्रीय ग्रामीण बैंकों हेतु RRB परीक्षा), SBI PO व क्लर्क, RBI असिस्टेंट व ग्रेड B अधिकारी, और LIC AAO / ADO। अधिकतर में प्रारंभिक, मुख्य परीक्षा और साक्षात्कार या भाषा-परीक्षा होती है।', 'बीमा व वित्त में शुरुआत पहले भी हो सकती है: 12वीं के बाद IRDAI-स्वीकृत प्रशिक्षण व लाइसेंस परीक्षा से बीमा सलाहकार, या NISM प्रमाणपत्र से म्यूचुअल फ़ंड वितरक बन सकते हैं। हरियाणा के सहकारी बैंक (HARCO बैंक व ज़िला केंद्रीय सहकारी बैंक) भी समय-समय पर भर्ती करते हैं।', 'यह उन विद्यार्थियों के लिए है जो अंकों में अच्छे हैं, लोगों से धैर्य से बात करते हैं और लगातार परीक्षा-तैयारी को तैयार हैं। स्नातक के दौरान ही गणित, रीज़निंग व अंग्रेज़ी का अभ्यास शुरू करें और बैंकिंग समाचार पढ़ें।']},
  courses:{en:[['B.Com / B.Com (Banking & Insurance)', '3 years; Class 12 (Commerce preferred)'], ['BBA (Banking, Finance & Insurance)', '3 years; Class 12 any stream'], ['BA Economics / any graduation', '3 years; enough for all bank exams'], ['IRDAI-approved insurance agent training + IC-38 exam', 'short course; after Class 10/12 (IRDAI rules)'], ['NISM certifications (e.g. Mutual Fund Distributors)', 'short exam-based certificates'], ['JAIIB / CAIIB (IIBF)', 'for bank employees, for promotion']], hi:[['B.Com / B.Com (बैंकिंग व बीमा)', '3 वर्ष; 12वीं (वाणिज्य बेहतर)'], ['BBA (बैंकिंग, वित्त व बीमा)', '3 वर्ष; 12वीं कोई भी स्ट्रीम'], ['BA अर्थशास्त्र / कोई भी स्नातक', '3 वर्ष; सभी बैंक परीक्षाओं हेतु पर्याप्त'], ['IRDAI-स्वीकृत बीमा एजेंट प्रशिक्षण + IC-38 परीक्षा', 'लघु कोर्स; 10वीं/12वीं के बाद (IRDAI नियम)'], ['NISM प्रमाणपत्र (जैसे म्यूचुअल फ़ंड वितरक)', 'लघु परीक्षा-आधारित प्रमाणपत्र'], ['JAIIB / CAIIB (IIBF)', 'बैंक कर्मचारियों हेतु, पदोन्नति के लिए']]},

  tips:{en:['Bank exams have age limits and fixed calendars — check the official IBPS / SBI / RBI notification every year.', 'Start in your final year of graduation: practise maths, reasoning and English daily with free mock tests.', 'Never pay anyone who promises a bank job “through setting” — selection is only through the official exam.', 'An insurance agent must be licensed through IRDAI-approved training and exam — check the company’s licence before joining.', 'Read each notification carefully: fee concession is usually for SC/ST/PwD candidates, and age relaxation for SC/ST/OBC/PwD.'], hi:['बैंक परीक्षाओं में आयु-सीमा व तय कैलेंडर होता है — हर वर्ष IBPS / SBI / RBI की आधिकारिक अधिसूचना देखें।', 'स्नातक के अंतिम वर्ष से शुरुआत करें: मुफ़्त मॉक-टेस्ट से रोज़ गणित, रीज़निंग व अंग्रेज़ी का अभ्यास करें।', '“सेटिंग” से बैंक नौकरी का वादा करने वाले को कभी पैसे न दें — चयन केवल आधिकारिक परीक्षा से होता है।', 'बीमा एजेंट को IRDAI-स्वीकृत प्रशिक्षण व परीक्षा से लाइसेंस लेना होता है — जुड़ने से पहले कंपनी का लाइसेंस जाँचें।', 'हर अधिसूचना ध्यान से पढ़ें: शुल्क में छूट प्रायः SC/ST/दिव्यांग उम्मीदवारों को, और आयु-छूट SC/ST/OBC/दिव्यांग को मिलती है।']} },

  about:{en:'Singer, musician, dancer, actor, music teacher, sound and stage artist. BA/BPA/MPA at universities, NSD for theatre, and graded diplomas you can start after Class 10.', hi:'गायक, वादक, नर्तक, अभिनेता, संगीत शिक्षक, साउंड व मंच कलाकार। विश्वविद्यालयों में BA/BPA/MPA, रंगमंच हेतु NSD, और 10वीं के बाद शुरू होने वाले स्तरीय डिप्लोमा।'},

  links:[['National School of Drama', 'https://nsd.gov.in'], ['Sangeet Natak Akademi', 'https://sangeetnatak.gov.in'], ['CCRT (scholarships)', 'https://ccrtindia.gov.in'], ['Kurukshetra University', 'https://kuk.ac.in']],
  detail:{en:['Performing arts means vocal and instrumental music, classical and folk dance, and theatre and acting. Degrees are BA with Music, BPA (Bachelor of Performing Arts), and MA / MPA. Theatre training is offered by university theatre departments and the National School of Drama.', 'Many students start early: graded music and dance diplomas (such as those of Prayag Sangeet Samiti or the Bhatkhande system) can be done alongside school, step by step over several years.', 'Haryana has a rich tradition of folk songs, Ragini and Saang, and Haryanvi music and cinema are growing fast. Kurukshetra University has music, dance and Indian theatre departments, and MDU Rohtak teaches music. YouTube, OTT and live events have also created new work.', 'It suits students with talent, daily discipline and patience — income can be irregular at first. Combine the art with a degree or teaching qualification so you have a steady option too.'], hi:['परफ़ॉर्मिंग आर्ट्स का अर्थ है गायन व वादन, शास्त्रीय व लोक नृत्य, और रंगमंच व अभिनय। डिग्रियाँ हैं — संगीत सहित BA, BPA (बैचलर ऑफ़ परफ़ॉर्मिंग आर्ट्स), और MA / MPA। रंगमंच का प्रशिक्षण विश्वविद्यालयों के थिएटर विभाग व राष्ट्रीय नाट्य विद्यालय देते हैं।', 'कई विद्यार्थी जल्दी शुरू करते हैं: संगीत व नृत्य के स्तरीय डिप्लोमा (जैसे प्रयाग संगीत समिति या भातखंडे पद्धति के) स्कूल के साथ-साथ, कई वर्षों में चरणबद्ध किए जा सकते हैं।', 'हरियाणा में लोकगीत, रागिनी व सांग की समृद्ध परंपरा है, और हरियाणवी संगीत व सिनेमा तेज़ी से बढ़ रहे हैं। कुरुक्षेत्र विश्वविद्यालय में संगीत, नृत्य व भारतीय रंगमंच विभाग हैं, और MDU रोहतक में संगीत पढ़ाया जाता है। यूट्यूब, OTT व लाइव कार्यक्रमों ने नया काम भी दिया है।', 'यह प्रतिभा, रोज़ के अनुशासन और धैर्य वाले विद्यार्थियों के लिए है — शुरुआत में आय अनियमित हो सकती है। कला के साथ कोई डिग्री या शिक्षण योग्यता भी रखें ताकि स्थिर विकल्प हाथ में रहे।']},
  courses:{en:[['Graded diplomas in music / dance (e.g. Prayag, Bhatkhande)', 'several levels over years; start alongside school'], ['BA with Music / Dance as a subject', '3 years; Class 12 any stream'], ['BPA (Music, Dance or Theatre)', '3 – 4 years; audition at many universities'], ['MA / MPA (Music, Dance, Theatre)', '2 years; after graduation'], ['Diploma in Dramatic Arts (NSD)', '3 years; after graduation + theatre experience'], ['Sound recording / audio engineering courses', 'diploma or degree; FTII and others']], hi:[['संगीत / नृत्य में स्तरीय डिप्लोमा (जैसे प्रयाग, भातखंडे)', 'कई वर्षों में कई स्तर; स्कूल के साथ शुरू करें'], ['संगीत / नृत्य विषय सहित BA', '3 वर्ष; 12वीं कोई भी स्ट्रीम'], ['BPA (संगीत, नृत्य या रंगमंच)', '3 – 4 वर्ष; कई विश्वविद्यालयों में ऑडिशन'], ['MA / MPA (संगीत, नृत्य, रंगमंच)', '2 वर्ष; स्नातक के बाद'], ['नाट्य कला डिप्लोमा (NSD)', '3 वर्ष; स्नातक + रंगमंच अनुभव के बाद'], ['साउंड रिकॉर्डिंग / ऑडियो इंजीनियरिंग कोर्स', 'डिप्लोमा या डिग्री; FTII व अन्य']]},

  elig: { en: 'A few certificate courses accept Class 10; most diploma / degree courses prefer Class 12 PCB.', hi: 'कुछ सर्टिफ़िकेट कोर्स 10वीं पर मिलते हैं; अधिकांश डिप्लोमा / डिग्री कोर्स 12वीं PCB पसंद करते हैं।' },
  exams: { en: 'Admission by merit or institute entrance; check that the course is recognised by the state / national council.', hi: 'दाख़िला मेरिट या संस्थान की प्रवेश परीक्षा से; देखें कि कोर्स राज्य / राष्ट्रीय परिषद से मान्यता प्राप्त हो।' },
  tip: { en: 'Always confirm recognition of the institute before paying any fee.', hi: 'कोई भी शुल्क देने से पहले संस्थान की मान्यता ज़रूर जाँचें।' } },
'short': {
  d: { en: 'Short courses (a few weeks to one year) that teach one job skill — digital marketing, tailoring, tally and accounts, mobile repair, beautician, animation, coaching and more. Good when you want to earn early.',
       hi: 'कुछ सप्ताह से एक वर्ष के कोर्स जो एक रोज़गार-कौशल सिखाते हैं — डिजिटल मार्केटिंग, सिलाई, टैली व अकाउंट्स, मोबाइल रिपेयर, ब्यूटीशियन, एनिमेशन, कोचिंग आदि। जल्दी कमाई शुरू करनी हो तो उपयोगी।' },
  study: { en: ['One focused skill with practice', 'Customer handling and basic business sense'], hi: ['एक केंद्रित कौशल, अभ्यास सहित', 'ग्राहक से व्यवहार व मूल व्यवसायिक समझ'] },
  elig: { en: 'Usually Class 8 / 10 pass; some accept anyone.', hi: 'प्रायः 8वीं / 10वीं उत्तीर्ण; कुछ में किसी के लिए भी।' },
  exams: { en: 'No entrance exam in most cases. Look for courses under Skill India / NSDC / government training centres.', hi: 'अधिकांश में प्रवेश परीक्षा नहीं। Skill India / NSDC / सरकारी प्रशिक्षण केंद्रों के कोर्स देखें।' },
  tip: { en: 'Choose a course that gives a recognised certificate and, if possible, placement or an apprenticeship.', hi: 'ऐसा कोर्स चुनें जो मान्यता प्राप्त प्रमाणपत्र दे और संभव हो तो प्लेसमेंट / अप्रेंटिसशिप भी।' } },
'jobs': {
  d: { en: 'Some forces and government posts are open right after Class 10 or Class 12. Preparation runs alongside studies, and age limits and physical standards matter.',
       hi: 'कुछ सेना व सरकारी पद 10वीं या 12वीं के तुरंत बाद उपलब्ध हैं। तैयारी पढ़ाई के साथ चलती है; आयु-सीमा व शारीरिक मानक महत्त्वपूर्ण हैं।' },
  study: { en: ['General awareness, reasoning, basic maths and English', 'Physical fitness training for forces and police'], hi: ['सामान्य जागरूकता, रीज़निंग, मूल गणित व अंग्रेज़ी', 'सेना व पुलिस के लिए शारीरिक फ़िटनेस प्रशिक्षण'] },
  elig: { en: 'Varies by post: Class 10 / 12 pass, age and fitness rules apply.', hi: 'पद के अनुसार: 10वीं / 12वीं उत्तीर्ण, आयु व फ़िटनेस नियम लागू।' },
  exams: { en: 'Written test + physical test / interview. Haryana posts: HSSC CET. Agniveer: online common entrance.', hi: 'लिखित परीक्षा + शारीरिक परीक्षा / साक्षात्कार। हरियाणा के पद: HSSC CET। अग्निवीर: ऑनलाइन कॉमन एंट्रेंस।' },
  tip: { en: 'Keep studying — Class 12 and a degree open higher posts and give a strong back-up plan.', hi: 'पढ़ाई जारी रखें — 12वीं व डिग्री से ऊँचे पद खुलते हैं और मज़बूत वैकल्पिक योजना बनती है।' } },

/* ------------------------- streams ------------------------- */
'pcm': {
  d: { en: 'Physics, Chemistry and Mathematics — the stream for people who like solving problems, building things and understanding how machines and technology work. It leads to engineering, computing, architecture, pure science and the defence services.',
       hi: 'भौतिकी, रसायन व गणित — उनके लिए जो समस्याएँ सुलझाना, चीज़ें बनाना और मशीन-तकनीक की समझ पसंद करते हैं। यह इंजीनियरिंग, कंप्यूटिंग, आर्किटेक्चर, शुद्ध विज्ञान और रक्षा सेवाओं तक ले जाता है।' },
  study: { en: ['Physics, Chemistry, Mathematics (+ English; optional Computer Science / Physical Education)', 'Heavy on numerical problem solving'], hi: ['भौतिकी, रसायन, गणित (+ अंग्रेज़ी; वैकल्पिक कंप्यूटर साइंस / शारीरिक शिक्षा)', 'संख्यात्मक प्रश्न-हल पर अधिक ज़ोर'] },
  elig: { en: 'Class 10 pass; good marks in Maths and Science make this easier.', hi: '10वीं उत्तीर्ण; गणित व विज्ञान में अच्छे अंक सहायक।' },
  exams: { en: 'JEE Main / JEE Advanced, state entrance (HSTES), NATA, NDA, CUET, university tests.', hi: 'JEE Main / JEE Advanced, राज्य प्रवेश (HSTES), NATA, NDA, CUET, विश्वविद्यालय परीक्षाएँ।' },
  tip: { en: 'Maths-phobia is the biggest risk. If you dislike Maths but love Biology, PCB is the better road.', hi: 'सबसे बड़ा जोखिम गणित से डर है। गणित पसंद नहीं पर जीवविज्ञान पसंद है तो PCB बेहतर है।' } },
'pcb': {
  d: { en: 'Physics, Chemistry and Biology — for people curious about the human body, plants, animals and health. It leads to medicine, nursing, pharmacy, paramedical, agriculture, dairy and life sciences.',
       hi: 'भौतिकी, रसायन व जीवविज्ञान — मानव शरीर, पौधों, पशुओं व स्वास्थ्य के बारे में जिज्ञासु विद्यार्थियों के लिए। यह चिकित्सा, नर्सिंग, फ़ार्मेसी, पैरामेडिकल, कृषि, डेयरी व जीव-विज्ञान तक ले जाता है।' },
  study: { en: ['Physics, Chemistry, Biology (+ English; optional Physical Education)', 'Lots of diagrams, terms and concepts to remember'], hi: ['भौतिकी, रसायन, जीवविज्ञान (+ अंग्रेज़ी; वैकल्पिक शारीरिक शिक्षा)', 'याद करने के लिए बहुत से चित्र, शब्द व अवधारणाएँ'] },
  elig: { en: 'Class 10 pass; interest in Science and Biology.', hi: '10वीं उत्तीर्ण; विज्ञान व जीवविज्ञान में रुचि।' },
  exams: { en: 'NEET-UG (medical), state nursing / pharmacy entrance, CUET-UG (ICAR for agriculture), university tests.', hi: 'NEET-UG (चिकित्सा), राज्य नर्सिंग / फ़ार्मेसी प्रवेश, CUET-UG (कृषि हेतु ICAR), विश्वविद्यालय परीक्षाएँ।' },
  tip: { en: 'Only a few thousand MBBS seats exist compared to lakhs of students — always keep a second career from this list as your Plan B.', hi: 'लाखों विद्यार्थियों की तुलना में MBBS की सीटें कम हैं — इस सूची से दूसरा करियर हमेशा प्लान B रखें।' } },
'com': {
  d: { en: 'The stream of business, money and markets. It leads to Chartered Accountancy, banking, finance, management, business ownership, hospitality and — with Computers — technology careers.',
       hi: 'व्यवसाय, धन व बाज़ार की स्ट्रीम। यह चार्टर्ड अकाउंटेंसी, बैंकिंग, फ़ाइनेंस, प्रबंधन, स्वयं का व्यवसाय, आतिथ्य और कंप्यूटर के साथ तकनीकी करियर तक ले जाती है।' },
  study: { en: ['Accountancy, Business Studies, Economics (+ Maths or Informatics Practices optional)', 'English and a language'], hi: ['लेखाशास्त्र, व्यवसाय अध्ययन, अर्थशास्त्र (+ वैकल्पिक गणित या इन्फ़ॉर्मेटिक्स प्रैक्टिसेज़)', 'अंग्रेज़ी व एक भाषा'] },
  elig: { en: 'Class 10 pass. Maths in Class 11–12 keeps more options open (e.g. economics, BBA, data careers).', hi: '10वीं उत्तीर्ण। 11–12 में गणित लेने से अधिक विकल्प खुले रहते हैं (अर्थशास्त्र, BBA, डेटा करियर)।' },
  exams: { en: 'CUET-UG, CA Foundation (ICAI), CS Foundation (ICSI), IPMAT, NCHM-JEE, university tests.', hi: 'CUET-UG, CA फ़ाउंडेशन (ICAI), CS फ़ाउंडेशन (ICSI), IPMAT, NCHM-JEE, विश्वविद्यालय परीक्षाएँ।' },
  tip: { en: 'CA, CS and CMA courses can be started alongside a B.Com — plan your time early.', hi: 'CA, CS व CMA कोर्स B.Com के साथ शुरू किए जा सकते हैं — समय की योजना जल्दी बनाएँ।' } },
'arts': {
  d: { en: 'Humanities study people, society, law, government, language and culture. It is the main route to civil services, law, teaching, media, psychology, social work and the creative fields — and the stream with the most freedom to mix subjects.',
       hi: 'मानविकी लोगों, समाज, विधि, शासन, भाषा व संस्कृति का अध्ययन है। यह सिविल सेवा, विधि, शिक्षण, मीडिया, मनोविज्ञान, समाज-कार्य और रचनात्मक क्षेत्रों का मुख्य मार्ग है — और विषय मिलाने की सबसे अधिक स्वतंत्रता इसी में है।' },
  study: { en: ['History, Political Science, Geography, Economics, Sociology, Psychology, languages, Fine Arts, Home Science'], hi: ['इतिहास, राजनीति विज्ञान, भूगोल, अर्थशास्त्र, समाजशास्त्र, मनोविज्ञान, भाषाएँ, ललित कला, गृह विज्ञान'] },
  elig: { en: 'Class 10 pass; reading and writing interest.', hi: '10वीं उत्तीर्ण; पढ़ने-लिखने में रुचि।' },
  exams: { en: 'CUET-UG, CLAT (law), NID / NIFT / UCEED (design), UPSC & HCS after graduation, CTET / HTET for teaching.', hi: 'CUET-UG, CLAT (विधि), NID / NIFT / UCEED (डिज़ाइन), स्नातक के बाद UPSC व HCS, शिक्षण हेतु CTET / HTET।' },
  tip: { en: 'Arts is not a "weak" stream — toppers of UPSC are mostly humanities graduates. Pair it with good English, current affairs and a skill.', hi: 'कला "कमज़ोर" स्ट्रीम नहीं है — UPSC के अधिकांश टॉपर मानविकी स्नातक होते हैं। इसके साथ अच्छी अंग्रेज़ी, समसामयिकी व एक कौशल जोड़ें।' } },
'voc': {
  d: { en: 'In selected government schools, vocational subjects (such as IT, retail, health care, agriculture, automotive, electronics) are taught with school subjects under NSQF. You finish Class 12 and also earn a skill certificate.',
       hi: 'चयनित सरकारी स्कूलों में व्यावसायिक विषय (जैसे IT, रिटेल, हेल्थकेयर, कृषि, ऑटोमोटिव, इलेक्ट्रॉनिक्स) NSQF के अंतर्गत स्कूली विषयों के साथ पढ़ाए जाते हैं। आप 12वीं भी पूरी करते हैं और कौशल प्रमाणपत्र भी पाते हैं।' },
  study: { en: ['English + language, one or two academic subjects', 'One vocational trade with practicals and internship'], hi: ['अंग्रेज़ी + भाषा, एक-दो शैक्षणिक विषय', 'एक व्यावसायिक ट्रेड — प्रैक्टिकल व इंटर्नशिप सहित'] },
  elig: { en: 'Class 10 pass; available only in schools that offer it — ask your school.', hi: '10वीं उत्तीर्ण; केवल उन स्कूलों में जहाँ उपलब्ध है — अपने स्कूल से पूछें।' },
  exams: { en: 'Class 12 board exam; later diploma, degree or direct job / apprenticeship.', hi: '12वीं बोर्ड परीक्षा; आगे डिप्लोमा, डिग्री या सीधे नौकरी / अप्रेंटिसशिप।' },
  tip: { en: 'A good middle path if you want to study and earn a skill together.', hi: 'पढ़ाई और कौशल साथ-साथ चाहें तो अच्छा मध्य मार्ग।' } },
'any': {
  d: { en: 'These routes do not depend on your stream — you can enter them from Science, Commerce or Arts alike: the forces, government jobs and skill-based self-employment.',
       hi: 'ये मार्ग आपकी स्ट्रीम पर निर्भर नहीं हैं — विज्ञान, वाणिज्य या कला, किसी भी स्ट्रीम से इनमें जा सकते हैं: सेना, सरकारी नौकरियाँ और कौशल-आधारित स्वरोज़गार।' },
  study: { en: ['Exam-specific preparation and physical fitness', 'Skill training'], hi: ['परीक्षा-विशेष तैयारी व शारीरिक फ़िटनेस', 'कौशल प्रशिक्षण'] },
  elig: { en: 'Class 12 pass (any stream), age limits apply.', hi: '12वीं उत्तीर्ण (कोई भी स्ट्रीम), आयु-सीमा लागू।' },
  exams: { en: 'Depends on the career — see each branch below.', hi: 'करियर के अनुसार — नीचे प्रत्येक शाखा देखें।' },
  tip: { en: 'Combine one of these with a degree through open / regular college so you always have a back-up.', hi: 'इनमें से किसी को ओपन / रेगुलर कॉलेज की डिग्री के साथ जोड़ें ताकि हमेशा विकल्प रहे।' } },

/* ------------------------- groups under the streams ------------------------- */
'g-eng': {
  d: { en: 'Engineering turns science into products — machines, roads, circuits, software, vehicles and satellites. B.Tech / B.E. is a 4-year degree with branches such as Computer Science, Electronics, Mechanical, Civil, Electrical, Chemical and AI & Data Science.',
       hi: 'इंजीनियरिंग विज्ञान को उत्पादों में बदलती है — मशीन, सड़क, सर्किट, सॉफ़्टवेयर, वाहन व उपग्रह। B.Tech / B.E. 4 वर्ष की डिग्री है जिसकी शाखाएँ हैं — कंप्यूटर साइंस, इलेक्ट्रॉनिक्स, मैकेनिकल, सिविल, इलेक्ट्रिकल, केमिकल, AI व डेटा साइंस।' },
  study: { en: ['Maths, Physics, programming and core branch subjects', 'Labs, projects and industrial internships'], hi: ['गणित, भौतिकी, प्रोग्रामिंग व मुख्य शाखा के विषय', 'प्रयोगशाला, प्रोजेक्ट व औद्योगिक इंटर्नशिप'] },
  elig: { en: 'Class 12 with Physics, Chemistry and Maths (PCM).', hi: '12वीं में भौतिकी, रसायन व गणित (PCM)।' },
  exams: { en: 'JEE Main (NITs, IIITs, many universities) → JoSAA counselling; JEE Advanced (IITs); HSTES / state tests; university exams.', hi: 'JEE Main (NIT, IIIT, अनेक विश्वविद्यालय) → JoSAA काउंसलिंग; JEE Advanced (IIT); HSTES / राज्य परीक्षाएँ; विश्वविद्यालय परीक्षाएँ।' },
  tip: { en: 'The college and the effort you put in matter more than the branch name. Learn programming and build projects from Class 11.', hi: 'शाखा के नाम से अधिक कॉलेज और आपकी मेहनत मायने रखती है। 11वीं से प्रोग्रामिंग सीखें और प्रोजेक्ट बनाएँ।' } },
'g-design': {
  d: { en: 'Designing buildings and spaces: Architecture (B.Arch, 5 years) combines drawing, maths and creativity; Planning (B.Plan) shapes cities and villages.',
       hi: 'भवनों व स्थानों की डिज़ाइन: आर्किटेक्चर (B.Arch, 5 वर्ष) में ड्रॉइंग, गणित व रचनात्मकता का मेल है; प्लानिंग (B.Plan) शहरों व गाँवों को आकार देती है।' },
  study: { en: ['Architectural design studio, drawing, building materials, structures, history of architecture'], hi: ['आर्किटेक्चरल डिज़ाइन स्टूडियो, ड्रॉइंग, भवन-सामग्री, संरचनाएँ, वास्तुकला का इतिहास'] },
  elig: { en: 'Class 12 with Maths; drawing aptitude.', hi: '12वीं में गणित; ड्रॉइंग की अभिरुचि।' },
  exams: { en: 'NATA or JEE Main Paper 2 → counselling (JoSAA / state).', hi: 'NATA या JEE Main पेपर 2 → काउंसलिंग (JoSAA / राज्य)।' },
  tip: { en: 'Start sketching and observing buildings now — the aptitude test checks drawing and observation.', hi: 'अभी से स्केचिंग व भवनों का अवलोकन शुरू करें — परीक्षा में ड्रॉइंग व अवलोकन परखा जाता है।' } },
'g-pure': {
  d: { en: 'Pure science is for the curious — Physics, Chemistry, Maths, Biology, Biotechnology, Earth and Space science. Careers are in research labs, ISRO / DRDO / CSIR, universities, data science and teaching.',
       hi: 'शुद्ध विज्ञान जिज्ञासुओं के लिए है — भौतिकी, रसायन, गणित, जीव विज्ञान, बायोटेक्नोलॉजी, पृथ्वी व अंतरिक्ष विज्ञान। करियर शोध-प्रयोगशालाओं, ISRO / DRDO / CSIR, विश्वविद्यालयों, डेटा साइंस और शिक्षण में है।' },
  study: { en: ['B.Sc (3 years) or Integrated BS-MS (5 years)', 'Strong theory plus lab research; M.Sc / PhD for research careers'], hi: ['B.Sc (3 वर्ष) या इंटीग्रेटेड BS-MS (5 वर्ष)', 'मज़बूत सिद्धांत व प्रयोगशाला शोध; शोध करियर के लिए M.Sc / PhD'] },
  elig: { en: 'Class 12 Science (PCM or PCB depending on the subject).', hi: '12वीं विज्ञान (विषय अनुसार PCM या PCB)।' },
  exams: { en: 'CUET-UG, IISER Aptitude Test (IAT), NEST, JEE; later JAM / CSIR-NET for M.Sc and PhD.', hi: 'CUET-UG, IISER एप्टीट्यूड टेस्ट (IAT), NEST, JEE; बाद में M.Sc व PhD हेतु JAM / CSIR-NET।' },

  /* ---- global event delegation: any element with data-act="name" calls App.actions.name ---- */
  document.addEventListener('click', function (e) {

  /* internal links: set the hash from script (also works inside sandboxed / srcdoc previews) */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#/"]');

  document.addEventListener('input', function (e) {

  });

  App.actions.lang = function (el) {
    App.lang = el.getAttribute('data-v'); Store.set('lang', App.lang); App.rerender(true);
  };
  App.actions.fs = function (el) {
    var v = +el.getAttribute('data-v');
    App.fs = v === 0 ? 1 : Math.max(0.9, Math.min(1.3, +(App.fs + v * 0.1).toFixed(2)));
    Store.set('fs', App.fs); document.documentElement.style.setProperty('--fs', App.fs);
  };
  App.actions.menu = function (el) {
    var sh = document.getElementById('navsheet'), open = sh.classList.toggle('open');
    document.body.classList.toggle('sheet-open', open);
    Array.prototype.forEach.call(document.querySelectorAll('[data-act=menu][aria-controls]'), function (b) { b.setAttribute('aria-expanded', open); });
    if (open) { var f = sh.querySelector('a.on') || sh.querySelector('a'); if (f) f.focus(); } else { var b = document.querySelector('[data-act=menu][aria-controls]:not([hidden])'); if (b && b.offsetParent) b.focus(); }
  };
  document.addEventListener('keydown', function (e) {
    var sh = document.getElementById('navsheet');
    if (e.key === 'Escape' && sh && sh.classList.contains('open')) App.actions.menu();
  });
  App.actions.print = function () { window.print(); };
  App.actions.more = function (el) {
    var box = el.parentNode, open = !box.classList.contains('open');
    box.classList.toggle('open', open); el.setAttribute('aria-expanded', open);
  };
  document.addEventListener('click', function (e) {          // close “More” on any outside click or after choosing a link
    var box = document.querySelector('.more.open');
    if (box && (!box.contains(e.target) || e.target.closest('.more-list a'))) { box.classList.remove('open'); box.querySelector('.more-btn').setAttribute('aria-expanded', 'false'); }
  });

  window.addEventListener('hashchange', function () { App.render(); window.scrollTo(0, 0); var m = document.getElementById('main'); if (m) m.focus({ preventScroll: true }); });
  document.addEventListener('DOMContentLoaded', function () { App.render(); });
})();
